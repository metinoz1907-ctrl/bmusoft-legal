<style>
:root{--primary:#C2410C;--accent:#B45309;--bg:#FAF6F3;--card:#FFFFFF;--text:#0F172A;--text2:#475569;--border:#EEE3DB;--chip:#F7EDE6;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--primary:#FB8C5A;--accent:#EA7A45;--bg:#16100D;--card:#241A15;--text:#F3F4F6;--text2:#A8A29E;--border:#3A2A22;--chip:#2E211B;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
header{background:linear-gradient(135deg,#C2410C,#B45309);color:#fff;padding:36px 16px 72px}
.wrap{max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:16px}
.brand img{width:64px;height:64px;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
h1{margin:0;font-size:28px;line-height:1.2}
header p#sub{margin:2px 0 0;color:rgba(255,255,255,.88);font-size:15px}
nav.langs{max-width:760px;margin:-40px auto 0;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap}
nav.langs button{font:600 14px/1 inherit;font-family:inherit;padding:10px 16px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08)}
nav.langs button[aria-pressed="true"]{background:var(--primary);border-color:#fff;color:#fff;box-shadow:0 0 0 2px #fff,0 4px 12px rgba(0,0,0,.18)}
main{max-width:760px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.tabs a{padding:8px 14px;border-radius:999px;background:var(--chip);color:var(--primary);font-weight:600;font-size:14px;text-decoration:none}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:24px 22px;margin-bottom:16px;scroll-margin-top:16px}
h2{margin:0;font-size:22px}
h3{margin:22px 0 4px;font-size:17px}
.upd{margin:4px 0 12px;color:var(--text2);font-size:14px}
.intro{color:var(--text)}
p,li{color:var(--text2)}
p{margin:6px 0}
ul{margin:6px 0;padding-left:22px}
li{margin:4px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--border);flex-wrap:wrap}
.kv:first-of-type{border-top:0;margin-top:8px}
.kv span{color:var(--text2)}
a{color:var(--primary)}
footer{text-align:center;color:var(--text2);font-size:13px;padding:8px 16px 40px}
</style>
</head>

<script>
const T={"tr": {"name": "Türkçe", "title": "Gizlilik ve Kullanım Koşulları", "privacy": "Gizlilik Politikası", "terms": "Kullanım Koşulları", "updated": "Son güncelleme: 7 Kasım 2026", "contact": "İletişim", "dev": "Geliştirici", "support": "Destek", "intro": "Blok; apartman, site ve rezidans yöneticilerinin aidatları, tahsilatları, gelir-giderleri ve aylık raporlarını takip etmesi için hazırlanmış bir uygulamadır. Bu politika, uygulamanın verilerinizi nasıl işlediğini açıklar.", "p": [["Kısaca", "<ul><li>Hesap veya kayıt yoktur; uygulamayı açtığınız anda kullanırsınız.</li><li>Girdiğiniz tüm veriler yalnızca cihazınızda saklanır.</li><li>Verileriniz bize veya üçüncü kişilere gönderilmez; uygulamada reklam, analiz veya izleme aracı yoktur.</li></ul>"], ["Hangi verileri işliyoruz?", "Uygulamaya kendiniz girdiğiniz bilgiler işlenir: bina bilgileri (ad, adres, yönetici, denetçi, ödeme notu/IBAN), bloklar ve daireler, malik ve kiracıların adı, telefonu ve e-postası, araç plakaları ve park yerleri, aidat ve ek borçlar, tahsilatlar ve makbuzlar, gelir-gider kayıtları, hatırlatıcılar ve eklediğiniz dekont, fatura veya fotoğraflar. Bu bilgiler cihazınızdaki uygulama alanında durur; biz bunlara erişemeyiz. Kat maliklerine ve kiracılara ait bilgilerin veri sorumlusu sizsiniz: onları bilgilendirmek (ör. KVKK aydınlatma metni) ve yalnızca gerekli bilgiyi girmek size aittir."], ["Ekler, kamera ve dosyalar", "Kamerayı yalnızca siz bir ek eklemek istediğinizde (dekont, fatura, iş fotoğrafı) kullanırız. Galeriden ve Dosyalar'dan yalnızca sizin seçtiğiniz görseller ve PDF'ler alınır. Ekler cihazınızdaki uygulama alanında saklanır."], ["Yedekleme", "Yedekler, kendi seçtiğiniz bir klasöre (iPhone'da iCloud Drive, Android'de Google Drive veya cihaz) tek bir dosya olarak yazılır. Otomatik yedek Pro özelliğidir ve en yeni 5 yedek saklanır. Bu klasörlerdeki dosyalar ilgili hizmetin (Apple, Google) koşullarına tabidir; biz bu dosyalara erişemeyiz."], ["Paylaşım", "Makbuzlar, aylık raporlar, ekstreler, borçlu listesi, işletme projesi, devir teslim tutanağı ve duyurular PNG veya PDF olarak cihazınızın paylaşım menüsüyle gönderilir. Hatırlatma ve makbuz mesajları WhatsApp'ta hazır açılır; mesajı gönderip göndermemek size aittir. Panoya asılacak raporlarda isimleri gizleyebilirsiniz."], ["Bildirimler", "İzin verirseniz uygulama aidat yazım günü, son ödeme günü ve kendi hatırlatıcılarınız için yerel bildirimler gösterir. Bildirimler cihazınızda oluşturulur; hiçbir sunucu kullanılmaz. İzni istediğiniz zaman cihaz ayarlarından kapatabilirsiniz."], ["Satın almalar", "Blok Pro aboneliği App Store veya Google Play üzerinden satın alınır. Ödeme bilgilerinizi görmeyiz. Uygulama yalnızca aboneliğinizin etkin olup olmadığını mağazadan doğrular; internet bağlantısı bunun dışında kullanılmaz."], ["Çocuklar", "Blok bina yöneticileri için hazırlanmıştır ve çocuklara yönelik değildir. Bilerek çocuklardan veri toplamayız."], ["Verilerin silinmesi", "Ayarlar'daki “Örnek binayı sil” seçeneğiyle örnek verileri, “Baştan başla” seçeneğiyle tüm kayıtları silebilirsiniz. Uygulamayı kaldırdığınızda cihazdaki tüm veriler silinir. Yedek dosyalarını, kaydettiğiniz klasörden kendiniz silersiniz. Bizde verileriniz bulunmadığından ayrıca bir silme talebi gerekmez."], ["Değişiklikler", "Bu politika değişirse güncel hâli bu sayfada, yeni tarihle yayımlanır."]], "t": [["Kabul", "Blok'u indirerek veya kullanarak bu koşulları kabul etmiş olursunuz. Uygulamayı indirdiğiniz mağazanın (App Store, Google Play) kullanım koşulları da geçerlidir."], ["Lisans", "Size Blok'u yönettiğiniz bina veya siteler için kullanmanız amacıyla kişisel, devredilemez ve münhasır olmayan bir kullanım hakkı verilir. Uygulamayı kopyalamak, değiştirmek, tersine mühendislik yapmak veya yeniden satmak yasaktır."], ["Ücretsiz plan", "Ücretsiz planda daire sınırı yoktur; aidat, tahsilat, makbuz, hatırlatma, ilk aylık rapor ve 3 duyuru şablonu kullanılabilir. Diğer belgeler ve otomatik yedek için Pro gerekir. Ücretsiz belgelerin altında “Blok ile oluşturuldu” kartı bulunur."], ["Blok Pro aboneliği", "<p>Pro; her ay aylık rapor, daire ekstresi, borçlu listesi, işletme projesi, devir teslim tutanağı, tüm duyuru şablonları, otomatik yedek ve “Blok ile oluşturuldu” kartı olmadan belgeler sağlar.</p><ul><li>Aylık ve Yıllık olmak üzere iki plan vardır; fiyatlar mağazada yerel para biriminizle gösterilir.</li><li>Her iki planda 1 ay ücretsiz deneme sunulabilir; deneme bitmeden iptal etmezseniz seçtiğiniz plan ücretlendirilir. Denemenin kullanılmayan kısmı abonelik alındığında sona erer.</li><li>Ödeme, satın almayı onayladığınızda Apple ID'nizden veya Google Play hesabınızdan alınır.</li><li>Abonelik, dönem bitiminden en az 24 saat önce iptal edilmezse aynı süre ve fiyatla otomatik olarak yenilenir; yenileme ücreti dönem bitmeden önceki 24 saat içinde tahsil edilir.</li><li>Aboneliğinizi App Store veya Google Play hesap ayarlarınızdan yönetebilir ve iptal edebilirsiniz. İptal, içinde bulunulan dönemin sonunda geçerli olur; o güne kadar Pro açık kalır.</li><li>Abonelik sona erdiğinde verileriniz silinmez; yalnızca Pro özellikleri kapanır.</li></ul>"], ["İadeler", "Ödemeler mağaza tarafından alınır; iade talepleri App Store veya Google Play'in iade politikasına göre değerlendirilir."], ["Verileriniz ve yedekleriniz", "Verileriniz yalnızca cihazınızda bulunduğu için düzenli yedek almak sizin sorumluluğunuzdadır. Cihazın kaybolması, bozulması veya uygulamanın silinmesi sonucu yedeklenmemiş verileri geri getiremeyiz. Yönetici değiştiğinde verileri yedek dosyasıyla yeni yöneticiye siz aktarırsınız."], ["Belgeler fatura değildir", "Uygulamanın ürettiği makbuzlar, raporlar, ekstreler ve tutanaklar fatura veya mali belge değildir; bilgilendirme amaçlıdır. Gecikme tazminatı oranı, işletme projesi ve hazır duyuru metinleri örnek niteliğindedir; hukuki ya da mali danışmanlık yerine geçmez. Kat Mülkiyeti Kanunu ve yönetim planından doğan yükümlülükler size aittir."], ["Sorumluluk", "Blok “olduğu gibi” sunulur. Hatasız ve kesintisiz çalışacağı garanti edilmez. Yasaların izin verdiği ölçüde, uygulamanın kullanımından doğan dolaylı zararlardan, kâr veya veri kaybından sorumlu değiliz."], ["Değişiklikler", "Bu koşullar değişirse güncel hâli bu sayfada, yeni tarihle yayımlanır. Değişiklikten sonra uygulamayı kullanmaya devam etmeniz güncel koşulları kabul ettiğiniz anlamına gelir."]]}, "en": {"name": "English", "title": "Privacy and Terms of Use", "privacy": "Privacy Policy", "terms": "Terms of Use", "updated": "Last updated: 7 November 2026", "contact": "Contact", "dev": "Developer", "support": "Support", "intro": "Blok is an app for managers of apartment buildings, HOAs and residential complexes to track fees, payments, income and expenses and monthly reports. This policy explains how the app handles your data.", "p": [["In short", "<ul><li>There is no account or sign-up; you use the app as soon as you open it.</li><li>Everything you enter is stored only on your device.</li><li>Your data is never sent to us or to third parties; the app has no ads, analytics or tracking.</li></ul>"], ["What data do we process?", "Only what you enter yourself: building details (name, address, manager, auditor, payment note/bank details), blocks and units, owners' and tenants' names, phone numbers and emails, number plates and parking spaces, fees and extra charges, payments and receipts, income and expenses, reminders and the receipts, invoices or photos you attach. This information stays in the app's storage on your device; we cannot access it. You are the data controller for owners' and tenants' information: informing them and entering only what is necessary is your responsibility."], ["Attachments, camera and files", "The camera is used only when you choose to add an attachment (receipt, invoice, work photo). Only the images and PDFs you pick from your library or Files are imported. Attachments are stored in the app's storage on your device."], ["Backup", "Backups are written as a single file to a folder you choose (iCloud Drive on iPhone, Google Drive or the device on Android). Automatic backup is a Pro feature and keeps the 5 most recent backups. Files in these folders are subject to the provider's terms (Apple, Google); we cannot access them."], ["Sharing", "Receipts, monthly reports, statements, the arrears list, budget plan, handover report and notices are sent as PNG or PDF through your device's share sheet. Reminder and receipt messages open ready in WhatsApp; whether to send them is up to you. You can hide names on reports for the notice board."], ["Notifications", "If you allow it, the app shows local reminders for the fee posting day, the due date and your own reminders. Notifications are created on your device; no server is involved. You can turn them off in your device settings at any time."], ["Purchases", "The Blok Pro subscription is purchased through the App Store or Google Play. We never see your payment details. The app only checks with the store whether your subscription is active; the internet connection is not used for anything else."], ["Children", "Blok is designed for building managers and is not directed at children. We do not knowingly collect data from children."], ["Deleting your data", "Use “Delete sample building” in Settings to remove the sample data, or “Start over” to delete all records. Uninstalling the app removes all its data from the device. You delete backup files yourself from the folder you saved them to. Since we hold none of your data, no separate deletion request is needed."], ["Changes", "If this policy changes, the current version is published on this page with a new date."]], "t": [["Acceptance", "By downloading or using Blok you agree to these terms. The terms of the store you downloaded it from (App Store, Google Play) also apply."], ["Licence", "You are granted a personal, non-transferable, non-exclusive right to use Blok for the buildings or complexes you manage. Copying, modifying, reverse engineering or reselling the app is prohibited."], ["Free plan", "The free plan has no unit limit and includes fees, payments, receipts, reminders, the first monthly report and 3 notice templates. Other documents and automatic backup require Pro. Free documents carry a “Created with Blok” card."], ["Blok Pro subscription", "<p>Pro provides the monthly report every month, unit statements, the arrears list, budget plan, handover report, all notice templates, automatic backup and documents without the “Created with Blok” card.</p><ul><li>There are two plans, Monthly and Yearly; prices are shown in the store in your local currency.</li><li>Both plans may include a 1-month free trial; unless you cancel before it ends, the chosen plan is charged. Any unused part of the trial ends when you purchase a subscription.</li><li>Payment is charged to your Apple ID or Google Play account when you confirm the purchase.</li><li>The subscription renews automatically for the same period and price unless cancelled at least 24 hours before the end of the current period; the renewal is charged within the 24 hours before the period ends.</li><li>You can manage and cancel the subscription in your App Store or Google Play account settings. Cancellation takes effect at the end of the current period; Pro stays on until then.</li><li>When the subscription ends your data is not deleted; only the Pro features are turned off.</li></ul>"], ["Refunds", "Payments are processed by the store; refund requests are handled under the App Store or Google Play refund policy."], ["Your data and backups", "Because your data is stored only on your device, making regular backups is your responsibility. We cannot recover data that was not backed up if the device is lost or damaged or the app is deleted. When the manager changes, you hand the data over to the new manager with a backup file."], ["Documents are not invoices", "Receipts, reports, statements and handover reports produced by the app are for information only and are not invoices or tax documents. The late-fee rate, budget plan and ready-made notice texts are examples and do not replace legal or financial advice. Obligations under your local condominium law and bylaws remain yours."], ["Liability", "Blok is provided “as is”. We do not guarantee that it will be error-free or uninterrupted. To the extent permitted by law, we are not liable for indirect damages, loss of profit or loss of data arising from use of the app."], ["Changes", "If these terms change, the current version is published on this page with a new date. Continuing to use the app after a change means you accept the updated terms."]]}, "de": {"name": "Deutsch", "title": "Datenschutz und Nutzungsbedingungen", "privacy": "Datenschutzerklärung", "terms": "Nutzungsbedingungen", "updated": "Zuletzt aktualisiert: 7. November 2026", "contact": "Kontakt", "dev": "Entwickler", "support": "Support", "intro": "Blok ist eine App für Verwalterinnen und Verwalter von Mehrfamilienhäusern, Wohnanlagen und WEGs, um Hausgeld, Zahlungen, Einnahmen und Ausgaben sowie Monatsberichte zu verwalten. Diese Erklärung beschreibt, wie die App mit Ihren Daten umgeht.", "p": [["Kurz gesagt", "<ul><li>Es gibt kein Konto und keine Registrierung; Sie nutzen die App sofort nach dem Öffnen.</li><li>Alle eingegebenen Daten werden nur auf Ihrem Gerät gespeichert.</li><li>Ihre Daten werden weder an uns noch an Dritte gesendet; die App enthält keine Werbung, Analyse- oder Tracking-Werkzeuge.</li></ul>"], ["Welche Daten verarbeiten wir?", "Nur Angaben, die Sie selbst eingeben: Gebäudedaten (Name, Adresse, Verwalter, Beirat, Zahlungshinweis/IBAN), Häuser und Wohnungen, Namen, Telefonnummern und E-Mail-Adressen von Eigentümern und Mietern, Kennzeichen und Stellplätze, Hausgeld und Sonderumlagen, Zahlungen und Quittungen, Einnahmen und Ausgaben, Erinnerungen sowie angehängte Belege, Rechnungen oder Fotos. Diese Daten bleiben im Speicher der App auf Ihrem Gerät; wir haben keinen Zugriff darauf. Für die Daten der Eigentümer und Mieter sind Sie verantwortlich (DSGVO): Sie informieren die Betroffenen und erfassen nur das Nötige."], ["Anhänge, Kamera und Dateien", "Die Kamera wird nur verwendet, wenn Sie einen Anhang (Beleg, Rechnung, Arbeitsfoto) hinzufügen möchten. Aus der Mediathek und der Dateien-App werden nur die von Ihnen gewählten Bilder und PDFs übernommen. Anhänge werden im Speicher der App auf Ihrem Gerät abgelegt."], ["Backup", "Backups werden als eine Datei in einen von Ihnen gewählten Ordner geschrieben (auf dem iPhone iCloud Drive, unter Android Google Drive oder das Gerät). Das automatische Backup ist eine Pro-Funktion und behält die 5 neuesten Backups. Für Dateien in diesen Ordnern gelten die Bedingungen des jeweiligen Anbieters (Apple, Google); wir haben keinen Zugriff darauf."], ["Teilen", "Quittungen, Monatsberichte, Kontoauszüge, Rückstandsliste, Wirtschaftsplan, Übergabeprotokoll und Aushänge werden als PNG oder PDF über das Teilen-Menü Ihres Geräts versendet. Erinnerungs- und Quittungsnachrichten öffnen sich fertig in WhatsApp; ob Sie sie senden, entscheiden Sie. Bei Berichten für den Aushang können Sie Namen ausblenden."], ["Mitteilungen", "Wenn Sie zustimmen, zeigt die App lokale Erinnerungen zum Buchungstag des Hausgelds, zur Zahlungsfrist und zu Ihren eigenen Erinnerungen. Mitteilungen werden auf Ihrem Gerät erzeugt; es wird kein Server genutzt. Sie können sie jederzeit in den Geräteeinstellungen abschalten."], ["Käufe", "Das Abo Blok Pro wird über den App Store oder Google Play gekauft. Ihre Zahlungsdaten sehen wir nicht. Die App prüft beim Store nur, ob Ihr Abo aktiv ist; die Internetverbindung wird sonst nicht genutzt."], ["Kinder", "Blok richtet sich an Gebäudeverwalter und nicht an Kinder. Wir erheben wissentlich keine Daten von Kindern."], ["Löschen von Daten", "Mit „Beispielgebäude löschen“ in den Einstellungen entfernen Sie die Beispieldaten, mit „Neu beginnen“ alle Einträge. Beim Deinstallieren der App werden alle Daten auf dem Gerät gelöscht. Backup-Dateien löschen Sie selbst im gewählten Ordner. Da wir keine Daten von Ihnen haben, ist kein gesonderter Löschantrag nötig."], ["Änderungen", "Ändert sich diese Erklärung, wird die aktuelle Fassung mit neuem Datum auf dieser Seite veröffentlicht."]], "t": [["Annahme", "Mit dem Herunterladen oder Nutzen von Blok stimmen Sie diesen Bedingungen zu. Zusätzlich gelten die Bedingungen des Stores, aus dem Sie die App geladen haben (App Store, Google Play)."], ["Lizenz", "Sie erhalten ein persönliches, nicht übertragbares und nicht ausschließliches Recht, Blok für die von Ihnen verwalteten Gebäude oder Anlagen zu nutzen. Kopieren, Verändern, Reverse Engineering oder Weiterverkauf der App sind untersagt."], ["Kostenloser Tarif", "Im kostenlosen Tarif gibt es keine Begrenzung der Wohnungen; Hausgeld, Zahlungen, Quittungen, Erinnerungen, der erste Monatsbericht und 3 Aushang-Vorlagen sind enthalten. Weitere Dokumente und das automatische Backup erfordern Pro. Kostenlose Dokumente tragen eine Karte „Erstellt mit Blok“."], ["Abo Blok Pro", "<p>Pro bietet jeden Monat den Monatsbericht, Kontoauszüge je Wohnung, Rückstandsliste, Wirtschaftsplan, Übergabeprotokoll, alle Aushang-Vorlagen, automatisches Backup und Dokumente ohne die Karte „Erstellt mit Blok“.</p><ul><li>Es gibt zwei Tarife, monatlich und jährlich; die Preise werden im Store in Ihrer Landeswährung angezeigt.</li><li>Beide Tarife können einen kostenlosen Testmonat enthalten; wenn Sie nicht vor dessen Ende kündigen, wird der gewählte Tarif berechnet. Ein nicht genutzter Teil der Testphase verfällt beim Kauf eines Abos.</li><li>Die Zahlung wird bei Bestätigung des Kaufs über Ihre Apple-ID bzw. Ihr Google-Play-Konto abgerechnet.</li><li>Das Abo verlängert sich automatisch zum gleichen Zeitraum und Preis, sofern es nicht mindestens 24 Stunden vor Ende des laufenden Zeitraums gekündigt wird; die Verlängerung wird innerhalb der letzten 24 Stunden vor Ablauf berechnet.</li><li>Sie können das Abo in den Einstellungen Ihres App-Store- oder Google-Play-Kontos verwalten und kündigen. Die Kündigung wird zum Ende des laufenden Zeitraums wirksam; bis dahin bleibt Pro aktiv.</li><li>Nach Ende des Abos werden Ihre Daten nicht gelöscht; nur die Pro-Funktionen werden deaktiviert.</li></ul>"], ["Erstattungen", "Zahlungen werden vom Store abgewickelt; Erstattungsanträge werden nach den Richtlinien des App Store bzw. von Google Play bearbeitet."], ["Ihre Daten und Backups", "Da Ihre Daten nur auf Ihrem Gerät liegen, sind regelmäßige Backups Ihre Verantwortung. Nicht gesicherte Daten können wir bei Verlust oder Defekt des Geräts oder Löschen der App nicht wiederherstellen. Bei einem Verwalterwechsel übergeben Sie die Daten per Backup-Datei an die neue Verwaltung."], ["Dokumente sind keine Rechnungen", "Quittungen, Berichte, Kontoauszüge und Protokolle der App dienen nur der Information und sind keine Rechnungen oder steuerlichen Belege. Verzugszinssatz, Wirtschaftsplan und Textvorlagen sind Beispiele und ersetzen keine Rechts- oder Steuerberatung. Pflichten aus dem WEG und der Gemeinschaftsordnung bleiben bei Ihnen."], ["Haftung", "Blok wird „wie besehen“ bereitgestellt. Wir garantieren keinen fehlerfreien oder unterbrechungsfreien Betrieb. Soweit gesetzlich zulässig, haften wir nicht für mittelbare Schäden, entgangenen Gewinn oder Datenverlust aus der Nutzung der App."], ["Änderungen", "Ändern sich diese Bedingungen, wird die aktuelle Fassung mit neuem Datum auf dieser Seite veröffentlicht. Wenn Sie die App danach weiter nutzen, akzeptieren Sie die aktuellen Bedingungen."]]}, "fr": {"name": "Français", "title": "Confidentialité et conditions d’utilisation", "privacy": "Politique de confidentialité", "terms": "Conditions d’utilisation", "updated": "Dernière mise à jour : 7 novembre 2026", "contact": "Contact", "dev": "Développeur", "support": "Assistance", "intro": "Blok est une application destinée aux syndics bénévoles et gestionnaires d’immeubles, de résidences et de copropriétés pour suivre les charges, les encaissements, les recettes et dépenses et les rapports mensuels. Cette politique explique comment l’application traite vos données.", "p": [["En bref", "<ul><li>Aucun compte ni inscription : vous utilisez l’application dès son ouverture.</li><li>Toutes les données saisies sont stockées uniquement sur votre appareil.</li><li>Vos données ne nous sont jamais envoyées, ni à des tiers ; l’application ne contient ni publicité, ni outil d’analyse ou de suivi.</li></ul>"], ["Quelles données traitons-nous ?", "Uniquement celles que vous saisissez : informations de l’immeuble (nom, adresse, syndic, conseil syndical, note de paiement/IBAN), bâtiments et lots, noms, téléphones et e-mails des copropriétaires et locataires, plaques d’immatriculation et places de parking, charges et appels exceptionnels, encaissements et reçus, recettes et dépenses, rappels ainsi que les reçus, factures ou photos joints. Ces informations restent dans l’espace de l’application sur votre appareil ; nous n’y avons pas accès. Vous êtes responsable du traitement des données des copropriétaires et locataires (RGPD) : il vous appartient de les informer et de ne saisir que le nécessaire."], ["Pièces jointes, appareil photo et fichiers", "L’appareil photo n’est utilisé que lorsque vous ajoutez une pièce jointe (reçu, facture, photo de travaux). Seuls les images et PDF que vous choisissez dans la photothèque ou l’app Fichiers sont importés. Les pièces jointes sont conservées dans l’espace de l’application sur votre appareil."], ["Sauvegarde", "Les sauvegardes sont écrites sous forme d’un seul fichier dans un dossier que vous choisissez (iCloud Drive sur iPhone, Google Drive ou l’appareil sous Android). La sauvegarde automatique est une fonction Pro et conserve les 5 sauvegardes les plus récentes. Ces fichiers sont soumis aux conditions du service concerné (Apple, Google) ; nous n’y avons pas accès."], ["Partage", "Reçus, rapports mensuels, relevés, liste des impayés, budget prévisionnel, procès-verbal de passation et avis sont envoyés en PNG ou PDF via le menu de partage de votre appareil. Les messages de rappel et de reçu s’ouvrent prêts dans WhatsApp ; vous décidez de les envoyer. Vous pouvez masquer les noms sur les rapports destinés à l’affichage."], ["Notifications", "Si vous l’autorisez, l’application affiche des rappels locaux pour le jour d’appel des charges, la date limite et vos propres rappels. Les notifications sont créées sur votre appareil, sans serveur. Vous pouvez les désactiver à tout moment dans les réglages de l’appareil."], ["Achats", "L’abonnement Blok Pro est acheté via l’App Store ou Google Play. Nous ne voyons jamais vos informations de paiement. L’application vérifie seulement auprès du store si votre abonnement est actif ; la connexion Internet n’est pas utilisée pour autre chose."], ["Enfants", "Blok est conçu pour les gestionnaires d’immeubles et ne s’adresse pas aux enfants. Nous ne collectons pas sciemment de données d’enfants."], ["Suppression des données", "« Supprimer l’immeuble d’exemple » dans les Réglages efface les données d’exemple, « Recommencer » supprime tous les enregistrements. La désinstallation de l’application supprime toutes ses données de l’appareil. Vous supprimez vous-même les fichiers de sauvegarde dans le dossier choisi. Comme nous ne détenons aucune de vos données, aucune demande de suppression n’est nécessaire."], ["Modifications", "Si cette politique change, la version en vigueur est publiée sur cette page avec une nouvelle date."]], "t": [["Acceptation", "En téléchargeant ou en utilisant Blok, vous acceptez ces conditions. Les conditions du store d’où vous l’avez téléchargée (App Store, Google Play) s’appliquent également."], ["Licence", "Vous bénéficiez d’un droit personnel, non transférable et non exclusif d’utiliser Blok pour les immeubles ou résidences que vous gérez. Il est interdit de copier, modifier, décompiler ou revendre l’application."], ["Offre gratuite", "L’offre gratuite n’a pas de limite de lots et comprend les charges, encaissements, reçus, rappels, le premier rapport mensuel et 3 modèles d’avis. Les autres documents et la sauvegarde automatique nécessitent Pro. Les documents gratuits portent une carte « Créé avec Blok »."], ["Abonnement Blok Pro", "<p>Pro offre chaque mois le rapport mensuel, les relevés par lot, la liste des impayés, le budget prévisionnel, le procès-verbal de passation, tous les modèles d’avis, la sauvegarde automatique et des documents sans la carte « Créé avec Blok ».</p><ul><li>Deux formules existent, mensuelle et annuelle ; les prix sont affichés dans le store dans votre devise.</li><li>Les deux formules peuvent inclure un mois d’essai gratuit ; si vous ne résiliez pas avant la fin de l’essai, la formule choisie est facturée. La partie non utilisée de l’essai prend fin à l’achat d’un abonnement.</li><li>Le paiement est débité de votre identifiant Apple ou de votre compte Google Play à la confirmation de l’achat.</li><li>L’abonnement se renouvelle automatiquement pour la même durée et le même prix sauf résiliation au moins 24 heures avant la fin de la période en cours ; le renouvellement est facturé dans les 24 heures précédant la fin de la période.</li><li>Vous pouvez gérer et résilier l’abonnement dans les réglages de votre compte App Store ou Google Play. La résiliation prend effet à la fin de la période en cours ; Pro reste actif jusque-là.</li><li>À la fin de l’abonnement, vos données ne sont pas supprimées ; seules les fonctions Pro sont désactivées.</li></ul>"], ["Remboursements", "Les paiements sont traités par le store ; les demandes de remboursement relèvent de la politique de l’App Store ou de Google Play."], ["Vos données et sauvegardes", "Vos données n’étant stockées que sur votre appareil, effectuer des sauvegardes régulières relève de votre responsabilité. Nous ne pouvons pas récupérer des données non sauvegardées en cas de perte ou de panne de l’appareil ou de suppression de l’application. Lors d’un changement de syndic, vous transmettez les données au nouveau gestionnaire par un fichier de sauvegarde."], ["Les documents ne sont pas des factures", "Les reçus, rapports, relevés et procès-verbaux produits par l’application ont une valeur d’information et ne sont ni des factures ni des pièces comptables officielles. Le taux de pénalité, le budget prévisionnel et les modèles de texte sont des exemples et ne remplacent pas un conseil juridique ou comptable. Les obligations prévues par la loi sur la copropriété et le règlement restent les vôtres."], ["Responsabilité", "Blok est fourni « en l’état ». Nous ne garantissons pas un fonctionnement sans erreur ni interruption. Dans les limites permises par la loi, nous ne sommes pas responsables des dommages indirects, pertes de profit ou de données liés à l’utilisation de l’application."], ["Modifications", "Si ces conditions changent, la version en vigueur est publiée sur cette page avec une nouvelle date. Continuer à utiliser l’application après une modification vaut acceptation des conditions mises à jour."]]}, "it": {"name": "Italiano", "title": "Privacy e termini di utilizzo", "privacy": "Informativa sulla privacy", "terms": "Termini di utilizzo", "updated": "Ultimo aggiornamento: 7 novembre 2026", "contact": "Contatti", "dev": "Sviluppatore", "support": "Assistenza", "intro": "Blok è un’app per amministratori di condominio, residenze e complessi per gestire quote, incassi, entrate e uscite e rendiconti mensili. Questa informativa spiega come l’app tratta i tuoi dati.", "p": [["In breve", "<ul><li>Nessun account né registrazione: usi l’app appena la apri.</li><li>Tutti i dati inseriti restano solo sul tuo dispositivo.</li><li>I tuoi dati non vengono mai inviati a noi o a terzi; l’app non contiene pubblicità, strumenti di analisi o tracciamento.</li></ul>"], ["Quali dati trattiamo?", "Solo quelli che inserisci tu: dati dell’edificio (nome, indirizzo, amministratore, revisore, nota di pagamento/IBAN), scale e unità, nomi, telefoni ed email di proprietari e inquilini, targhe e posti auto, quote e addebiti straordinari, incassi e ricevute, entrate e uscite, promemoria e le ricevute, fatture o foto allegate. Queste informazioni restano nello spazio dell’app sul dispositivo; noi non vi accediamo. Sei titolare del trattamento dei dati di proprietari e inquilini (GDPR): spetta a te informarli e inserire solo il necessario."], ["Allegati, fotocamera e file", "La fotocamera si usa solo quando scegli di aggiungere un allegato (ricevuta, fattura, foto dei lavori). Vengono importati solo le immagini e i PDF che scegli dalla libreria o dall’app File. Gli allegati sono salvati nello spazio dell’app sul dispositivo."], ["Backup", "I backup vengono scritti come un unico file in una cartella che scegli tu (iCloud Drive su iPhone, Google Drive o il dispositivo su Android). Il backup automatico è una funzione Pro e conserva i 5 backup più recenti. I file in queste cartelle sono soggetti ai termini del servizio (Apple, Google); noi non vi accediamo."], ["Condivisione", "Ricevute, rendiconti mensili, estratti conto, elenco morosi, preventivo, verbale di passaggio e avvisi si inviano in PNG o PDF dal menu di condivisione del dispositivo. I messaggi di promemoria e di ricevuta si aprono pronti in WhatsApp; decidi tu se inviarli. Nei report da affiggere puoi nascondere i nomi."], ["Notifiche", "Se lo consenti, l’app mostra promemoria locali per il giorno di addebito delle quote, la scadenza e i tuoi promemoria. Le notifiche sono create sul dispositivo, senza server. Puoi disattivarle in qualsiasi momento dalle impostazioni del dispositivo."], ["Acquisti", "L’abbonamento Blok Pro si acquista tramite App Store o Google Play. Non vediamo mai i tuoi dati di pagamento. L’app verifica con lo store solo se l’abbonamento è attivo; la connessione Internet non è usata per altro."], ["Minori", "Blok è pensata per gli amministratori di edifici e non si rivolge ai minori. Non raccogliamo consapevolmente dati di minori."], ["Eliminazione dei dati", "Con «Elimina edificio di esempio» nelle Impostazioni rimuovi i dati di esempio, con «Ricomincia» tutti i record. Disinstallando l’app vengono eliminati tutti i suoi dati dal dispositivo. I file di backup li elimini tu dalla cartella scelta. Poiché non conserviamo alcun tuo dato, non serve una richiesta di cancellazione."], ["Modifiche", "Se questa informativa cambia, la versione aggiornata viene pubblicata su questa pagina con una nuova data."]], "t": [["Accettazione", "Scaricando o usando Blok accetti questi termini. Si applicano anche i termini dello store da cui l’hai scaricata (App Store, Google Play)."], ["Licenza", "Ti viene concesso un diritto personale, non trasferibile e non esclusivo di usare Blok per gli edifici o complessi che amministri. È vietato copiare, modificare, decompilare o rivendere l’app."], ["Piano gratuito", "Il piano gratuito non ha limiti di unità e comprende quote, incassi, ricevute, promemoria, il primo rendiconto mensile e 3 modelli di avviso. Gli altri documenti e il backup automatico richiedono Pro. I documenti gratuiti riportano una scheda «Creato con Blok»."], ["Abbonamento Blok Pro", "<p>Pro offre ogni mese il rendiconto mensile, gli estratti conto per unità, l’elenco morosi, il preventivo, il verbale di passaggio, tutti i modelli di avviso, il backup automatico e documenti senza la scheda «Creato con Blok».</p><ul><li>Ci sono due piani, mensile e annuale; i prezzi sono indicati nello store nella tua valuta.</li><li>Entrambi i piani possono includere un mese di prova gratuita; se non disdici prima della fine, viene addebitato il piano scelto. La parte non usata della prova termina con l’acquisto di un abbonamento.</li><li>Il pagamento viene addebitato sul tuo ID Apple o account Google Play alla conferma dell’acquisto.</li><li>L’abbonamento si rinnova automaticamente per la stessa durata e allo stesso prezzo se non disdetto almeno 24 ore prima della fine del periodo; il rinnovo viene addebitato nelle 24 ore precedenti la fine del periodo.</li><li>Puoi gestire e disdire l’abbonamento dalle impostazioni del tuo account App Store o Google Play. La disdetta ha effetto alla fine del periodo in corso; fino ad allora Pro resta attivo.</li><li>Alla fine dell’abbonamento i tuoi dati non vengono eliminati; si disattivano solo le funzioni Pro.</li></ul>"], ["Rimborsi", "I pagamenti sono gestiti dallo store; le richieste di rimborso seguono le regole dell’App Store o di Google Play."], ["I tuoi dati e i backup", "Poiché i dati sono solo sul tuo dispositivo, fare backup regolari è tua responsabilità. Non possiamo recuperare dati non salvati in caso di perdita o guasto del dispositivo o eliminazione dell’app. Al cambio di amministratore trasferisci i dati al nuovo amministratore con un file di backup."], ["I documenti non sono fatture", "Ricevute, rendiconti, estratti e verbali prodotti dall’app hanno valore informativo e non sono fatture né documenti fiscali. Il tasso di mora, il preventivo e i testi pronti sono esempi e non sostituiscono una consulenza legale o fiscale. Gli obblighi previsti dalla normativa condominiale e dal regolamento restano a tuo carico."], ["Responsabilità", "Blok è fornita «così com’è». Non garantiamo un funzionamento privo di errori o interruzioni. Nei limiti di legge non rispondiamo di danni indiretti, mancati guadagni o perdita di dati derivanti dall’uso dell’app."], ["Modifiche", "Se questi termini cambiano, la versione aggiornata viene pubblicata su questa pagina con una nuova data. Continuando a usare l’app dopo una modifica accetti i termini aggiornati."]]}};
const L=["tr","en","de","fr","it"], APP="Blok", KEY="blok-legal-lang";
function langFromHash(){const m=(location.hash||"").match(/^#(tr|en|de|fr|it)(-(privacy|terms|contact))?$/);return m?m[1]:null;}
function pick(){const h=langFromHash();if(h)return h;try{const s=localStorage.getItem(KEY);if(L.includes(s))return s;}catch(x){}
 for(const l of (navigator.languages||[navigator.language||"en"])){const c=String(l).slice(0,2).toLowerCase();if(L.includes(c))return c;}return "en";}
function render(l){const d=T[l];document.documentElement.lang=l;document.title=APP+" – "+d.title;
 document.getElementById("sub").textContent=d.title;
 document.getElementById("langs").innerHTML=L.map(x=>`<button type="button" data-l="${x}" aria-pressed="${x===l}">${T[x].name}</button>`).join("");
 const sec=(id,h,items)=>`<section class="card" id="${l}-${id}"><h2>${h}</h2><p class="upd">${d.updated}</p>${id==="privacy"?`<p class="intro">${d.intro}</p>`:""}${items.map(([a,b])=>`<h3>${a}</h3>${b.startsWith("<")?b:`<p>${b}</p>`}`).join("")}</section>`;
 document.getElementById("main").innerHTML=`<div class="tabs"><a href="#${l}-privacy">${d.privacy}</a><a href="#${l}-terms">${d.terms}</a></div>`+sec("privacy",d.privacy,d.p)+sec("terms",d.terms,d.t)+
  `<section class="card" id="${l}-contact"><h2>${d.contact}</h2><div class="kv"><span>${d.dev}</span><b>Metin Öz</b></div><div class="kv"><span>${d.support}</span><a href="mailto:metin.ozzz@icloud.com?subject=${APP}">metin.ozzz@icloud.com</a></div></section>`;
 document.getElementById("foot").textContent="© "+new Date().getFullYear()+" Metin Öz · "+APP;}
document.addEventListener("click",e=>{const b=e.target.closest("[data-l]");if(b){e.preventDefault();const l=b.dataset.l;render(l);
  try{localStorage.setItem(KEY,l);}catch(x){}try{history.replaceState(null,"","#"+l+"-privacy");}catch(x){}window.scrollTo(0,0);return;}
 const a=e.target.closest('a[href^="#"]');if(a){e.preventDefault();const el=document.getElementById(a.getAttribute("href").slice(1));if(el)el.scrollIntoView({behavior:"smooth"});}});
window.addEventListener("hashchange",()=>{const h=langFromHash();if(h&&document.documentElement.lang!==h)render(h);const el=document.getElementById(location.hash.slice(1));if(el)el.scrollIntoView();});
render(pick());if(location.hash){const el=document.getElementById(location.hash.slice(1));if(el)setTimeout(()=>el.scrollIntoView(),0);}
</script>
