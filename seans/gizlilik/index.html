<style>
:root{--primary:#C026D3;--accent:#7C3AED;--bg:#FAF6FB;--card:#FFFFFF;--text:#0F172A;--text2:#475569;--border:#EADCEF;--chip:#F5ECF7;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--primary:#E879F9;--accent:#A78BFA;--bg:#130D17;--card:#211726;--text:#F3F4F6;--text2:#A69FAB;--border:#3A2942;--chip:#2B1E31;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
header{background:linear-gradient(135deg,#C026D3,#7C3AED);color:#fff;padding:36px 16px 72px}
.wrap{max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:16px}
.brand img{width:64px;height:64px;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
h1{margin:0;font-size:28px;line-height:1.2}
header p#sub{margin:2px 0 0;color:rgba(255,255,255,.88);font-size:15px}
nav.langs{max-width:760px;margin:-40px auto 0;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap}
nav.langs button{font:600 14px/1 inherit;font-family:inherit;padding:10px 16px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08)}
nav.langs button[aria-pressed="true"]{background:var(--primary);border-color:#fff;color:#fff;box-shadow:0 0 0 2px #fff,0 4px 12px rgba(0,0,0,.18)}
main{max-width:760px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.tabs a{padding:8px 14px;border-radius:999px;background:var(--chip);color:var(--primary);font-weight:600;font-size:14px;text-decoration:none}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:24px 22px;margin-bottom:16px;scroll-margin-top:16px}
h2{margin:0;font-size:22px}
h3{margin:22px 0 4px;font-size:17px}
.upd{margin:4px 0 12px;color:var(--text2);font-size:14px}
.intro{color:var(--text)}
p,li{color:var(--text2)}
p{margin:6px 0}
ul{margin:6px 0;padding-left:22px}
li{margin:4px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--border);flex-wrap:wrap}
.kv:first-of-type{border-top:0;margin-top:8px}
.kv span{color:var(--text2)}
a{color:var(--primary)}
footer{text-align:center;color:var(--text2);font-size:13px;padding:8px 16px 40px}
</style>

<script>
const T={"tr": {"name": "Türkçe", "title": "Gizlilik ve Kullanım Koşulları", "privacy": "Gizlilik Politikası", "terms": "Kullanım Koşulları", "updated": "Son güncelleme: 8 Kasım 2026", "contact": "İletişim", "dev": "Geliştirici", "support": "Destek", "intro": "Seans; güzellik merkezi, kuaför, pilates-yoga stüdyosu, diyetisyen, fizyoterapist, kurs ve benzeri randevu ile paket seans çalışan işletmelerin randevu, paket, müşteri, kasa, personel ve stok takibi için hazırlanmış bir uygulamadır. Bu politika, uygulamanın verilerinizi nasıl işlediğini açıklar.", "p": [["Kısaca", "<ul><li>Hesap veya kayıt yoktur; uygulamayı açtığınız anda kullanırsınız.</li><li>Girdiğiniz tüm veriler yalnızca cihazınızda saklanır.</li><li>Verileriniz bize veya üçüncü kişilere gönderilmez; uygulamada reklam, analiz veya izleme aracı yoktur.</li></ul>"], ["Hangi verileri işliyoruz?", "Uygulamaya kendiniz girdiğiniz bilgiler işlenir: işletme bilgileri (ad, telefon, adres, ödeme notu), personel ve çalışma saatleri, maaş ve prim kuralları, hizmetler ve paket şablonları, müşterilerin adı, telefonu, e-postası, adresi, doğum günü, notları, fatura bilgileri ve sizin eklediğiniz bakım, sağlık ve ölçüm notları, randevular, paketler, tahsilatlar, gelir-gider, stok ve tedarikçi kayıtları. Bu bilgiler cihazınızdaki uygulama alanında durur; biz bunlara erişemeyiz. Müşterilerinize ait bilgilerin veri sorumlusu sizsiniz: onları bilgilendirmek (ör. KVKK aydınlatma metni), sağlık gibi özel nitelikli bilgiler için gerekli izni almak ve yalnızca gerekli bilgiyi girmek size aittir."], ["Rehber", "Rehber izni yalnızca siz \"Rehberden ekle\" dediğinizde ve seçtiğiniz kişiler için kullanılır. Seçilen kişilerin yalnızca adı ve telefonu müşteri olarak eklenir; rehberinizin geri kalanı okunmaz ve cihazdan dışarı gönderilmez."], ["Yedekleme", "Yedekler, kendi seçtiğiniz bir klasöre (iCloud Drive veya Dosyalar) tek bir dosya olarak yazılır. Otomatik yedek Pro özelliğidir ve en yeni 5 yedek saklanır. Bu klasörlerdeki dosyalar ilgili hizmetin (Apple) koşullarına tabidir; biz bu dosyalara erişemeyiz."], ["Paylaşım", "Randevu bilgisi, hatırlatma, makbuz, paket satış fişi, seans kartı, prim dökümü, müşteri ekstresi ve raporlar PNG veya PDF olarak cihazınızın paylaşım menüsüyle gönderilir. Hatırlatma ve bilgilendirme mesajları WhatsApp'ta hazır açılır; mesajı gönderip göndermemek size aittir. Ticari ileti göndermeden önce müşterinin iznini almanız gerekir; uygulamadaki \"mesaj izni\" alanı bunu kaydetmeniz içindir."], ["Bildirimler", "İzin verirseniz uygulama randevulardan önce ve randevu olan günlerin sabahı yerel bildirim gösterir. Bildirimler cihazınızda oluşturulur; hiçbir sunucu kullanılmaz. İzni istediğiniz zaman cihaz ayarlarından kapatabilirsiniz."], ["Uygulama kilidi", "Uygulama kilidini açarsanız Face ID, Touch ID veya cihaz parolası kullanılır. Kimlik doğrulama tamamen cihazınızda yapılır; biyometrik verilerinize erişemeyiz."], ["Satın almalar", "Seans Pro aboneliği App Store üzerinden satın alınır. Ödeme bilgilerinizi görmeyiz. Uygulama yalnızca aboneliğinizin etkin olup olmadığını mağazadan doğrular; bunun için kişisel veri gönderilmez."], ["Çocuklar", "Seans işletmeler için hazırlanmıştır ve 13 yaşın altındaki çocuklara yönelik değildir. Uygulamaya çocuklara ait bilgi (ör. kursa gelen öğrenci ve veli bilgisi) girerseniz bunun sorumluluğu ve gerekli izinler size aittir."], ["Verilerin silinmesi", "Ayarlar › Örnek verileri sil ile örnek kayıtları, Ayarlar › Baştan kur ile tüm verileri silebilirsiniz. Uygulamayı silmek de cihazdaki tüm verileri kaldırır. Seçtiğiniz klasördeki yedek dosyalarını oradan kendiniz silebilirsiniz."], ["Değişiklikler", "Bu politika değişirse güncel hâli bu sayfada yeni tarihle yayımlanır."]], "t": [["Kabul", "Seans'ı indirerek veya kullanarak bu koşulları kabul etmiş olursunuz. App Store'un kullanım koşulları da geçerlidir."], ["Lisans", "Size uygulamayı kendi işletmeniz için kullanmanız amacıyla kişisel, devredilemez ve münhasır olmayan bir kullanım hakkı verilir. Uygulamayı kopyalamak, değiştirmek, yeniden satmak veya tersine mühendislik yapmak yasaktır."], ["Ücretsiz plan", "Ücretsiz planda her ay 20 işlem yapılabilir. Randevu, paket satışı, tahsilat, gelir-gider ve ürün alış-satışı birer işlem sayılır; müşteri, personel, hizmet ve ürün tanımlamak işlem sayılmaz. Hak her ayın 1'inde yenilenir. Ücretsiz planda belgelerin altında \"Seans ile oluşturuldu\" kartı yer alır."], ["Seans Pro aboneliği", "<ul><li>Seans Pro aylık ve yıllık otomatik yenilenen abonelik olarak sunulur; fiyatlar mağazada yerel para biriminizle gösterilir.</li><li>Ödeme, satın alma onayıyla App Store hesabınızdan alınır.</li><li>Abonelik, dönem bitmeden en az 24 saat önce iptal edilmezse otomatik yenilenir; yenileme ücreti dönemin bitiminden önceki 24 saat içinde tahsil edilir.</li><li>Aboneliği App Store hesap ayarlarınızdan yönetebilir ve iptal edebilirsiniz. İptal, içinde bulunulan dönemin sonunda geçerli olur; o zamana kadar Pro açık kalır.</li><li>Ücretsiz deneme sunulursa, deneme süresinde abonelik satın alındığında denemenin kalan süresi sona erer.</li><li>Abonelik bittiğinde verileriniz silinmez; yalnızca Pro özellikleri kapanır.</li></ul>"], ["İadeler", "Ödemeler mağaza tarafından alınır; iade talepleri App Store'un iade kurallarına göre değerlendirilir."], ["Verileriniz ve yedekleriniz", "Veriler yalnızca cihazınızda bulunduğundan düzenli yedek almak sizin sorumluluğunuzdadır. Cihaz kaybı, arızası veya uygulamanın silinmesi hâlinde yedeklenmemiş verileri geri getiremeyiz."], ["Belgeler fatura değildir", "Uygulamanın ürettiği makbuz, fiş, seans kartı, ekstre, prim dökümü ve raporlar bilgi amaçlıdır; fatura veya mali belge yerine geçmez. İade hesabı, prim ve maaş hesapları örnek hesaplamalardır; hukuki, mali veya vergisel danışmanlık değildir. Fatura kesme ve vergi yükümlülükleri size aittir."], ["Sağlık bilgileri", "Müşteri kartındaki sağlık, alerji ve ölçüm alanları yalnızca sizin notlarınızdır. Seans tıbbi bir cihaz değildir; tanı, tedavi veya tıbbi karar için kullanılmamalıdır."], ["Sorumluluk", "Seans \"olduğu gibi\" sunulur. Kesintisiz veya hatasız çalışacağını garanti etmeyiz. Yasaların izin verdiği ölçüde, uygulamanın kullanımından doğan dolaylı zarar, kâr kaybı veya veri kaybından sorumlu değiliz."], ["Değişiklikler", "Bu koşullar değişirse güncel hâli bu sayfada yeni tarihle yayımlanır. Değişiklikten sonra uygulamayı kullanmaya devam etmeniz güncel koşulları kabul ettiğiniz anlamına gelir."]]}, "en": {"name": "English", "title": "Privacy and Terms of Use", "privacy": "Privacy Policy", "terms": "Terms of Use", "updated": "Last updated: 8 November 2026", "contact": "Contact", "dev": "Developer", "support": "Support", "intro": "Seans is an app for businesses that work with appointments and session packages — beauty salons, hairdressers, pilates and yoga studios, dietitians, physiotherapists, course centres and similar — to manage appointments, packages, customers, cash, staff and stock. This policy explains how the app handles your data.", "p": [["In short", "<ul><li>There is no account or sign-up; you start using the app as soon as you open it.</li><li>Everything you enter is stored only on your device.</li><li>Your data is never sent to us or to third parties; the app contains no ads, analytics or tracking.</li></ul>"], ["What data we process", "Only the information you enter yourself: business details (name, phone, address, payment note), staff and working hours, salary and commission rules, services and package templates, customers' names, phone numbers, emails, addresses, birthdays, notes, billing details and any care, health and measurement notes you add, appointments, packages, payments, income and expenses, stock and supplier records. This information stays in the app's storage on your device; we cannot access it. You are the data controller for your customers' information: informing them (e.g. under the GDPR), obtaining any consent required for special categories such as health data, and entering only what is necessary is your responsibility."], ["Contacts", "Contacts access is used only when you tap \"Add from contacts\", and only for the people you select. Only the selected people's name and phone number are added as customers; the rest of your address book is not read and nothing leaves your device."], ["Backup", "Backups are written as a single file to a folder you choose (iCloud Drive or Files). Automatic backup is a Pro feature and keeps the 5 most recent backups. Files in these folders are subject to the provider's (Apple's) terms; we cannot access them."], ["Sharing", "Appointment details, reminders, receipts, package slips, session cards, commission statements, customer statements and reports are sent as PNG or PDF through your device's share menu. Reminder and information messages open ready in WhatsApp; whether to send them is up to you. You need the customer's consent before sending marketing messages; the \"message consent\" field in the app lets you record it."], ["Notifications", "If you allow it, the app shows local notifications before appointments and on the morning of appointment days. Notifications are created on your device; no server is used. You can turn this off at any time in your device settings."], ["App lock", "If you enable the app lock, Face ID, Touch ID or your device passcode is used. Authentication happens entirely on your device; we have no access to your biometric data."], ["Purchases", "The Seans Pro subscription is purchased through the App Store. We never see your payment details. The app only checks with the store whether your subscription is active; no personal data is sent for this."], ["Children", "Seans is made for businesses and is not directed at children under 13. If you enter information about children (e.g. students and parents of a course), you are responsible for it and for any required consent."], ["Deleting data", "Delete sample records with Settings › Delete sample data, or all data with Settings › Start over. Deleting the app also removes all data from the device. Backup files in the folder you chose can be deleted there by you."], ["Changes", "If this policy changes, the updated version will be published on this page with a new date."]], "t": [["Acceptance", "By downloading or using Seans you accept these terms. The App Store terms of use also apply."], ["Licence", "You are granted a personal, non-transferable, non-exclusive right to use the app for your own business. Copying, modifying, reselling or reverse-engineering the app is prohibited."], ["Free plan", "The free plan allows 20 actions per month. Appointments, package sales, payments, income/expenses and product purchases/sales each count as one action; adding customers, staff, services and products does not. The allowance renews on the 1st of each month. On the free plan, documents show a \"Created with Seans\" card."], ["Seans Pro subscription", "<ul><li>Seans Pro is offered as monthly and yearly auto-renewing subscriptions; prices are shown in the store in your local currency.</li><li>Payment is charged to your App Store account at confirmation of purchase.</li><li>The subscription renews automatically unless cancelled at least 24 hours before the end of the current period; renewal is charged within 24 hours before the end of the period.</li><li>You can manage and cancel the subscription in your App Store account settings. Cancellation takes effect at the end of the current period; Pro stays active until then.</li><li>If a free trial is offered, any unused portion of the trial is forfeited when you purchase a subscription.</li><li>When the subscription ends your data is not deleted; only Pro features are switched off.</li></ul>"], ["Refunds", "Payments are processed by the store; refund requests are handled under the App Store refund rules."], ["Your data and backups", "Because your data is only on your device, making regular backups is your responsibility. We cannot recover data that was not backed up if the device is lost or damaged or the app is deleted."], ["Documents are not invoices", "Receipts, slips, session cards, statements, commission statements and reports produced by the app are for information only and do not replace invoices or tax documents. Refund, commission and salary calculations are examples and are not legal, financial or tax advice. Invoicing and tax obligations remain yours."], ["Health information", "The health, allergy and measurement fields on the customer card are only your notes. Seans is not a medical device and must not be used for diagnosis, treatment or medical decisions."], ["Liability", "Seans is provided \"as is\". We do not guarantee uninterrupted or error-free operation. To the extent permitted by law we are not liable for indirect damages, lost profits or data loss arising from use of the app."], ["Changes", "If these terms change, the updated version will be published on this page with a new date. Continuing to use the app after a change means you accept the updated terms."]]}, "de": {"name": "Deutsch", "title": "Datenschutz und Nutzungsbedingungen", "privacy": "Datenschutzerklärung", "terms": "Nutzungsbedingungen", "updated": "Zuletzt aktualisiert: 8. November 2026", "contact": "Kontakt", "dev": "Entwickler", "support": "Support", "intro": "Seans ist eine App für Betriebe, die mit Terminen und Sitzungspaketen arbeiten – Kosmetikstudios, Friseure, Pilates- und Yogastudios, Ernährungsberater, Physiotherapeuten, Kursanbieter und ähnliche –, um Termine, Pakete, Kunden, Kasse, Mitarbeiter und Lager zu verwalten. Diese Erklärung beschreibt, wie die App mit Ihren Daten umgeht.", "p": [["Kurz gesagt", "<ul><li>Es gibt kein Konto und keine Registrierung; Sie nutzen die App sofort nach dem Öffnen.</li><li>Alle eingegebenen Daten werden ausschließlich auf Ihrem Gerät gespeichert.</li><li>Ihre Daten werden weder an uns noch an Dritte übertragen; die App enthält keine Werbung, Analyse- oder Tracking-Tools.</li></ul>"], ["Welche Daten verarbeitet werden", "Nur die Angaben, die Sie selbst eingeben: Betriebsdaten (Name, Telefon, Adresse, Zahlungshinweis), Mitarbeiter und Arbeitszeiten, Gehalts- und Provisionsregeln, Leistungen und Paketvorlagen, Namen, Telefonnummern, E-Mail-Adressen, Adressen, Geburtstage, Notizen und Rechnungsdaten der Kunden sowie von Ihnen hinzugefügte Pflege-, Gesundheits- und Messnotizen, Termine, Pakete, Zahlungen, Einnahmen und Ausgaben, Lager- und Lieferanteneinträge. Diese Daten bleiben im Speicher der App auf Ihrem Gerät; wir haben keinen Zugriff. Für die Daten Ihrer Kunden sind Sie Verantwortlicher im Sinne der DSGVO: Die Information der Betroffenen, die erforderliche Einwilligung für besondere Kategorien wie Gesundheitsdaten und die Beschränkung auf notwendige Angaben liegen bei Ihnen."], ["Kontakte", "Der Zugriff auf Kontakte wird nur genutzt, wenn Sie „Aus Kontakten hinzufügen“ wählen, und nur für die ausgewählten Personen. Übernommen werden nur Name und Telefonnummer; der Rest Ihres Adressbuchs wird nicht gelesen und nichts verlässt Ihr Gerät."], ["Datensicherung", "Sicherungen werden als einzelne Datei in einen von Ihnen gewählten Ordner (iCloud Drive oder Dateien) geschrieben. Die automatische Sicherung ist eine Pro-Funktion; die 5 neuesten Sicherungen bleiben erhalten. Dateien in diesen Ordnern unterliegen den Bedingungen des Anbieters (Apple); wir haben keinen Zugriff darauf."], ["Teilen", "Termindetails, Erinnerungen, Quittungen, Paketbelege, Sitzungskarten, Provisionsabrechnungen, Kundenauszüge und Berichte werden als PNG oder PDF über das Teilen-Menü Ihres Geräts versendet. Erinnerungs- und Infonachrichten öffnen sich fertig in WhatsApp; ob Sie sie senden, entscheiden Sie. Für Werbenachrichten benötigen Sie die Einwilligung des Kunden; im Feld „Nachrichten-Einwilligung“ können Sie diese festhalten."], ["Mitteilungen", "Wenn Sie es erlauben, zeigt die App lokale Mitteilungen vor Terminen und morgens an Termintagen. Mitteilungen werden auf Ihrem Gerät erzeugt; es wird kein Server verwendet. Sie können dies jederzeit in den Geräteeinstellungen abschalten."], ["App-Sperre", "Wenn Sie die App-Sperre aktivieren, werden Face ID, Touch ID oder der Gerätecode verwendet. Die Prüfung erfolgt vollständig auf Ihrem Gerät; auf biometrische Daten haben wir keinen Zugriff."], ["Käufe", "Das Abo Seans Pro wird über den App Store gekauft. Ihre Zahlungsdaten sehen wir nicht. Die App prüft beim Store nur, ob Ihr Abo aktiv ist; dabei werden keine personenbezogenen Daten übertragen."], ["Kinder", "Seans richtet sich an Betriebe und nicht an Kinder unter 13 Jahren. Wenn Sie Daten von Kindern eingeben (z. B. Schüler und Eltern eines Kurses), sind Sie dafür und für erforderliche Einwilligungen verantwortlich."], ["Löschen von Daten", "Beispieldaten löschen Sie unter Einstellungen › Beispieldaten löschen, alle Daten unter Einstellungen › Neu einrichten. Auch das Löschen der App entfernt alle Daten vom Gerät. Sicherungsdateien im gewählten Ordner können Sie dort selbst löschen."], ["Änderungen", "Ändert sich diese Erklärung, wird die aktuelle Fassung mit neuem Datum auf dieser Seite veröffentlicht."]], "t": [["Zustimmung", "Mit dem Herunterladen oder der Nutzung von Seans akzeptieren Sie diese Bedingungen. Zusätzlich gelten die Nutzungsbedingungen des App Store."], ["Lizenz", "Sie erhalten ein persönliches, nicht übertragbares, nicht ausschließliches Recht, die App für Ihren eigenen Betrieb zu nutzen. Kopieren, Ändern, Weiterverkaufen oder Zurückentwickeln der App ist untersagt."], ["Gratis-Tarif", "Im Gratis-Tarif sind 20 Aktionen pro Monat möglich. Termine, Paketverkäufe, Zahlungen, Einnahmen/Ausgaben sowie Produktein- und -verkäufe zählen je als eine Aktion; das Anlegen von Kunden, Mitarbeitern, Leistungen und Produkten nicht. Das Kontingent erneuert sich am 1. jedes Monats. Im Gratis-Tarif enthalten Dokumente die Karte „Erstellt mit Seans“."], ["Abo Seans Pro", "<ul><li>Seans Pro wird als monatliches und jährliches, sich automatisch verlängerndes Abo angeboten; die Preise werden im Store in Ihrer Landeswährung angezeigt.</li><li>Die Zahlung wird bei Kaufbestätigung über Ihr App-Store-Konto abgerechnet.</li><li>Das Abo verlängert sich automatisch, sofern es nicht mindestens 24 Stunden vor Ende des Zeitraums gekündigt wird; die Verlängerung wird innerhalb von 24 Stunden vor Ende des Zeitraums berechnet.</li><li>Sie können das Abo in den Einstellungen Ihres App-Store-Kontos verwalten und kündigen. Die Kündigung wird zum Ende des laufenden Zeitraums wirksam; bis dahin bleibt Pro aktiv.</li><li>Wird eine kostenlose Testphase angeboten, verfällt deren ungenutzter Teil mit dem Kauf eines Abos.</li><li>Nach Ende des Abos werden Ihre Daten nicht gelöscht; nur die Pro-Funktionen werden deaktiviert.</li></ul>"], ["Erstattungen", "Zahlungen wickelt der Store ab; Erstattungsanträge richten sich nach den Regeln des App Store."], ["Ihre Daten und Sicherungen", "Da Ihre Daten nur auf Ihrem Gerät liegen, sind regelmäßige Sicherungen Ihre Verantwortung. Bei Verlust oder Defekt des Geräts oder Löschen der App können wir nicht gesicherte Daten nicht wiederherstellen."], ["Dokumente sind keine Rechnungen", "Quittungen, Belege, Sitzungskarten, Auszüge, Provisionsabrechnungen und Berichte der App dienen nur der Information und ersetzen keine Rechnungen oder steuerlichen Belege. Erstattungs-, Provisions- und Gehaltsberechnungen sind Beispiele und keine Rechts-, Finanz- oder Steuerberatung. Rechnungsstellung und steuerliche Pflichten liegen bei Ihnen."], ["Gesundheitsangaben", "Die Gesundheits-, Allergie- und Messfelder in der Kundenkarte sind nur Ihre Notizen. Seans ist kein Medizinprodukt und darf nicht für Diagnose, Behandlung oder medizinische Entscheidungen verwendet werden."], ["Haftung", "Seans wird „wie besehen“ bereitgestellt. Wir garantieren keinen unterbrechungs- oder fehlerfreien Betrieb. Soweit gesetzlich zulässig, haften wir nicht für indirekte Schäden, entgangenen Gewinn oder Datenverlust aus der Nutzung der App."], ["Änderungen", "Ändern sich diese Bedingungen, wird die aktuelle Fassung mit neuem Datum auf dieser Seite veröffentlicht. Wenn Sie die App danach weiter nutzen, akzeptieren Sie die geänderten Bedingungen."]]}, "fr": {"name": "Français", "title": "Confidentialité et conditions d'utilisation", "privacy": "Politique de confidentialité", "terms": "Conditions d'utilisation", "updated": "Dernière mise à jour : 8 novembre 2026", "contact": "Contact", "dev": "Développeur", "support": "Assistance", "intro": "Seans est une application destinée aux établissements qui travaillent sur rendez-vous et avec des forfaits de séances — instituts de beauté, coiffeurs, studios de pilates et de yoga, diététiciens, kinésithérapeutes, centres de cours, etc. — pour gérer rendez-vous, forfaits, clients, caisse, personnel et stock. Cette politique explique comment l'application traite vos données.", "p": [["En bref", "<ul><li>Aucun compte ni inscription : vous utilisez l'application dès son ouverture.</li><li>Toutes les données saisies sont stockées uniquement sur votre appareil.</li><li>Vos données ne nous sont jamais transmises, ni à des tiers ; l'application ne contient ni publicité, ni outil d'analyse ou de suivi.</li></ul>"], ["Données traitées", "Uniquement les informations que vous saisissez : données de l'établissement (nom, téléphone, adresse, note de paiement), personnel et horaires, règles de salaire et de commission, prestations et modèles de forfaits, nom, téléphone, e-mail, adresse, anniversaire, notes et données de facturation des clients ainsi que les notes de soins, de santé et de mesures que vous ajoutez, rendez-vous, forfaits, encaissements, recettes et dépenses, stock et fournisseurs. Ces informations restent dans l'espace de l'application sur votre appareil ; nous n'y avons pas accès. Vous êtes responsable du traitement des données de vos clients au sens du RGPD : leur information, le consentement requis pour les catégories particulières comme les données de santé et la limitation aux données nécessaires vous incombent."], ["Contacts", "L'accès aux contacts n'est utilisé que lorsque vous touchez « Ajouter depuis les contacts », et seulement pour les personnes choisies. Seuls leur nom et leur téléphone sont ajoutés comme clients ; le reste de votre carnet n'est pas lu et rien ne quitte votre appareil."], ["Sauvegarde", "Les sauvegardes sont écrites dans un seul fichier, dans le dossier de votre choix (iCloud Drive ou Fichiers). La sauvegarde automatique est une fonction Pro et conserve les 5 dernières sauvegardes. Les fichiers de ces dossiers relèvent des conditions du fournisseur (Apple) ; nous n'y avons pas accès."], ["Partage", "Détails de rendez-vous, rappels, reçus, tickets de forfait, cartes de séances, relevés de commissions, relevés clients et rapports sont envoyés en PNG ou PDF via le menu de partage de votre appareil. Les messages de rappel et d'information s'ouvrent prêts dans WhatsApp ; leur envoi reste votre choix. Vous devez obtenir le consentement du client avant tout message commercial ; le champ « consentement aux messages » permet de l'enregistrer."], ["Notifications", "Si vous l'autorisez, l'application affiche des notifications locales avant les rendez-vous et le matin des jours de rendez-vous. Elles sont créées sur votre appareil, sans serveur. Vous pouvez les désactiver à tout moment dans les réglages de l'appareil."], ["Verrouillage", "Si vous activez le verrouillage, Face ID, Touch ID ou le code de l'appareil sont utilisés. L'authentification se fait entièrement sur votre appareil ; nous n'avons pas accès à vos données biométriques."], ["Achats", "L'abonnement Seans Pro est acheté via l'App Store. Nous ne voyons pas vos données de paiement. L'application vérifie seulement auprès du store si votre abonnement est actif ; aucune donnée personnelle n'est transmise."], ["Enfants", "Seans s'adresse aux établissements et non aux enfants de moins de 13 ans. Si vous saisissez des données d'enfants (ex. élèves et parents d'un cours), vous en êtes responsable, ainsi que des consentements nécessaires."], ["Suppression des données", "Supprimez les exemples via Réglages › Supprimer les exemples, ou toutes les données via Réglages › Recommencer. Supprimer l'application efface aussi toutes les données de l'appareil. Vous pouvez supprimer vous-même les fichiers de sauvegarde dans le dossier choisi."], ["Modifications", "Si cette politique change, la version à jour sera publiée sur cette page avec une nouvelle date."]], "t": [["Acceptation", "En téléchargeant ou en utilisant Seans, vous acceptez ces conditions. Les conditions d'utilisation de l'App Store s'appliquent également."], ["Licence", "Vous bénéficiez d'un droit d'utilisation personnel, non transférable et non exclusif de l'application pour votre propre établissement. Il est interdit de la copier, la modifier, la revendre ou la décompiler."], ["Offre gratuite", "L'offre gratuite permet 20 actions par mois. Rendez-vous, ventes de forfaits, encaissements, recettes/dépenses et achats/ventes de produits comptent chacun pour une action ; ajouter clients, personnel, prestations et produits ne compte pas. Le quota se renouvelle le 1er de chaque mois. Avec l'offre gratuite, les documents comportent la carte « Créé avec Seans »."], ["Abonnement Seans Pro", "<ul><li>Seans Pro est proposé en abonnement mensuel ou annuel à renouvellement automatique ; les prix sont affichés dans le store dans votre devise locale.</li><li>Le paiement est débité sur votre compte App Store à la confirmation de l'achat.</li><li>L'abonnement se renouvelle automatiquement s'il n'est pas résilié au moins 24 heures avant la fin de la période ; le renouvellement est facturé dans les 24 heures précédant la fin de la période.</li><li>Vous pouvez gérer et résilier l'abonnement dans les réglages de votre compte App Store. La résiliation prend effet à la fin de la période en cours ; Pro reste actif jusque-là.</li><li>Si un essai gratuit est proposé, la partie non utilisée est perdue lors de l'achat d'un abonnement.</li><li>À la fin de l'abonnement, vos données ne sont pas supprimées ; seules les fonctions Pro sont désactivées.</li></ul>"], ["Remboursements", "Les paiements sont gérés par le store ; les demandes de remboursement suivent les règles de l'App Store."], ["Vos données et sauvegardes", "Vos données n'étant que sur votre appareil, il vous appartient de faire des sauvegardes régulières. En cas de perte, de panne de l'appareil ou de suppression de l'application, nous ne pouvons pas récupérer les données non sauvegardées."], ["Les documents ne sont pas des factures", "Les reçus, tickets, cartes de séances, relevés, relevés de commissions et rapports produits par l'application ont une valeur informative et ne remplacent pas une facture ni un document fiscal. Les calculs de remboursement, de commissions et de salaires sont indicatifs et ne constituent pas un conseil juridique, financier ou fiscal. La facturation et les obligations fiscales vous incombent."], ["Informations de santé", "Les champs santé, allergies et mesures de la fiche client ne sont que vos notes. Seans n'est pas un dispositif médical et ne doit pas servir au diagnostic, au traitement ou à des décisions médicales."], ["Responsabilité", "Seans est fournie « en l'état ». Nous ne garantissons pas un fonctionnement ininterrompu ou sans erreur. Dans les limites de la loi, nous ne sommes pas responsables des dommages indirects, pertes de profits ou pertes de données liés à l'utilisation de l'application."], ["Modifications", "Si ces conditions changent, la version à jour sera publiée sur cette page avec une nouvelle date. Continuer à utiliser l'application après une modification vaut acceptation des nouvelles conditions."]]}, "it": {"name": "Italiano", "title": "Privacy e termini di utilizzo", "privacy": "Informativa sulla privacy", "terms": "Termini di utilizzo", "updated": "Ultimo aggiornamento: 8 novembre 2026", "contact": "Contatti", "dev": "Sviluppatore", "support": "Assistenza", "intro": "Seans è un'app per le attività che lavorano su appuntamento e con pacchetti di sedute — centri estetici, parrucchieri, studi di pilates e yoga, dietisti, fisioterapisti, scuole e corsi e simili — per gestire appuntamenti, pacchetti, clienti, cassa, collaboratori e magazzino. Questa informativa spiega come l'app tratta i tuoi dati.", "p": [["In breve", "<ul><li>Non ci sono account né registrazione: usi l'app appena la apri.</li><li>Tutti i dati che inserisci sono salvati solo sul tuo dispositivo.</li><li>I tuoi dati non vengono mai inviati a noi né a terzi; l'app non contiene pubblicità, strumenti di analisi o tracciamento.</li></ul>"], ["Quali dati trattiamo", "Solo le informazioni che inserisci tu: dati dell'attività (nome, telefono, indirizzo, nota di pagamento), collaboratori e orari, regole di stipendio e provvigioni, servizi e modelli di pacchetto, nome, telefono, e-mail, indirizzo, compleanno, note e dati di fatturazione dei clienti e le note su cura, salute e misurazioni che aggiungi, appuntamenti, pacchetti, incassi, entrate e uscite, magazzino e fornitori. Queste informazioni restano nello spazio dell'app sul tuo dispositivo; noi non possiamo accedervi. Sei titolare del trattamento dei dati dei tuoi clienti ai sensi del GDPR: informarli, ottenere il consenso necessario per categorie particolari come i dati sanitari e inserire solo i dati necessari è tua responsabilità."], ["Rubrica", "L'accesso alla rubrica viene usato solo quando tocchi \"Aggiungi dalla rubrica\" e solo per le persone che scegli. Vengono aggiunti come clienti solo nome e telefono; il resto della rubrica non viene letto e nulla lascia il dispositivo."], ["Backup", "I backup vengono scritti come un unico file in una cartella che scegli tu (iCloud Drive o File). Il backup automatico è una funzione Pro e conserva i 5 backup più recenti. I file in queste cartelle sono soggetti ai termini del fornitore (Apple); noi non possiamo accedervi."], ["Condivisione", "Dettagli degli appuntamenti, promemoria, ricevute, scontrini dei pacchetti, schede sedute, prospetti provvigioni, estratti cliente e report vengono inviati come PNG o PDF tramite il menu di condivisione del dispositivo. I messaggi di promemoria e informativi si aprono pronti in WhatsApp; inviarli o no spetta a te. Per i messaggi promozionali serve il consenso del cliente; il campo \"consenso ai messaggi\" ti permette di registrarlo."], ["Notifiche", "Se lo consenti, l'app mostra notifiche locali prima degli appuntamenti e al mattino dei giorni con appuntamenti. Le notifiche sono create sul dispositivo, senza server. Puoi disattivarle in qualsiasi momento dalle impostazioni del dispositivo."], ["Blocco app", "Se attivi il blocco app vengono usati Face ID, Touch ID o il codice del dispositivo. L'autenticazione avviene interamente sul dispositivo; non abbiamo accesso ai tuoi dati biometrici."], ["Acquisti", "L'abbonamento Seans Pro si acquista tramite l'App Store. Non vediamo i tuoi dati di pagamento. L'app verifica con lo store solo se l'abbonamento è attivo; non vengono inviati dati personali."], ["Minori", "Seans è pensata per le attività e non è rivolta a minori di 13 anni. Se inserisci dati di minori (es. studenti e genitori di un corso), ne sei responsabile insieme ai consensi necessari."], ["Eliminazione dei dati", "Elimina gli esempi da Impostazioni › Elimina dati di esempio, oppure tutti i dati da Impostazioni › Ricomincia. Anche eliminare l'app rimuove tutti i dati dal dispositivo. I file di backup nella cartella scelta puoi eliminarli tu stesso."], ["Modifiche", "Se questa informativa cambia, la versione aggiornata verrà pubblicata su questa pagina con una nuova data."]], "t": [["Accettazione", "Scaricando o usando Seans accetti questi termini. Si applicano anche i termini di utilizzo dell'App Store."], ["Licenza", "Ti viene concesso un diritto d'uso personale, non trasferibile e non esclusivo dell'app per la tua attività. È vietato copiare, modificare, rivendere o decompilare l'app."], ["Piano gratuito", "Il piano gratuito consente 20 operazioni al mese. Appuntamenti, vendite di pacchetti, incassi, entrate/uscite e acquisti/vendite di prodotti contano ciascuno come un'operazione; aggiungere clienti, collaboratori, servizi e prodotti no. Il limite si rinnova il 1° di ogni mese. Nel piano gratuito i documenti riportano la scheda \"Creato con Seans\"."], ["Abbonamento Seans Pro", "<ul><li>Seans Pro è offerto come abbonamento mensile e annuale a rinnovo automatico; i prezzi sono mostrati nello store nella tua valuta.</li><li>Il pagamento viene addebitato sul tuo account App Store alla conferma dell'acquisto.</li><li>L'abbonamento si rinnova automaticamente se non viene disdetto almeno 24 ore prima della fine del periodo; il rinnovo viene addebitato nelle 24 ore precedenti la fine del periodo.</li><li>Puoi gestire e disdire l'abbonamento dalle impostazioni del tuo account App Store. La disdetta ha effetto alla fine del periodo in corso; fino ad allora Pro resta attivo.</li><li>Se è offerta una prova gratuita, la parte non utilizzata decade con l'acquisto di un abbonamento.</li><li>Alla fine dell'abbonamento i tuoi dati non vengono eliminati; si disattivano solo le funzioni Pro.</li></ul>"], ["Rimborsi", "I pagamenti sono gestiti dallo store; le richieste di rimborso seguono le regole dell'App Store."], ["I tuoi dati e i backup", "Poiché i dati sono solo sul tuo dispositivo, fare backup regolari è tua responsabilità. In caso di perdita o guasto del dispositivo o di eliminazione dell'app non possiamo recuperare i dati non salvati."], ["I documenti non sono fatture", "Ricevute, scontrini, schede sedute, estratti, prospetti provvigioni e report prodotti dall'app hanno valore informativo e non sostituiscono fatture o documenti fiscali. I calcoli di rimborso, provvigioni e stipendi sono indicativi e non costituiscono consulenza legale, finanziaria o fiscale. Fatturazione e obblighi fiscali restano a tuo carico."], ["Dati sanitari", "I campi salute, allergie e misurazioni della scheda cliente sono solo tue note. Seans non è un dispositivo medico e non deve essere usata per diagnosi, trattamenti o decisioni mediche."], ["Responsabilità", "Seans è fornita \"così com'è\". Non garantiamo un funzionamento privo di errori o interruzioni. Nei limiti di legge non rispondiamo di danni indiretti, mancati guadagni o perdita di dati derivanti dall'uso dell'app."], ["Modifiche", "Se questi termini cambiano, la versione aggiornata viene pubblicata su questa pagina con una nuova data. Continuando a usare l'app dopo una modifica accetti i termini aggiornati."]]}};
const L=["tr","en","de","fr","it"], APP="Seans", KEY="seans-legal-lang";
function langFromHash(){const m=(location.hash||"").match(/^#(tr|en|de|fr|it)(-(privacy|terms|contact))?$/);return m?m[1]:null;}
function pick(){const h=langFromHash();if(h)return h;try{const s=localStorage.getItem(KEY);if(L.includes(s))return s;}catch(x){}
 for(const l of (navigator.languages||[navigator.language||"en"])){const c=String(l).slice(0,2).toLowerCase();if(L.includes(c))return c;}return "en";}
function render(l){const d=T[l];document.documentElement.lang=l;document.title=APP+" – "+d.title;
 document.getElementById("sub").textContent=d.title;
 document.getElementById("langs").innerHTML=L.map(x=>`<button type="button" data-l="${x}" aria-pressed="${x===l}">${T[x].name}</button>`).join("");
 const sec=(id,h,items)=>`<section class="card" id="${l}-${id}"><h2>${h}</h2><p class="upd">${d.updated}</p>${id==="privacy"?`<p class="intro">${d.intro}</p>`:""}${items.map(([a,b])=>`<h3>${a}</h3>${b.startsWith("<")?b:`<p>${b}</p>`}`).join("")}</section>`;
 document.getElementById("main").innerHTML=`<div class="tabs"><a href="#${l}-privacy">${d.privacy}</a><a href="#${l}-terms">${d.terms}</a></div>`+sec("privacy",d.privacy,d.p)+sec("terms",d.terms,d.t)+
  `<section class="card" id="${l}-contact"><h2>${d.contact}</h2><div class="kv"><span>${d.dev}</span><b>Metin Öz</b></div><div class="kv"><span>${d.support}</span><a href="mailto:metin.ozzz@icloud.com?subject=${APP}">metin.ozzz@icloud.com</a></div></section>`;
 document.getElementById("foot").textContent="© "+new Date().getFullYear()+" Metin Öz · "+APP;}
document.addEventListener("click",e=>{const b=e.target.closest("[data-l]");if(b){e.preventDefault();const l=b.dataset.l;render(l);
  try{localStorage.setItem(KEY,l);}catch(x){}try{history.replaceState(null,"","#"+l+"-privacy");}catch(x){}window.scrollTo(0,0);return;}
 const a=e.target.closest('a[href^="#"]');if(a){e.preventDefault();const el=document.getElementById(a.getAttribute("href").slice(1));if(el)el.scrollIntoView({behavior:"smooth"});}});
window.addEventListener("hashchange",()=>{const h=langFromHash();if(h&&document.documentElement.lang!==h)render(h);const el=document.getElementById(location.hash.slice(1));if(el)el.scrollIntoView();});
render(pick());if(location.hash){const el=document.getElementById(location.hash.slice(1));if(el)setTimeout(()=>el.scrollIntoView(),0);}
</script>
</body>
