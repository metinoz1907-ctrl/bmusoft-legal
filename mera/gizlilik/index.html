<style>
:root{--primary:#A16207;--accent:#CA8A04;--bg:#FAF9F4;--card:#FFFFFF;--text:#0F172A;--text2:#475569;--border:#EBE6DB;--chip:#F6F2EA;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--primary:#FACC15;--accent:#EAB308;--bg:#1A160F;--card:#28231B;--text:#F3F4F6;--text2:#A8A29E;--border:#423B2E;--chip:#373025;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
header{background:linear-gradient(135deg,#A16207,#CA8A04);color:#fff;padding:36px 16px 72px}
.wrap{max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:16px}
.brand img{width:64px;height:64px;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
h1{margin:0;font-size:28px;line-height:1.2}
header p#sub{margin:2px 0 0;color:rgba(255,255,255,.88);font-size:15px}
nav.langs{max-width:760px;margin:-40px auto 0;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap}
nav.langs button{font:600 14px/1 inherit;font-family:inherit;padding:10px 16px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08)}
nav.langs button[aria-pressed="true"]{background:var(--primary);border-color:#fff;color:#fff;box-shadow:0 0 0 2px #fff,0 4px 12px rgba(0,0,0,.18)}
main{max-width:760px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.tabs a{padding:8px 14px;border-radius:999px;background:var(--chip);color:var(--primary);font-weight:600;font-size:14px;text-decoration:none}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:24px 22px;margin-bottom:16px;scroll-margin-top:16px}
h2{margin:0;font-size:22px}
h3{margin:22px 0 4px;font-size:17px}
.upd{margin:4px 0 12px;color:var(--text2);font-size:14px}
.intro{color:var(--text)}
p,li{color:var(--text2)}
p{margin:6px 0}
ul{margin:6px 0;padding-left:22px}
li{margin:4px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--border);flex-wrap:wrap}
.kv:first-of-type{border-top:0;margin-top:8px}
.kv span{color:var(--text2)}
a{color:var(--primary)}
footer{text-align:center;color:var(--text2);font-size:13px;padding:8px 16px 40px}
</style>

<script>
const T={"tr": {"name": "Türkçe", "title": "Gizlilik ve Kullanım Koşulları", "privacy": "Gizlilik Politikası", "terms": "Kullanım Koşulları", "updated": "Son güncelleme: 9 Kasım 2026", "contact": "İletişim", "dev": "Geliştirici", "support": "Destek", "intro": "Mera; sığır, koyun ve keçi yetiştiricileri için hazırlanmış bir sürü defteri uygulamasıdır: hayvan kaydı, doğum, tedavi ve ilaç bekleme süreleri, tartım, üreme, giriş-çıkış, küpe değişimi ve ülkenin kurallarına göre resmî bildirim hatırlatmaları. Bu politika, uygulamanın verilerinizi nasıl işlediğini açıklar.", "p": [["Kısaca", "<ul><li>Hesap veya kayıt yoktur; uygulamayı açtığınız anda kullanırsınız.</li><li>Girdiğiniz tüm veriler yalnızca cihazınızda saklanır.</li><li>Verileriniz bize veya üçüncü kişilere gönderilmez; uygulamada reklam, analiz veya izleme aracı yoktur.</li></ul>"], ["Hangi verileri işliyoruz?", "Uygulamaya kendiniz girdiğiniz bilgiler işlenir: işletme adı, ülke ve bölge, işletme / sürü numarası, işletme sahibinin adı, hayvanların küpe numaraları, doğum tarihleri, ırk, grup ve anne bilgileri, doğum, tedavi, aşı-test, tartım, üreme, giriş-çıkış, ölüm ve küpe değişimi kayıtları, ilaç dolabı (parti, son kullanma, tedarikçi) ve hatırlatmalarınız. Bu bilgiler cihazınızdaki uygulama alanında durur; biz bunlara erişemeyiz. Konum, rehber, fotoğraf veya kamera izni istenmez."], ["Yedekleme", "Yedek dosyası (.zip) yalnızca siz istediğinizde oluşturulur ve cihazınızın paylaşım menüsüyle kaydedilir. Otomatik yedek bir Pro özelliğidir; seçtiğiniz iCloud Drive klasörüne günde bir kez yazılır ve en yeni 5 yedek saklanır. Bu klasördeki dosyalar Apple'ın koşullarına tabidir; biz bu dosyalara erişemeyiz."], ["Paylaşım ve resmî dosyalar", "Sürü kayıt defteri, ilaç defteri, sayım ve rapor gibi belgeler PNG veya PDF olarak; resmî sistemlere yüklenecek dosyalar (ör. CSV) ise cihazınızın paylaşım menüsüyle gönderilir. Mera hiçbir resmî kuruma kendiliğinden bildirim yapmaz; dosyayı ilgili portala yüklemek ve bildirimi yapmak size aittir."], ["Bildirimler", "İzin verirseniz uygulama her sabah 07:00'de, son tarihi yaklaşan işler için yerel bildirim gösterir. Bildirimler cihazınızda oluşturulur; hiçbir sunucu kullanılmaz. İzni istediğiniz zaman cihaz ayarlarından kapatabilirsiniz."], ["Satın almalar", "Mera Pro aboneliği App Store üzerinden satın alınır. Ödeme bilgilerinizi görmeyiz. Uygulama yalnızca aboneliğinizin etkin olup olmadığını mağazadan doğrular; bunun için kişisel veri gönderilmez."], ["Çocuklar", "Mera hayvancılık işletmeleri için hazırlanmıştır ve 13 yaşın altındaki çocuklara yönelik değildir."], ["Verilerin silinmesi", "Ayarlar › Örnek verileri sil ile örnek kayıtları, Ayarlar › Örnek verilerle baştan başla ile tüm verileri silebilirsiniz. Uygulamayı cihazdan kaldırdığınızda uygulama alanındaki veriler de silinir; kendi klasörünüze aldığınız yedekler siz silene kadar kalır."], ["Değişiklikler", "Bu politika güncellenirse yeni metin bu sayfada yayımlanır ve üstteki tarih değişir."]], "t": [["Kabul", "Mera'yı indirerek veya kullanarak bu koşulları kabul etmiş olursunuz. App Store'un kullanım koşulları da ayrıca geçerlidir."], ["Lisans", "Size Mera'yı kendi işletmenizde kullanmanız için kişisel, devredilemez ve münhasır olmayan bir kullanım hakkı verilir. Uygulamayı kopyalamak, değiştirmek, tersine mühendislik yapmak veya yeniden satmak yasaktır."], ["Ücretsiz plan", "Ücretsiz planda hayvan sayısı sınırsızdır. Olay kayıtları (doğum, tedavi, tartım, giriş-çıkış, ölüm, küpe değişimi gibi) ve resmî dosya oluşturma toplam 20 işleme kadar ücretsizdir. Hayvan eklemek, not, hatırlatma ve PDF belgeler işlem sayılmaz. Ücretsiz planda belgelerin altında \"Mera ile oluşturuldu\" kartı bulunur."], ["Mera Pro aboneliği", "<ul><li>Aylık ve yıllık plan vardır; fiyatlar mağazada yerel para biriminizle gösterilir.</li><li>İlk abonelikte 1 aylık ücretsiz deneme sunulabilir; deneme bitmeden iptal etmezseniz ücretli dönem başlar ve deneme süresinin kullanılmayan kısmı sona erer.</li><li>Ödeme, satın alma onayıyla App Store hesabınızdan alınır.</li><li>Abonelik, dönem bitmeden en az 24 saat önce iptal edilmezse aynı süre için otomatik yenilenir; yenileme ücreti dönemin bitiminden önceki 24 saat içinde tahsil edilir.</li><li>Aboneliği iPhone Ayarlar › Apple Kimliği › Abonelikler bölümünden yönetebilir veya iptal edebilirsiniz; iptal, içinde bulunulan dönemin sonunda geçerli olur.</li><li>Abonelik bitse de kayıtlarınız silinmez ve görüntülenebilir kalır.</li></ul>"], ["İadeler", "İade talepleri App Store'un iade politikasına göre Apple tarafından değerlendirilir."], ["Verileriniz ve yedekleriniz", "Veriler yalnızca cihazınızda durduğu için düzenli yedek almak sizin sorumluluğunuzdadır. Cihazın kaybı, bozulması veya uygulamanın silinmesi durumunda yedeği olmayan veriler geri getirilemez."], ["Süreler ve resmî dosyalar", "Uygulamadaki bildirim süreleri, ilaç bekleme varsayılanları ve resmî dosya biçimleri yürürlükteki mevzuata göre hazırlanmış hatırlatmalardır; hukuki veya veteriner danışmanlığı değildir. Kurallar değişebilir; güncel kuralı resmî kurumdan kontrol etmek, ilacın etiketindeki bekleme süresine uymak ve bildirimleri zamanında yapmak sizin sorumluluğunuzdadır. Süreleri Ayarlar › Kurallar ve süreler bölümünden değiştirebilirsiniz."], ["Sorumluluk", "Mera \"olduğu gibi\" sunulur. Uygulamanın kullanımından doğabilecek dolaylı zararlardan, geciken bildirimlerden, idari para cezalarından veya veri kaybından sorumlu tutulamayız."], ["Değişiklikler", "Bu koşullar güncellenirse yeni metin bu sayfada yayımlanır ve üstteki tarih değişir."]]}, "en": {"name": "English", "title": "Privacy and Terms of Use", "privacy": "Privacy Policy", "terms": "Terms of Use", "updated": "Last updated: 9 November 2026", "contact": "Contact", "dev": "Developer", "support": "Support", "intro": "Mera is a herd book app for cattle, sheep and goat keepers: animal records, births, treatments and medicine withdrawal periods, weighings, breeding, moves on and off, tag replacements and reminders for official reporting under your country's rules. This policy explains how the app handles your data.", "p": [["In short", "<ul><li>There is no account or sign-up; you use the app as soon as you open it.</li><li>Everything you enter is stored only on your device.</li><li>Your data is never sent to us or to third parties; the app contains no ads, analytics or tracking tools.</li></ul>"], ["What data do we process?", "Only what you enter yourself: farm name, country and region, holding / herd number, the owner's name, animals' tag numbers, dates of birth, breed, group and dam, records of births, treatments, vaccinations and tests, weighings, breeding, moves, deaths and tag replacements, your medicine cabinet (batch, expiry, supplier) and your reminders. This information stays in the app's storage on your device; we cannot access it. The app does not ask for location, contacts, photos or camera access."], ["Backups", "A backup file (.zip) is created only when you ask for it and saved through your device's share menu. Automatic backup is a Pro feature; it is written once a day to an iCloud Drive folder you choose and the latest 5 backups are kept. Files in that folder are subject to Apple's terms; we cannot access them."], ["Sharing and official files", "Documents such as the herd register, medicine record book, census and report are shared as PNG or PDF; files for official systems (e.g. CSV) are sent through your device's share menu. Mera never reports anything to an authority on its own; uploading the file to the relevant portal and making the report is up to you."], ["Notifications", "If you allow it, the app shows local notifications at 07:00 each morning for tasks whose deadline is approaching. Notifications are created on your device; no server is used. You can turn the permission off at any time in your device settings."], ["Purchases", "The Mera Pro subscription is bought through the App Store. We never see your payment details. The app only checks with the store whether your subscription is active; no personal data is sent for this."], ["Children", "Mera is made for livestock businesses and is not directed at children under 13."], ["Deleting your data", "You can delete sample records with Settings › Delete sample data, and all data with Settings › Start over with sample data. Removing the app from your device also deletes the data in its storage; backups you saved to your own folder remain until you delete them."], ["Changes", "If this policy is updated, the new text is published on this page and the date above changes."]], "t": [["Acceptance", "By downloading or using Mera you accept these terms. The App Store terms of use also apply."], ["Licence", "You are granted a personal, non-transferable, non-exclusive right to use Mera for your own farm. Copying, modifying, reverse-engineering or reselling the app is prohibited."], ["Free plan", "The free plan has no limit on the number of animals. Event records (such as births, treatments, weighings, moves, deaths and tag replacements) and creating official files are free for up to 20 actions in total. Adding animals, notes, reminders and PDF documents don't count as actions. On the free plan, documents carry a \"Made with Mera\" card."], ["Mera Pro subscription", "<ul><li>Monthly and yearly plans are available; prices are shown in the store in your local currency.</li><li>A 1-month free trial may be offered with your first subscription; if you don't cancel before it ends, the paid period starts and any unused part of the trial is forfeited.</li><li>Payment is charged to your App Store account when you confirm the purchase.</li><li>The subscription renews automatically for the same period unless cancelled at least 24 hours before the end of the current period; the renewal is charged within the 24 hours before the period ends.</li><li>You can manage or cancel it in iPhone Settings › Apple ID › Subscriptions; cancellation takes effect at the end of the current period.</li><li>When a subscription ends, your records are not deleted and remain viewable.</li></ul>"], ["Refunds", "Refund requests are handled by Apple under the App Store refund policy."], ["Your data and backups", "Because data is stored only on your device, taking regular backups is your responsibility. If the device is lost or damaged or the app is deleted, data without a backup cannot be recovered."], ["Deadlines and official files", "Reporting deadlines, default withdrawal periods and official file formats in the app are reminders prepared from current regulations; they are not legal or veterinary advice. Rules can change; checking the current rules with the authority, observing the withdrawal period on the medicine label and reporting on time are your responsibility. You can change the deadlines under Settings › Rules and deadlines."], ["Liability", "Mera is provided \"as is\". We cannot be held liable for indirect damages, late reports, administrative fines or data loss arising from the use of the app."], ["Changes", "If these terms are updated, the new text is published on this page and the date above changes."]]}, "de": {"name": "Deutsch", "title": "Datenschutz und Nutzungsbedingungen", "privacy": "Datenschutzerklärung", "terms": "Nutzungsbedingungen", "updated": "Zuletzt aktualisiert: 9. November 2026", "contact": "Kontakt", "dev": "Entwickler", "support": "Support", "intro": "Mera ist ein Herdenbuch für Rinder-, Schaf- und Ziegenhalter: Tierbestand, Geburten, Behandlungen und Wartezeiten, Wiegungen, Zucht, Zu- und Abgänge, Ohrmarkenersatz sowie Erinnerungen an amtliche Meldungen nach den Regeln Ihres Landes. Diese Erklärung beschreibt, wie die App mit Ihren Daten umgeht.", "p": [["Kurz gesagt", "<ul><li>Es gibt kein Konto und keine Registrierung; Sie nutzen die App sofort nach dem Öffnen.</li><li>Alle eingegebenen Daten werden nur auf Ihrem Gerät gespeichert.</li><li>Ihre Daten werden weder an uns noch an Dritte gesendet; die App enthält keine Werbung, Analyse- oder Tracking-Werkzeuge.</li></ul>"], ["Welche Daten verarbeiten wir?", "Nur die Angaben, die Sie selbst eingeben: Betriebsname, Land und Region, Betriebs- / Registriernummer, Name des Halters, Ohrmarkennummern, Geburtsdaten, Rasse, Gruppe und Mutter der Tiere, Einträge zu Geburten, Behandlungen, Impfungen und Tests, Wiegungen, Zucht, Zu- und Abgängen, Verendungen und Ohrmarkenersatz, Ihr Arzneimittelbestand (Charge, Verfallsdatum, Lieferant) und Ihre Erinnerungen. Diese Daten bleiben im Speicher der App auf Ihrem Gerät; wir haben keinen Zugriff darauf. Standort, Kontakte, Fotos oder Kamera werden nicht angefragt."], ["Sicherung", "Eine Sicherungsdatei (.zip) wird nur auf Ihren Wunsch erstellt und über das Teilen-Menü Ihres Geräts gespeichert. Die automatische Sicherung ist eine Pro-Funktion; sie wird einmal täglich in einen von Ihnen gewählten iCloud-Drive-Ordner geschrieben, die neuesten 5 Sicherungen bleiben erhalten. Dateien in diesem Ordner unterliegen den Bedingungen von Apple; wir haben keinen Zugriff darauf."], ["Teilen und amtliche Dateien", "Dokumente wie Bestandsregister, Arzneimittelbuch, Zählung und Bericht werden als PNG oder PDF geteilt; Dateien für amtliche Systeme (z. B. CSV) werden über das Teilen-Menü Ihres Geräts gesendet. Mera meldet nie selbstständig etwas an eine Behörde; das Hochladen in das jeweilige Portal und die Meldung erfolgen durch Sie."], ["Mitteilungen", "Wenn Sie es erlauben, zeigt die App jeden Morgen um 07:00 Uhr lokale Mitteilungen zu Aufgaben, deren Frist näher rückt. Mitteilungen werden auf Ihrem Gerät erzeugt; es wird kein Server verwendet. Sie können die Erlaubnis jederzeit in den Geräteeinstellungen widerrufen."], ["Käufe", "Das Abo Mera Pro wird über den App Store gekauft. Ihre Zahlungsdaten sehen wir nicht. Die App prüft beim Store nur, ob Ihr Abo aktiv ist; dafür werden keine personenbezogenen Daten gesendet."], ["Kinder", "Mera richtet sich an landwirtschaftliche Betriebe und nicht an Kinder unter 13 Jahren."], ["Löschen der Daten", "Mit Einstellungen › Beispieldaten löschen entfernen Sie die Beispieleinträge, mit Einstellungen › Mit Beispieldaten neu beginnen alle Daten. Beim Entfernen der App vom Gerät werden auch die Daten in ihrem Speicher gelöscht; Sicherungen in Ihrem eigenen Ordner bleiben, bis Sie sie löschen."], ["Änderungen", "Wird diese Erklärung aktualisiert, wird der neue Text auf dieser Seite veröffentlicht und das Datum oben geändert."]], "t": [["Annahme", "Mit dem Herunterladen oder der Nutzung von Mera akzeptieren Sie diese Bedingungen. Zusätzlich gelten die Nutzungsbedingungen des App Store."], ["Lizenz", "Sie erhalten ein persönliches, nicht übertragbares, nicht ausschließliches Recht, Mera für Ihren eigenen Betrieb zu nutzen. Kopieren, Verändern, Zurückentwickeln oder Weiterverkaufen der App ist untersagt."], ["Kostenloser Plan", "Im kostenlosen Plan ist die Anzahl der Tiere unbegrenzt. Ereigniseinträge (z. B. Geburten, Behandlungen, Wiegungen, Zu- und Abgänge, Verendungen, Ohrmarkenersatz) und das Erstellen amtlicher Dateien sind bis zu insgesamt 20 Aktionen kostenlos. Tiere anlegen, Notizen, Erinnerungen und PDF-Dokumente zählen nicht als Aktion. Im kostenlosen Plan tragen Dokumente die Karte \"Erstellt mit Mera\"."], ["Abo Mera Pro", "<ul><li>Es gibt einen Monats- und einen Jahresplan; die Preise werden im Store in Ihrer Landeswährung angezeigt.</li><li>Beim ersten Abo kann ein kostenloser Probemonat angeboten werden; kündigen Sie nicht vor dessen Ende, beginnt der kostenpflichtige Zeitraum und der ungenutzte Teil der Probezeit verfällt.</li><li>Die Zahlung wird bei Bestätigung des Kaufs über Ihr App-Store-Konto abgerechnet.</li><li>Das Abo verlängert sich automatisch um denselben Zeitraum, wenn es nicht mindestens 24 Stunden vor Ablauf gekündigt wird; die Verlängerung wird innerhalb der letzten 24 Stunden vor Ablauf berechnet.</li><li>Verwalten oder kündigen können Sie es unter iPhone-Einstellungen › Apple-ID › Abonnements; die Kündigung wird zum Ende des laufenden Zeitraums wirksam.</li><li>Endet das Abo, werden Ihre Einträge nicht gelöscht und bleiben einsehbar.</li></ul>"], ["Erstattungen", "Erstattungsanfragen werden von Apple nach der Erstattungsrichtlinie des App Store bearbeitet."], ["Ihre Daten und Sicherungen", "Da die Daten nur auf Ihrem Gerät liegen, sind regelmäßige Sicherungen Ihre Verantwortung. Bei Verlust oder Defekt des Geräts oder Löschen der App können Daten ohne Sicherung nicht wiederhergestellt werden."], ["Fristen und amtliche Dateien", "Meldefristen, Standard-Wartezeiten und Formate amtlicher Dateien in der App sind Erinnerungen auf Grundlage geltender Vorschriften; sie sind keine Rechts- oder Tierarztberatung. Vorschriften können sich ändern; die aktuelle Regel bei der Behörde zu prüfen, die Wartezeit laut Packungsbeilage einzuhalten und fristgerecht zu melden liegt in Ihrer Verantwortung. Die Fristen können Sie unter Einstellungen › Regeln und Fristen ändern."], ["Haftung", "Mera wird \"wie besehen\" bereitgestellt. Für mittelbare Schäden, verspätete Meldungen, Bußgelder oder Datenverlust aus der Nutzung der App haften wir nicht."], ["Änderungen", "Werden diese Bedingungen aktualisiert, wird der neue Text auf dieser Seite veröffentlicht und das Datum oben geändert."]]}, "fr": {"name": "Français", "title": "Confidentialité et conditions d’utilisation", "privacy": "Politique de confidentialité", "terms": "Conditions d’utilisation", "updated": "Dernière mise à jour : 9 novembre 2026", "contact": "Contact", "dev": "Développeur", "support": "Assistance", "intro": "Mera est un registre d’élevage pour les éleveurs de bovins, d’ovins et de caprins : inventaire des animaux, naissances, traitements et délais d’attente, pesées, reproduction, entrées et sorties, remplacement de boucles et rappels des notifications officielles selon les règles de votre pays. Cette politique explique comment l’application traite vos données.", "p": [["En bref", "<ul><li>Aucun compte ni inscription : vous utilisez l’application dès son ouverture.</li><li>Toutes les données saisies restent uniquement sur votre appareil.</li><li>Vos données ne nous sont jamais envoyées, ni à des tiers ; l’application ne contient ni publicité, ni outil d’analyse ou de suivi.</li></ul>"], ["Quelles données traitons-nous ?", "Uniquement celles que vous saisissez : nom de l’exploitation, pays et région, numéro d’exploitation / de cheptel, nom de l’éleveur, numéros de boucle, dates de naissance, race, lot et mère des animaux, enregistrements de naissances, traitements, vaccins et tests, pesées, reproduction, mouvements, morts et remplacements de boucles, votre armoire à médicaments (lot, péremption, fournisseur) et vos rappels. Ces informations restent dans l’espace de l’application sur votre appareil ; nous n’y avons pas accès. L’application ne demande ni la position, ni les contacts, ni les photos, ni l’appareil photo."], ["Sauvegarde", "Un fichier de sauvegarde (.zip) n’est créé qu’à votre demande et enregistré via le menu de partage de votre appareil. La sauvegarde automatique est une fonction Pro ; elle est écrite une fois par jour dans un dossier iCloud Drive de votre choix et les 5 sauvegardes les plus récentes sont conservées. Les fichiers de ce dossier relèvent des conditions d’Apple ; nous n’y avons pas accès."], ["Partage et fichiers officiels", "Les documents comme le registre d’élevage, le registre des traitements, le recensement et le rapport sont partagés en PNG ou PDF ; les fichiers destinés aux systèmes officiels (p. ex. CSV) sont envoyés via le menu de partage de votre appareil. Mera ne déclare jamais rien de lui-même à une administration ; le dépôt du fichier sur le portail concerné et la déclaration vous incombent."], ["Notifications", "Si vous l’autorisez, l’application affiche chaque matin à 07:00 des notifications locales pour les tâches dont l’échéance approche. Elles sont créées sur votre appareil ; aucun serveur n’est utilisé. Vous pouvez retirer l’autorisation à tout moment dans les réglages de l’appareil."], ["Achats", "L’abonnement Mera Pro s’achète sur l’App Store. Nous ne voyons pas vos informations de paiement. L’application vérifie seulement auprès du store si votre abonnement est actif ; aucune donnée personnelle n’est envoyée pour cela."], ["Enfants", "Mera est conçu pour les exploitations d’élevage et ne s’adresse pas aux enfants de moins de 13 ans."], ["Suppression des données", "Réglages › Supprimer les données d’exemple efface les exemples, Réglages › Recommencer avec des données d’exemple efface toutes les données. La suppression de l’application efface aussi les données de son espace ; les sauvegardes placées dans votre propre dossier restent jusqu’à ce que vous les supprimiez."], ["Modifications", "Si cette politique est mise à jour, le nouveau texte est publié sur cette page et la date ci-dessus change."]], "t": [["Acceptation", "En téléchargeant ou en utilisant Mera, vous acceptez ces conditions. Les conditions d’utilisation de l’App Store s’appliquent également."], ["Licence", "Vous bénéficiez d’un droit d’utilisation personnel, non transférable et non exclusif de Mera pour votre propre exploitation. Il est interdit de copier, modifier, décompiler ou revendre l’application."], ["Offre gratuite", "L’offre gratuite n’impose aucune limite au nombre d’animaux. Les enregistrements d’événements (naissances, traitements, pesées, mouvements, morts, remplacements de boucles…) et la création de fichiers officiels sont gratuits jusqu’à 20 actions au total. Ajouter des animaux, les notes, les rappels et les documents PDF ne comptent pas comme actions. Dans l’offre gratuite, les documents portent la carte « Créé avec Mera »."], ["Abonnement Mera Pro", "<ul><li>Une formule mensuelle et une formule annuelle sont proposées ; les prix s’affichent dans le store dans votre devise.</li><li>Un essai gratuit d’un mois peut être proposé lors du premier abonnement ; si vous ne résiliez pas avant sa fin, la période payante commence et la partie non utilisée de l’essai est perdue.</li><li>Le paiement est débité de votre compte App Store à la confirmation de l’achat.</li><li>L’abonnement se renouvelle automatiquement pour la même durée sauf résiliation au moins 24 heures avant la fin de la période ; le renouvellement est facturé dans les 24 heures précédant la fin de la période.</li><li>Vous pouvez le gérer ou le résilier dans Réglages › Identifiant Apple › Abonnements ; la résiliation prend effet à la fin de la période en cours.</li><li>À la fin de l’abonnement, vos enregistrements ne sont pas supprimés et restent consultables.</li></ul>"], ["Remboursements", "Les demandes de remboursement sont traitées par Apple selon la politique de remboursement de l’App Store."], ["Vos données et sauvegardes", "Les données étant stockées uniquement sur votre appareil, il vous appartient de faire des sauvegardes régulières. En cas de perte ou de panne de l’appareil, ou de suppression de l’application, les données non sauvegardées ne peuvent pas être récupérées."], ["Délais et fichiers officiels", "Les délais de notification, les délais d’attente par défaut et les formats de fichiers officiels de l’application sont des rappels établis d’après la réglementation en vigueur ; ce ne sont ni des conseils juridiques ni des conseils vétérinaires. Les règles peuvent changer ; vérifier la règle actuelle auprès de l’administration, respecter le délai d’attente indiqué sur l’étiquette du médicament et déclarer dans les temps relèvent de votre responsabilité. Vous pouvez modifier les délais dans Réglages › Règles et délais."], ["Responsabilité", "Mera est fourni « en l’état ». Nous ne pouvons être tenus responsables des dommages indirects, des déclarations tardives, des amendes administratives ou des pertes de données liés à l’utilisation de l’application."], ["Modifications", "Si ces conditions sont mises à jour, le nouveau texte est publié sur cette page et la date ci-dessus change."]]}, "it": {"name": "Italiano", "title": "Privacy e termini di utilizzo", "privacy": "Informativa sulla privacy", "terms": "Termini di utilizzo", "updated": "Ultimo aggiornamento: 9 novembre 2026", "contact": "Contatti", "dev": "Sviluppatore", "support": "Assistenza", "intro": "Mera è un registro di stalla per allevatori di bovini, ovini e caprini: anagrafe degli animali, parti, trattamenti e tempi di sospensione, pesate, riproduzione, ingressi e uscite, sostituzione delle marche auricolari e promemoria per le comunicazioni ufficiali secondo le regole del tuo paese. Questa informativa spiega come l’app tratta i tuoi dati.", "p": [["In breve", "<ul><li>Nessun account né registrazione: usi l’app appena la apri.</li><li>Tutti i dati inseriti restano solo sul tuo dispositivo.</li><li>I tuoi dati non vengono inviati a noi né a terzi; l’app non contiene pubblicità, strumenti di analisi o di tracciamento.</li></ul>"], ["Quali dati trattiamo?", "Solo quelli che inserisci tu: nome dell’azienda, paese e regione, codice aziendale / di stalla, nome del titolare, numeri di marca auricolare, date di nascita, razza, gruppo e madre degli animali, registrazioni di parti, trattamenti, vaccinazioni e test, pesate, riproduzione, movimenti, morti e sostituzioni di marca, il tuo armadietto dei farmaci (lotto, scadenza, fornitore) e i tuoi promemoria. Queste informazioni restano nello spazio dell’app sul tuo dispositivo; non possiamo accedervi. L’app non chiede accesso a posizione, contatti, foto o fotocamera."], ["Backup", "Un file di backup (.zip) viene creato solo quando lo richiedi e salvato tramite il menu di condivisione del dispositivo. Il backup automatico è una funzione Pro; viene scritto una volta al giorno in una cartella di iCloud Drive scelta da te e vengono conservati gli ultimi 5 backup. I file in quella cartella sono soggetti ai termini di Apple; non possiamo accedervi."], ["Condivisione e file ufficiali", "Documenti come registro di stalla, registro dei trattamenti, censimento e report vengono condivisi in PNG o PDF; i file per i sistemi ufficiali (es. CSV) vengono inviati con il menu di condivisione del dispositivo. Mera non comunica mai nulla da sola a un’autorità; caricare il file nel portale e fare la comunicazione spetta a te."], ["Notifiche", "Se lo consenti, l’app mostra ogni mattina alle 07:00 notifiche locali per le attività in scadenza. Le notifiche sono create sul dispositivo; non viene usato alcun server. Puoi revocare il permesso in qualsiasi momento dalle impostazioni del dispositivo."], ["Acquisti", "L’abbonamento Mera Pro si acquista tramite l’App Store. Non vediamo i tuoi dati di pagamento. L’app verifica con lo store solo se l’abbonamento è attivo; per questo non vengono inviati dati personali."], ["Minori", "Mera è pensata per le aziende zootecniche e non è rivolta a minori di 13 anni."], ["Cancellazione dei dati", "Con Impostazioni › Elimina dati di esempio cancelli gli esempi, con Impostazioni › Ricomincia con dati di esempio cancelli tutti i dati. Rimuovendo l’app dal dispositivo vengono eliminati anche i dati nel suo spazio; i backup salvati nella tua cartella restano finché non li elimini."], ["Modifiche", "Se questa informativa viene aggiornata, il nuovo testo viene pubblicato su questa pagina e la data in alto cambia."]], "t": [["Accettazione", "Scaricando o usando Mera accetti questi termini. Si applicano inoltre i termini di utilizzo dell’App Store."], ["Licenza", "Ti viene concesso un diritto d’uso personale, non trasferibile e non esclusivo di Mera per la tua azienda. È vietato copiare, modificare, decompilare o rivendere l’app."], ["Piano gratuito", "Nel piano gratuito il numero di animali è illimitato. Le registrazioni di eventi (parti, trattamenti, pesate, movimenti, morti, sostituzioni di marca…) e la creazione di file ufficiali sono gratuite fino a 20 operazioni in totale. Aggiungere animali, note, promemoria e documenti PDF non contano come operazioni. Nel piano gratuito i documenti riportano la scheda “Creato con Mera”."], ["Abbonamento Mera Pro", "<ul><li>Sono disponibili un piano mensile e uno annuale; i prezzi sono indicati nello store nella tua valuta.</li><li>Con il primo abbonamento può essere offerta una prova gratuita di un mese; se non disdici prima della fine, inizia il periodo a pagamento e la parte non utilizzata della prova decade.</li><li>Il pagamento viene addebitato sul tuo account App Store alla conferma dell’acquisto.</li><li>L’abbonamento si rinnova automaticamente per lo stesso periodo se non disdetto almeno 24 ore prima della fine del periodo; il rinnovo viene addebitato nelle 24 ore precedenti la scadenza.</li><li>Puoi gestirlo o disdirlo in Impostazioni › ID Apple › Abbonamenti; la disdetta ha effetto alla fine del periodo in corso.</li><li>Alla fine dell’abbonamento le tue registrazioni non vengono eliminate e restano consultabili.</li></ul>"], ["Rimborsi", "Le richieste di rimborso sono gestite da Apple secondo la politica di rimborso dell’App Store."], ["I tuoi dati e i backup", "Poiché i dati restano solo sul dispositivo, fare backup regolari è una tua responsabilità. In caso di perdita o guasto del dispositivo o di eliminazione dell’app, i dati senza backup non possono essere recuperati."], ["Scadenze e file ufficiali", "Le scadenze di comunicazione, i tempi di sospensione predefiniti e i formati dei file ufficiali nell’app sono promemoria basati sulla normativa vigente; non costituiscono consulenza legale o veterinaria. Le regole possono cambiare; verificare la regola attuale presso l’autorità, rispettare il tempo di sospensione indicato sull’etichetta del farmaco e comunicare in tempo sono tua responsabilità. Puoi modificare le scadenze in Impostazioni › Regole e scadenze."], ["Responsabilità", "Mera è fornita “così com’è”. Non possiamo essere ritenuti responsabili di danni indiretti, comunicazioni tardive, sanzioni amministrative o perdite di dati derivanti dall’uso dell’app."], ["Modifiche", "Se questi termini vengono aggiornati, il nuovo testo viene pubblicato su questa pagina e la data in alto cambia."]]}};
const L=["tr","en","de","fr","it"], APP="Mera", KEY="mera-legal-lang";
function langFromHash(){const m=(location.hash||"").match(/^#(tr|en|de|fr|it)(-(privacy|terms|contact))?$/);return m?m[1]:null;}
function pick(){const h=langFromHash();if(h)return h;try{const s=localStorage.getItem(KEY);if(L.includes(s))return s;}catch(x){}
 for(const l of (navigator.languages||[navigator.language||"en"])){const c=String(l).slice(0,2).toLowerCase();if(L.includes(c))return c;}return "en";}
function render(l){const d=T[l];document.documentElement.lang=l;document.title=APP+" – "+d.title;
 document.getElementById("sub").textContent=d.title;
 document.getElementById("langs").innerHTML=L.map(x=>`<button type="button" data-l="${x}" aria-pressed="${x===l}">${T[x].name}</button>`).join("");
 const sec=(id,h,items)=>`<section class="card" id="${l}-${id}"><h2>${h}</h2><p class="upd">${d.updated}</p>${id==="privacy"?`<p class="intro">${d.intro}</p>`:""}${items.map(([a,b])=>`<h3>${a}</h3>${b.startsWith("<")?b:`<p>${b}</p>`}`).join("")}</section>`;
 document.getElementById("main").innerHTML=`<div class="tabs"><a href="#${l}-privacy">${d.privacy}</a><a href="#${l}-terms">${d.terms}</a></div>`+sec("privacy",d.privacy,d.p)+sec("terms",d.terms,d.t)+
  `<section class="card" id="${l}-contact"><h2>${d.contact}</h2><div class="kv"><span>${d.dev}</span><b>Metin Öz</b></div><div class="kv"><span>${d.support}</span><a href="mailto:metin.ozzz@icloud.com?subject=${APP}">metin.ozzz@icloud.com</a></div></section>`;
 document.getElementById("foot").textContent="© "+new Date().getFullYear()+" Metin Öz · "+APP;}
document.addEventListener("click",e=>{const b=e.target.closest("[data-l]");if(b){e.preventDefault();const l=b.dataset.l;render(l);
  try{localStorage.setItem(KEY,l);}catch(x){}try{history.replaceState(null,"","#"+l+"-privacy");}catch(x){}window.scrollTo(0,0);return;}
 const a=e.target.closest('a[href^="#"]');if(a){e.preventDefault();const el=document.getElementById(a.getAttribute("href").slice(1));if(el)el.scrollIntoView({behavior:"smooth"});}});
window.addEventListener("hashchange",()=>{const h=langFromHash();if(h&&document.documentElement.lang!==h)render(h);const el=document.getElementById(location.hash.slice(1));if(el)el.scrollIntoView();});
render(pick());if(location.hash){const el=document.getElementById(location.hash.slice(1));if(el)setTimeout(()=>el.scrollIntoView(),0);}
</script>
