<style>
:root{--primary:#047857;--accent:#10B981;--bg:#F1F5F4;--card:#FFFFFF;--text:#0F172A;--text2:#475569;--border:#E2E8F0;--chip:#ECFDF5;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--primary:#34D399;--accent:#059669;--bg:#0B1210;--card:#131C19;--text:#E5EDEA;--text2:#9AA9A4;--border:#24302C;--chip:#16302A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
header{background:linear-gradient(135deg,#047857,#0F9F75);color:#fff;padding:36px 16px 72px}
.wrap{max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:16px}
.brand img{width:64px;height:64px;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
h1{margin:0;font-size:28px;line-height:1.2}
header p#sub{margin:2px 0 0;color:rgba(255,255,255,.88);font-size:15px}
nav.langs{max-width:760px;margin:-40px auto 0;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap}
nav.langs button{font:600 14px/1 inherit;font-family:inherit;padding:10px 16px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08)}
nav.langs button[aria-pressed="true"]{background:var(--primary);border-color:#fff;color:#fff;box-shadow:0 0 0 2px #fff,0 4px 12px rgba(0,0,0,.18)}
main{max-width:760px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.tabs a{padding:8px 14px;border-radius:999px;background:var(--chip);color:var(--primary);font-weight:600;font-size:14px;text-decoration:none}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:24px 22px;margin-bottom:16px;scroll-margin-top:16px}
h2{margin:0;font-size:22px}
h3{margin:22px 0 4px;font-size:17px}
.upd{margin:4px 0 12px;color:var(--text2);font-size:14px}
.intro{color:var(--text)}
p,li{color:var(--text2)}
p{margin:6px 0}
ul{margin:6px 0;padding-left:22px}
li{margin:4px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--border);flex-wrap:wrap}
.kv:first-of-type{border-top:0;margin-top:8px}
.kv span{color:var(--text2)}
a{color:var(--primary)}
footer{text-align:center;color:var(--text2);font-size:13px;padding:8px 16px 40px}
</style>

<script>
const T={"tr": {"name": "Türkçe", "title": "Gizlilik ve Kullanım Koşulları", "privacy": "Gizlilik Politikası", "terms": "Kullanım Koşulları", "updated": "Son güncelleme: 3 Kasım 2026", "contact": "İletişim", "dev": "Geliştirici", "support": "Destek", "intro": "Emanet; gelinlik, abiye, kostüm, organizasyon ekipmanı, kamera gibi ürünleri kiraya veren işletmelerin emanetlerini, müşterilerini, ödemelerini ve teslim/iade tutanaklarını takip etmesi için hazırlanmış bir uygulamadır. Bu politika, uygulamanın verilerinizi nasıl işlediğini açıklar.", "p": [["Kısaca", "<ul><li>Hesap veya kayıt yoktur; uygulamayı açtığınız anda kullanırsınız.</li><li>Girdiğiniz tüm veriler yalnızca cihazınızda saklanır.</li><li>Verileriniz bize veya üçüncü kişilere gönderilmez; uygulamada reklam, analiz veya izleme aracı yoktur.</li></ul>"], ["Hangi verileri işliyoruz?", "Uygulamaya kendiniz girdiğiniz bilgiler işlenir: işletme bilgileriniz (ad, telefon, adres, IBAN, logo), ürünler ve kategoriler, müşteri bilgileri (ad, telefon, e-posta, adres, kimlik numarası), emanet kayıtları, kapora, depozito ve ödemeler, randevular, notlar, ekranda atılan imzalar ve fotoğraflar. Bu bilgiler cihazınızdaki uygulama alanında durur; biz bunlara erişemeyiz. Müşterilerinize ait bilgilerin veri sorumlusu sizsiniz: müşterilerinizi bilgilendirmek (ör. KVKK aydınlatma metni) ve yalnızca gerekli bilgiyi girmek size aittir."], ["Fotoğraflar, kamera ve barkod", "Kamerayı yalnızca siz bir işlem başlattığınızda kullanırız: ürün ve durum fotoğrafı çekmek (teslimde ürünün hasarsız olduğunu, iadede durumunu belgelemek) ve barkod okumak için. Galeriden yalnızca sizin seçtiğiniz fotoğraflar alınır. Fotoğraflar cihazınızda saklanır; barkod okurken görüntü kaydedilmez."], ["Yedekleme", "Yedekler, kendi seçtiğiniz bir klasöre (cihaz, Google Drive veya iCloud Drive) tek bir dosya olarak yazılır. Otomatik yedek Pro özelliğidir ve en yeni 5 yedek saklanır. Bu klasörlerdeki dosyalar ilgili hizmetin (Google, Apple) koşullarına tabidir; biz bu dosyalara erişemeyiz."], ["Paylaşım", "Teslim, iade ve hasarlı teslim tutanakları, sözleşmeler ve ürün listeleri PDF veya PNG olarak cihazınızın paylaşım menüsüyle gönderilir. Kime ve hangi uygulamayla (WhatsApp, e-posta, yazıcı vb.) gönderileceğini siz seçersiniz."], ["Bildirimler", "İzin verirseniz uygulama yaklaşan teslimler, iadeler ve gecikmeler için yerel hatırlatmalar gösterir. Bildirimler cihazınızda oluşturulur; hiçbir sunucu kullanılmaz. İzni istediğiniz zaman cihaz ayarlarından kapatabilirsiniz."], ["Satın almalar", "Emanet Pro aboneliği App Store veya Google Play üzerinden satın alınır. Ödeme bilgilerinizi görmeyiz. Uygulama yalnızca aboneliğinizin etkin olup olmadığını mağazadan doğrular; internet bağlantısı bunun ve barkod okuyucunun gerektirdiği sistem bileşenleri dışında kullanılmaz."], ["Çocuklar", "Emanet işletmeler için hazırlanmıştır ve çocuklara yönelik değildir. Bilerek çocuklardan veri toplamayız."], ["Verilerin silinmesi", "Ayarlar'daki “Örnekleri sil” seçeneğiyle örnek kayıtları, “Her şeyi sil” seçeneğiyle tüm kayıtları silebilirsiniz. Uygulamayı kaldırdığınızda cihazdaki tüm verileri silinir. Yedek dosyalarını, kaydettiğiniz klasörden kendiniz silersiniz. Bizde verileriniz bulunmadığından ayrıca bir silme talebi gerekmez."], ["Değişiklikler", "Bu politika değişirse güncel hâli bu sayfada, yeni tarihle yayımlanır."]], "t": [["Kabul", "Emanet'i indirerek veya kullanarak bu koşulları kabul etmiş olursunuz. Uygulamayı indirdiğiniz mağazanın (App Store, Google Play) kullanım koşulları da geçerlidir."], ["Lisans", "Size Emanet'i kendi işiniz için kullanmanız amacıyla kişisel, devredilemez ve münhasır olmayan bir kullanım hakkı verilir. Uygulamayı kopyalamak, değiştirmek, tersine mühendislik yapmak veya yeniden satmak yasaktır."], ["Ücretsiz plan", "Ücretsiz planda 20 emanet kaydı oluşturabilirsiniz; örnek kayıtlar bu sayıya dahil değildir. Sınıra ulaştığınızda mevcut kayıtlarınız silinmez; yeni emanet eklemek için Pro gerekir."], ["Emanet Pro aboneliği", "<p>Pro; sınırsız emanet, otomatik yedek, belgelerde işletme logosu ve rapor PDF'i sağlar.</p><ul><li>Aylık ve Yıllık olmak üzere iki plan vardır; fiyatlar mağazada yerel para biriminizle gösterilir.</li><li>Ödeme, satın almayı onayladığınızda Apple ID'nizden veya Google Play hesabınızdan alınır.</li><li>Abonelik, dönem bitiminden en az 24 saat önce iptal edilmezse aynı süre ve fiyatla otomatik olarak yenilenir; yenileme ücreti dönem bitmeden önceki 24 saat içinde tahsil edilir.</li><li>Aboneliğinizi App Store veya Google Play hesap ayarlarınızdan yönetebilir ve iptal edebilirsiniz. İptal, içinde bulunulan dönemin sonunda geçerli olur; o güne kadar Pro açık kalır.</li><li>Abonelik sona erdiğinde verileriniz silinmez; yalnızca Pro özellikleri kapanır.</li></ul>"], ["İadeler", "Ödemeler mağaza tarafından alınır; iade talepleri App Store veya Google Play'in iade politikasına göre değerlendirilir."], ["Verileriniz ve yedekleriniz", "Verileriniz yalnızca cihazınızda bulunduğu için düzenli yedek almak sizin sorumluluğunuzdadır. Cihazın kaybolması, bozulması veya uygulamanın silinmesi sonucu yedeklenmemiş verileri geri getiremeyiz."], ["Belgeler fatura değildir", "Uygulamanın ürettiği tutanaklar, sözleşmeler, ürün listeleri ve raporlar fatura veya mali belge değildir. Hazır kiralama koşulları ve sektör şablonları örnek niteliğindedir; hukuki ya da mali danışmanlık yerine geçmez. Vergi ve fatura yükümlülükleriniz size aittir."], ["Sorumluluk", "Emanet “olduğu gibi” sunulur. Hatasız ve kesintisiz çalışacağı garanti edilmez. Yasaların izin verdiği ölçüde, uygulamanın kullanımından doğan dolaylı zararlardan, kâr veya veri kaybından sorumlu değiliz."], ["Değişiklikler", "Bu koşullar değişirse güncel hâli bu sayfada, yeni tarihle yayımlanır. Değişiklikten sonra uygulamayı kullanmaya devam etmeniz güncel koşulları kabul ettiğiniz anlamına gelir."]]}, "en": {"name": "English", "title": "Privacy and Terms of Use", "privacy": "Privacy Policy", "terms": "Terms of Use", "updated": "Last updated: 3 November 2026", "contact": "Contact", "dev": "Developer", "support": "Support", "intro": "Emanet is an app for businesses that rent out items such as bridal and evening wear, costumes, event equipment and cameras. It helps them track rentals, customers, payments, and handover and return reports. This policy explains how the app handles your data.", "p": [["In short", "<ul><li>There is no account or sign-up; you can use the app as soon as you open it.</li><li>Everything you enter is stored only on your device.</li><li>Your data is not sent to us or to third parties; the app has no ads, analytics or tracking.</li></ul>"], ["What data we process", "The app processes only what you enter: your business details (name, phone, address, IBAN, logo), items and categories, customer details (name, phone, email, address, ID number), rentals, booking deposits, security deposits and payments, appointments, notes, on-screen signatures and photos. This information stays in the app's storage on your device; we cannot access it. You are the data controller for your customers' information: it is up to you to inform your customers (for example under the GDPR) and to enter only what you need."], ["Photos, camera and barcodes", "The camera is used only when you start an action: to take item and condition photos (proving the item was undamaged at handover, or its state on return) and to scan barcodes. Only photos you pick are taken from your library. Photos are stored on your device; no image is saved while scanning barcodes."], ["Backup", "Backups are written as a single file to a folder you choose (on the device, Google Drive or iCloud Drive). Automatic backup is a Pro feature and keeps the latest 5 backups. Files in these folders are subject to the terms of the relevant service (Google, Apple); we cannot access them."], ["Sharing", "Handover, return and damage reports, contracts and item lists are sent as PDF or PNG through your device's share menu. You choose who receives them and which app is used (WhatsApp, email, a printer, etc.)."], ["Notifications", "If you allow it, the app shows local reminders for upcoming handovers, returns and overdue items. Notifications are created on your device; no server is used. You can turn them off at any time in your device settings."], ["Purchases", "Emanet Pro is bought through the App Store or Google Play. We never see your payment details. The app only checks with the store whether your subscription is active; the internet connection is not used for anything else, apart from the system components the barcode scanner needs."], ["Children", "Emanet is made for businesses and is not directed at children. We do not knowingly collect data from children."], ["Deleting your data", "In Settings, “Delete samples” removes the sample records and “Delete everything” removes all records. Uninstalling the app deletes all of its data from the device. You delete backup files yourself from the folder where you saved them. Because we hold none of your data, no separate deletion request is needed."], ["Changes", "If this policy changes, the current version will be published on this page with a new date."]], "t": [["Acceptance", "By downloading or using Emanet you accept these terms. The terms of the store you downloaded it from (App Store, Google Play) also apply."], ["Licence", "You are granted a personal, non-transferable, non-exclusive right to use Emanet for your own business. Copying, modifying, reverse engineering or reselling the app is not allowed."], ["Free plan", "On the free plan you can create 20 rentals; sample records do not count. When you reach the limit your existing records are kept; adding new rentals requires Pro."], ["Emanet Pro subscription", "<p>Pro gives you unlimited rentals, automatic backup, your business logo on documents and report PDFs.</p><ul><li>There are two plans, Monthly and Yearly; prices are shown in the store in your local currency.</li><li>Payment is charged to your Apple ID or Google Play account when you confirm the purchase.</li><li>The subscription renews automatically for the same period and price unless it is cancelled at least 24 hours before the end of the current period; the renewal is charged within the 24 hours before the period ends.</li><li>You can manage and cancel your subscription in your App Store or Google Play account settings. Cancellation takes effect at the end of the current period; Pro stays on until then.</li><li>When the subscription ends your data is not deleted; only the Pro features are switched off.</li></ul>"], ["Refunds", "Payments are taken by the store; refund requests are handled under the App Store or Google Play refund policy."], ["Your data and backups", "Because your data lives only on your device, making regular backups is your responsibility. We cannot recover data that was not backed up if the device is lost or damaged or the app is deleted."], ["Documents are not invoices", "The reports, contracts, item lists and summaries the app produces are not invoices or tax documents. The ready-made rental terms and sector templates are examples only and are not legal or financial advice. Your tax and invoicing obligations remain yours."], ["Liability", "Emanet is provided “as is”. We do not guarantee that it will be error-free or uninterrupted. To the extent permitted by law, we are not liable for indirect damages, lost profits or lost data arising from use of the app."], ["Changes", "If these terms change, the current version will be published on this page with a new date. Continuing to use the app after a change means you accept the updated terms."]]}, "de": {"name": "Deutsch", "title": "Datenschutz und Nutzungsbedingungen", "privacy": "Datenschutzerklärung", "terms": "Nutzungsbedingungen", "updated": "Zuletzt aktualisiert: 3. November 2026", "contact": "Kontakt", "dev": "Entwickler", "support": "Support", "intro": "Emanet ist eine App für Betriebe, die Artikel wie Braut- und Abendmode, Kostüme, Eventausstattung oder Kameras vermieten. Sie hilft dabei, Vermietungen, Kunden, Zahlungen sowie Übergabe- und Rückgabeprotokolle zu verwalten. Diese Erklärung beschreibt, wie die App mit Ihren Daten umgeht.", "p": [["Kurz gesagt", "<ul><li>Es gibt kein Konto und keine Registrierung; Sie können die App sofort nutzen.</li><li>Alle eingegebenen Daten werden ausschließlich auf Ihrem Gerät gespeichert.</li><li>Ihre Daten werden weder an uns noch an Dritte übermittelt; die App enthält keine Werbung, Analyse- oder Tracking-Tools.</li></ul>"], ["Welche Daten verarbeitet werden", "Verarbeitet werden nur Daten, die Sie selbst eingeben: Angaben zu Ihrem Betrieb (Name, Telefon, Adresse, IBAN, Logo), Artikel und Kategorien, Kundendaten (Name, Telefon, E-Mail, Adresse, Ausweisnummer), Vermietungen, Anzahlungen, Kautionen und Zahlungen, Termine, Notizen, Unterschriften auf dem Bildschirm und Fotos. Diese Daten bleiben im Speicher der App auf Ihrem Gerät; wir haben keinen Zugriff darauf. Für die Daten Ihrer Kunden sind Sie Verantwortlicher im Sinne der DSGVO: Die Information Ihrer Kunden und die Beschränkung auf die erforderlichen Angaben liegen bei Ihnen."], ["Fotos, Kamera und Barcodes", "Die Kamera wird nur verwendet, wenn Sie eine Aktion starten: für Artikel- und Zustandsfotos (Nachweis des unbeschädigten Zustands bei der Übergabe bzw. des Zustands bei der Rückgabe) und zum Scannen von Barcodes. Aus der Mediathek werden nur die von Ihnen ausgewählten Fotos übernommen. Fotos werden auf Ihrem Gerät gespeichert; beim Barcode-Scan wird kein Bild gespeichert."], ["Datensicherung", "Sicherungen werden als einzelne Datei in einen von Ihnen gewählten Ordner geschrieben (Gerät, Google Drive oder iCloud Drive). Die automatische Sicherung ist eine Pro-Funktion; die 5 neuesten Sicherungen werden aufbewahrt. Für Dateien in diesen Ordnern gelten die Bedingungen des jeweiligen Dienstes (Google, Apple); wir haben keinen Zugriff darauf."], ["Teilen", "Übergabe-, Rückgabe- und Schadensprotokolle, Verträge und Artikellisten werden als PDF oder PNG über das Teilen-Menü Ihres Geräts versendet. Sie entscheiden, an wen und mit welcher App (WhatsApp, E-Mail, Drucker usw.)."], ["Mitteilungen", "Wenn Sie es erlauben, zeigt die App lokale Erinnerungen an anstehende Übergaben, Rückgaben und Verspätungen. Mitteilungen werden auf Ihrem Gerät erzeugt; es wird kein Server verwendet. Sie können sie jederzeit in den Geräteeinstellungen deaktivieren."], ["Käufe", "Emanet Pro wird über den App Store oder Google Play gekauft. Ihre Zahlungsdaten sehen wir nicht. Die App prüft beim Store nur, ob Ihr Abo aktiv ist; abgesehen von den Systemkomponenten, die der Barcode-Scanner benötigt, wird die Internetverbindung für nichts anderes genutzt."], ["Kinder", "Emanet richtet sich an Betriebe und nicht an Kinder. Wir erheben wissentlich keine Daten von Kindern."], ["Löschen Ihrer Daten", "In den Einstellungen entfernt „Beispiele löschen“ die Beispieldaten und „Alles löschen“ alle Einträge. Beim Deinstallieren der App werden alle ihre Daten vom Gerät gelöscht. Sicherungsdateien löschen Sie selbst in dem Ordner, in dem sie gespeichert sind. Da wir keine Ihrer Daten besitzen, ist kein gesonderter Löschantrag nötig."], ["Änderungen", "Ändert sich diese Erklärung, wird die aktuelle Fassung mit neuem Datum auf dieser Seite veröffentlicht."]], "t": [["Zustimmung", "Mit dem Herunterladen oder der Nutzung von Emanet akzeptieren Sie diese Bedingungen. Zusätzlich gelten die Bedingungen des Stores, aus dem Sie die App geladen haben (App Store, Google Play)."], ["Lizenz", "Sie erhalten ein persönliches, nicht übertragbares und nicht ausschließliches Recht, Emanet für Ihren eigenen Betrieb zu nutzen. Kopieren, Verändern, Zurückentwickeln oder Weiterverkaufen der App ist nicht gestattet."], ["Kostenloser Tarif", "Im kostenlosen Tarif können Sie 20 Vermietungen anlegen; Beispieldaten zählen nicht mit. Ist die Grenze erreicht, bleiben Ihre Einträge erhalten; für neue Vermietungen ist Pro erforderlich."], ["Emanet Pro-Abo", "<p>Pro bietet unbegrenzte Vermietungen, automatische Sicherung, Ihr Logo auf Dokumenten und Berichte als PDF.</p><ul><li>Es gibt zwei Tarife, Monatlich und Jährlich; die Preise werden im Store in Ihrer Landeswährung angezeigt.</li><li>Die Zahlung wird bei Bestätigung des Kaufs über Ihre Apple-ID bzw. Ihr Google-Play-Konto abgerechnet.</li><li>Das Abo verlängert sich automatisch um denselben Zeitraum zum selben Preis, sofern es nicht mindestens 24 Stunden vor Ablauf des aktuellen Zeitraums gekündigt wird; die Verlängerung wird innerhalb der 24 Stunden vor Ablauf berechnet.</li><li>Sie können das Abo in den Einstellungen Ihres App-Store- bzw. Google-Play-Kontos verwalten und kündigen. Die Kündigung wird zum Ende des laufenden Zeitraums wirksam; bis dahin bleibt Pro aktiv.</li><li>Endet das Abo, werden Ihre Daten nicht gelöscht; nur die Pro-Funktionen werden deaktiviert.</li></ul>"], ["Erstattungen", "Zahlungen werden vom Store abgewickelt; Erstattungen richten sich nach den Richtlinien des App Store bzw. von Google Play."], ["Ihre Daten und Sicherungen", "Da Ihre Daten nur auf Ihrem Gerät liegen, sind Sie für regelmäßige Sicherungen verantwortlich. Nicht gesicherte Daten können wir bei Verlust oder Defekt des Geräts oder nach dem Löschen der App nicht wiederherstellen."], ["Dokumente sind keine Rechnungen", "Die von der App erstellten Protokolle, Verträge, Artikellisten und Berichte sind keine Rechnungen oder steuerlichen Belege. Die vorgefertigten Mietbedingungen und Branchenvorlagen sind nur Beispiele und keine Rechts- oder Steuerberatung. Ihre steuerlichen Pflichten und Rechnungspflichten bleiben bei Ihnen."], ["Haftung", "Emanet wird „wie besehen“ bereitgestellt. Wir garantieren keinen fehlerfreien oder unterbrechungsfreien Betrieb. Soweit gesetzlich zulässig, haften wir nicht für mittelbare Schäden, entgangenen Gewinn oder Datenverlust aus der Nutzung der App."], ["Änderungen", "Ändern sich diese Bedingungen, wird die aktuelle Fassung mit neuem Datum auf dieser Seite veröffentlicht. Wenn Sie die App danach weiter nutzen, akzeptieren Sie die geänderten Bedingungen."]]}, "fr": {"name": "Français", "title": "Confidentialité et conditions d’utilisation", "privacy": "Politique de confidentialité", "terms": "Conditions d’utilisation", "updated": "Dernière mise à jour : 3 novembre 2026", "contact": "Contact", "dev": "Développeur", "support": "Assistance", "intro": "Emanet est une application destinée aux entreprises qui louent des articles : robes de mariée et de soirée, costumes, matériel événementiel, appareils photo, etc. Elle permet de suivre les locations, les clients, les paiements et les procès-verbaux de remise et de retour. Cette politique explique comment l’application traite vos données.", "p": [["En bref", "<ul><li>Aucun compte ni inscription : vous utilisez l’application dès son ouverture.</li><li>Tout ce que vous saisissez est enregistré uniquement sur votre appareil.</li><li>Vos données ne nous sont pas envoyées, ni à des tiers ; l’application ne contient ni publicité, ni outil d’analyse ou de suivi.</li></ul>"], ["Quelles données sont traitées", "L’application traite uniquement ce que vous saisissez : les informations de votre entreprise (nom, téléphone, adresse, IBAN, logo), les articles et catégories, les données clients (nom, téléphone, e-mail, adresse, numéro de pièce d’identité), les locations, acomptes, cautions et paiements, les rendez-vous, notes, signatures à l’écran et photos. Ces informations restent dans l’espace de l’application sur votre appareil ; nous n’y avons pas accès. Vous êtes responsable du traitement des données de vos clients au sens du RGPD : il vous appartient de les informer et de ne saisir que le nécessaire."], ["Photos, appareil photo et codes-barres", "L’appareil photo n’est utilisé que lorsque vous lancez une action : prendre des photos de l’article et de son état (prouver qu’il était intact à la remise, ou son état au retour) et scanner des codes-barres. Seules les photos que vous choisissez sont prises dans votre photothèque. Les photos sont stockées sur votre appareil ; aucune image n’est enregistrée lors du scan."], ["Sauvegarde", "Les sauvegardes sont écrites sous forme d’un seul fichier dans un dossier de votre choix (appareil, Google Drive ou iCloud Drive). La sauvegarde automatique est une fonction Pro et conserve les 5 sauvegardes les plus récentes. Les fichiers de ces dossiers sont soumis aux conditions du service concerné (Google, Apple) ; nous n’y avons pas accès."], ["Partage", "Les procès-verbaux de remise, de retour et de dommages, les contrats et les listes d’articles sont envoyés en PDF ou PNG via le menu de partage de votre appareil. Vous choisissez le destinataire et l’application utilisée (WhatsApp, e-mail, imprimante, etc.)."], ["Notifications", "Si vous l’autorisez, l’application affiche des rappels locaux pour les remises, retours et retards à venir. Les notifications sont créées sur votre appareil, sans serveur. Vous pouvez les désactiver à tout moment dans les réglages de l’appareil."], ["Achats", "Emanet Pro s’achète via l’App Store ou Google Play. Nous ne voyons jamais vos informations de paiement. L’application vérifie seulement auprès du store si votre abonnement est actif ; la connexion Internet ne sert à rien d’autre, hormis les composants système requis par le lecteur de codes-barres."], ["Enfants", "Emanet est conçue pour les entreprises et ne s’adresse pas aux enfants. Nous ne collectons pas sciemment de données d’enfants."], ["Suppression des données", "Dans les Réglages, « Supprimer les exemples » efface les données d’exemple et « Tout supprimer » efface tous les enregistrements. La désinstallation de l’application supprime toutes ses données de l’appareil. Vous supprimez vous-même les fichiers de sauvegarde dans le dossier où ils sont enregistrés. Comme nous ne détenons aucune de vos données, aucune demande de suppression n’est nécessaire."], ["Modifications", "Si cette politique change, la version à jour sera publiée sur cette page avec une nouvelle date."]], "t": [["Acceptation", "En téléchargeant ou en utilisant Emanet, vous acceptez ces conditions. Les conditions du store d’où vous l’avez téléchargée (App Store, Google Play) s’appliquent également."], ["Licence", "Vous bénéficiez d’un droit personnel, non transférable et non exclusif d’utiliser Emanet pour votre propre activité. Il est interdit de copier, modifier, décompiler ou revendre l’application."], ["Offre gratuite", "Avec l’offre gratuite, vous pouvez créer 20 locations ; les données d’exemple ne sont pas comptées. Une fois la limite atteinte, vos enregistrements sont conservés ; Pro est nécessaire pour ajouter de nouvelles locations."], ["Abonnement Emanet Pro", "<p>Pro offre des locations illimitées, la sauvegarde automatique, le logo de votre entreprise sur les documents et les rapports en PDF.</p><ul><li>Deux formules sont proposées, Mensuelle et Annuelle ; les prix sont affichés dans le store dans votre devise locale.</li><li>Le paiement est débité de votre identifiant Apple ou de votre compte Google Play lors de la confirmation de l’achat.</li><li>L’abonnement se renouvelle automatiquement pour la même durée et au même prix, sauf s’il est résilié au moins 24 heures avant la fin de la période en cours ; le renouvellement est facturé dans les 24 heures précédant la fin de la période.</li><li>Vous pouvez gérer et résilier votre abonnement dans les réglages de votre compte App Store ou Google Play. La résiliation prend effet à la fin de la période en cours ; Pro reste actif jusque-là.</li><li>À la fin de l’abonnement, vos données ne sont pas supprimées ; seules les fonctions Pro sont désactivées.</li></ul>"], ["Remboursements", "Les paiements sont encaissés par le store ; les demandes de remboursement suivent la politique de l’App Store ou de Google Play."], ["Vos données et sauvegardes", "Vos données étant uniquement sur votre appareil, il vous appartient de faire des sauvegardes régulières. Nous ne pouvons pas récupérer des données non sauvegardées en cas de perte ou de panne de l’appareil, ou de suppression de l’application."], ["Les documents ne sont pas des factures", "Les procès-verbaux, contrats, listes d’articles et rapports produits par l’application ne sont ni des factures ni des pièces comptables. Les conditions de location et modèles sectoriels fournis ne sont que des exemples et ne constituent pas un conseil juridique ou fiscal. Vos obligations fiscales et de facturation vous incombent."], ["Responsabilité", "Emanet est fournie « en l’état ». Nous ne garantissons pas un fonctionnement sans erreur ni interruption. Dans les limites permises par la loi, nous ne sommes pas responsables des dommages indirects, pertes de bénéfices ou pertes de données liés à l’utilisation de l’application."], ["Modifications", "Si ces conditions changent, la version à jour sera publiée sur cette page avec une nouvelle date. Continuer à utiliser l’application après une modification vaut acceptation des nouvelles conditions."]]}, "it": {"name": "Italiano", "title": "Privacy e termini di utilizzo", "privacy": "Informativa sulla privacy", "terms": "Termini di utilizzo", "updated": "Ultimo aggiornamento: 3 novembre 2026", "contact": "Contatti", "dev": "Sviluppatore", "support": "Assistenza", "intro": "Emanet è un’app per le attività che noleggiano articoli come abiti da sposa e da cerimonia, costumi, attrezzature per eventi e fotocamere. Aiuta a gestire noleggi, clienti, pagamenti e verbali di consegna e restituzione. Questa informativa spiega come l’app tratta i dati.", "p": [["In breve", "<ul><li>Non servono account né registrazione: l’app si usa subito.</li><li>Tutti i dati inseriti restano solo sul dispositivo.</li><li>I dati non vengono inviati a noi né a terzi; l’app non contiene pubblicità, strumenti di analisi o di tracciamento.</li></ul>"], ["Quali dati vengono trattati", "L’app tratta solo i dati inseriti dall’utente: dati dell’attività (nome, telefono, indirizzo, IBAN, logo), articoli e categorie, dati dei clienti (nome, telefono, e-mail, indirizzo, numero del documento), noleggi, acconti, cauzioni e pagamenti, appuntamenti, note, firme sullo schermo e foto. Questi dati restano nello spazio dell’app sul dispositivo; non abbiamo accesso. Per i dati dei clienti, il titolare del trattamento ai sensi del GDPR è l’utente: spetta a lui informare i clienti e inserire solo i dati necessari."], ["Foto, fotocamera e codici a barre", "La fotocamera si usa solo quando l’utente avvia un’azione: scattare foto dell’articolo e del suo stato (per dimostrare che era integro alla consegna o il suo stato alla restituzione) e leggere codici a barre. Dalla libreria vengono prese solo le foto scelte. Le foto restano sul dispositivo; durante la lettura dei codici non viene salvata alcuna immagine."], ["Backup", "I backup vengono salvati come un unico file in una cartella scelta dall’utente (dispositivo, Google Drive o iCloud Drive). Il backup automatico è una funzione Pro e conserva gli ultimi 5 backup. I file in queste cartelle sono soggetti ai termini del servizio interessato (Google, Apple); non abbiamo accesso."], ["Condivisione", "I verbali di consegna, restituzione e danni, i contratti e gli elenchi articoli vengono inviati in PDF o PNG tramite il menu di condivisione del dispositivo. Destinatario e app (WhatsApp, e-mail, stampante, ecc.) li sceglie l’utente."], ["Notifiche", "Se autorizzate, l’app mostra promemoria locali per consegne, restituzioni e ritardi. Le notifiche sono generate sul dispositivo, senza server, e si possono disattivare in qualsiasi momento dalle impostazioni del dispositivo."], ["Acquisti", "Emanet Pro si acquista tramite App Store o Google Play. Non vediamo mai i dati di pagamento. L’app verifica soltanto presso lo store se l’abbonamento è attivo; la connessione a Internet non viene usata per altro, salvo i componenti di sistema richiesti dal lettore di codici a barre."], ["Minori", "Emanet è pensata per le attività e non è rivolta ai minori. Non raccogliamo consapevolmente dati di minori."], ["Eliminazione dei dati", "In Impostazioni, «Elimina esempi» rimuove i dati di esempio ed «Elimina tutto» rimuove tutti i record. Disinstallando l’app vengono eliminati tutti i suoi dati dal dispositivo. I file di backup vanno eliminati dalla cartella in cui sono stati salvati. Poiché non conserviamo alcun dato, non è necessaria una richiesta di cancellazione."], ["Modifiche", "Se questa informativa cambia, la versione aggiornata sarà pubblicata su questa pagina con una nuova data."]], "t": [["Accettazione", "Scaricando o usando Emanet si accettano questi termini. Si applicano anche i termini dello store da cui l’app è stata scaricata (App Store, Google Play)."], ["Licenza", "Viene concesso un diritto personale, non trasferibile e non esclusivo di usare Emanet per la propria attività. È vietato copiare, modificare, decompilare o rivendere l’app."], ["Piano gratuito", "Con il piano gratuito si possono creare 20 noleggi; i dati di esempio non vengono conteggiati. Raggiunto il limite, i record esistenti restano; per aggiungere nuovi noleggi serve Pro."], ["Abbonamento Emanet Pro", "<p>Pro offre noleggi illimitati, backup automatico, logo dell’attività sui documenti e report in PDF.</p><ul><li>Sono disponibili due piani, Mensile e Annuale; i prezzi sono mostrati nello store nella valuta locale.</li><li>Il pagamento viene addebitato sull’ID Apple o sull’account Google Play alla conferma dell’acquisto.</li><li>L’abbonamento si rinnova automaticamente per lo stesso periodo e allo stesso prezzo, salvo disdetta almeno 24 ore prima della fine del periodo in corso; il rinnovo viene addebitato nelle 24 ore precedenti la fine del periodo.</li><li>L’abbonamento si gestisce e si disdice dalle impostazioni dell’account App Store o Google Play. La disdetta ha effetto alla fine del periodo in corso; fino ad allora Pro resta attivo.</li><li>Alla scadenza dell’abbonamento i dati non vengono eliminati; si disattivano solo le funzioni Pro.</li></ul>"], ["Rimborsi", "I pagamenti sono gestiti dallo store; le richieste di rimborso seguono le regole di App Store o Google Play."], ["Dati e backup", "Poiché i dati si trovano solo sul dispositivo, eseguire backup regolari è responsabilità dell’utente. Non possiamo recuperare dati non salvati in caso di smarrimento o guasto del dispositivo o di eliminazione dell’app."], ["I documenti non sono fatture", "Verbali, contratti, elenchi articoli e report prodotti dall’app non sono fatture né documenti fiscali. Le condizioni di noleggio e i modelli di settore forniti sono solo esempi e non costituiscono consulenza legale o fiscale. Gli obblighi fiscali e di fatturazione restano a carico dell’utente."], ["Responsabilità", "Emanet è fornita «così com’è». Non garantiamo un funzionamento privo di errori o interruzioni. Nei limiti consentiti dalla legge, non rispondiamo di danni indiretti, mancati guadagni o perdita di dati derivanti dall’uso dell’app."], ["Modifiche", "Se questi termini cambiano, la versione aggiornata sarà pubblicata su questa pagina con una nuova data. Continuare a usare l’app dopo una modifica equivale ad accettare i nuovi termini."]]}};
const L=["tr","en","de","fr","it"], APP="Emanet", KEY="emanet-legal-lang";
function langFromHash(){const m=(location.hash||"").match(/^#(tr|en|de|fr|it)(-(privacy|terms|contact))?$/);return m?m[1]:null;}
function pick(){const h=langFromHash();if(h)return h;try{const s=localStorage.getItem(KEY);if(L.includes(s))return s;}catch(x){}
 for(const l of (navigator.languages||[navigator.language||"en"])){const c=String(l).slice(0,2).toLowerCase();if(L.includes(c))return c;}return "en";}
function render(l){const d=T[l];document.documentElement.lang=l;document.title=APP+" – "+d.title;
 document.getElementById("sub").textContent=d.title;
 document.getElementById("langs").innerHTML=L.map(x=>`<button type="button" data-l="${x}" aria-pressed="${x===l}">${T[x].name}</button>`).join("");
 const sec=(id,h,items)=>`<section class="card" id="${l}-${id}"><h2>${h}</h2><p class="upd">${d.updated}</p>${id==="privacy"?`<p class="intro">${d.intro}</p>`:""}${items.map(([a,b])=>`<h3>${a}</h3>${b.startsWith("<")?b:`<p>${b}</p>`}`).join("")}</section>`;
 document.getElementById("main").innerHTML=`<div class="tabs"><a href="#${l}-privacy">${d.privacy}</a><a href="#${l}-terms">${d.terms}</a></div>`+sec("privacy",d.privacy,d.p)+sec("terms",d.terms,d.t)+
  `<section class="card" id="${l}-contact"><h2>${d.contact}</h2><div class="kv"><span>${d.dev}</span><b>Metin Öz</b></div><div class="kv"><span>${d.support}</span><a href="mailto:metin.ozzz@icloud.com?subject=${APP}">metin.ozzz@icloud.com</a></div></section>`;
 document.getElementById("foot").textContent="© "+new Date().getFullYear()+" Metin Öz · "+APP;}
document.addEventListener("click",e=>{const b=e.target.closest("[data-l]");if(b){e.preventDefault();const l=b.dataset.l;render(l);
  try{localStorage.setItem(KEY,l);}catch(x){}try{history.replaceState(null,"","#"+l+"-privacy");}catch(x){}window.scrollTo(0,0);return;}
 const a=e.target.closest('a[href^="#"]');if(a){e.preventDefault();const el=document.getElementById(a.getAttribute("href").slice(1));if(el)el.scrollIntoView({behavior:"smooth"});}});
window.addEventListener("hashchange",()=>{const h=langFromHash();if(h&&document.documentElement.lang!==h)render(h);const el=document.getElementById(location.hash.slice(1));if(el)el.scrollIntoView();});
render(pick());if(location.hash){const el=document.getElementById(location.hash.slice(1));if(el)setTimeout(()=>el.scrollIntoView(),0);}
</script>
