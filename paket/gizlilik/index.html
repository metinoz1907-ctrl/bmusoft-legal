<style>
:root{--primary:#BE185D;--accent:#AE29A2;--bg:#FBF5F8;--card:#FFFFFF;--border:#F1E4EA;--text:#111827;--text2:#6B7280;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--primary:#F47BAD;--bg:#1A0E14;--card:#26161F;--border:#3A2430;--text:#F3F4F6;--text2:#9CA3AF;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(135deg,#BE185D,#AE29A2);color:#fff;padding:36px 16px 64px}
.hw{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:16px}
.hw img{width:64px;height:64px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
h1{margin:0;font-size:28px;line-height:1.15}#sub{margin:2px 0 0;opacity:.9}
main{max-width:760px;margin:0 auto;padding:0 16px 40px}
nav.langs{max-width:760px;margin:-40px auto 16px;padding:0 16px;display:flex;flex-wrap:wrap;gap:8px}
nav.langs button{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
nav.langs button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.tabs a{color:var(--primary);background:var(--card);border:1px solid var(--border);border-radius:999px;padding:6px 12px;text-decoration:none;font-size:14px;font-weight:600}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:22px;margin:0 0 16px}
h2{margin:0 0 4px;font-size:22px}h3{margin:18px 0 4px;font-size:16px}.upd{margin:0 0 10px;color:var(--text2);font-size:13px}.intro{margin:0}
p{margin:0 0 6px}ul{margin:4px 0;padding-left:20px}li{margin:3px 0}a{color:var(--primary)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border)}.kv:last-child{border-bottom:0}.kv span{color:var(--text2)}
footer{text-align:center;color:var(--text2);font-size:13px;padding:0 16px 32px}

<script>
const T={"tr": {"name": "Türkçe", "title": "Gizlilik ve Kullanım Koşulları", "privacy": "Gizlilik Politikası", "terms": "Kullanım Koşulları", "updated": "Son güncelleme: 4 Kasım 2026", "contact": "İletişim", "dev": "Geliştirici", "support": "Destek", "intro": "Paket, evden veya küçük atölyesinde sipariş üzerine üretip satanlar için bir sipariş defteridir. Bu sayfa, Paket’in verilerinizi nasıl işlediğini ve uygulamayı kullanma koşullarını açıklar.", "p": [["Kısaca", "<ul><li>Hesap açmanız veya kayıt olmanız gerekmez.</li><li>Girdiğiniz bütün veriler yalnızca cihazınızda ve sizin seçtiğiniz yedek konumunda saklanır.</li><li>Verileriniz bize veya üçüncü kişilere gönderilmez; uygulamada reklam ve analiz aracı yoktur.</li></ul>"], ["Hangi verileri işliyoruz?", "Uygulamaya girdiğiniz siparişler, müşteri adları, telefon numaraları, adresler, ürünler, fiyatlar, ödemeler, maliyetler, notlar ve fotoğraflar yalnızca cihazınızda tutulur. Müşterilerinize ait bilgileri siz girdiğiniz için bu bilgilerin veri sorumlusu sizsiniz; müşterilerinizin bilgilerini yürürlükteki mevzuata uygun şekilde kullanmanız gerekir."], ["Fotoğraflar ve kamera", "Siparişe, ürüne veya işletme logonuza fotoğraf eklemek istediğinizde uygulama yalnızca sizin izninizle kameraya veya fotoğraf arşivine erişir. Seçtiğiniz fotoğraflar uygulamanın cihazdaki klasöründe saklanır, başka bir yere gönderilmez."], ["Yedekleme", "Elle yedek dosyası oluşturabilir ve istediğiniz yere kaydedebilirsiniz. Pro ile otomatik yedek açıksa yedek dosyası iPhone’da sizin iCloud Drive hesabınıza, Android’de sizin seçtiğiniz Google Drive veya cihaz klasörüne yazılır. Bu dosyalar sizin hesabınızda durur; bizim bu dosyalara erişimimiz yoktur."], ["Paylaşım", "Sipariş fişi, imalat emri, ödeme makbuzu, ürün listesi veya rapor paylaştığınızda cihazınızın paylaşım menüsü açılır ve dosya yalnızca sizin seçtiğiniz uygulamaya veya kişiye gider (örneğin WhatsApp veya e-posta)."], ["Bildirimler", "Teslim hatırlatmaları cihazınızda oluşturulan yerel bildirimlerdir. Bildirim içeriği hiçbir sunucuya gönderilmez; bildirimleri istediğiniz zaman cihaz ayarlarından kapatabilirsiniz."], ["Satın almalar", "Paket Pro aboneliği App Store veya Google Play üzerinden satın alınır. Ödeme bilgileriniz mağaza tarafından işlenir; biz bu bilgileri görmeyiz. Uygulama internete yalnızca aboneliğinizi mağaza üzerinden doğrulamak için bağlanır."], ["Çocuklar", "Paket işletmelere yönelik bir araçtır ve bilerek çocuklardan veri toplamaz."], ["Verilerin silinmesi", "Örnek verileri, tek tek kayıtları veya tüm verileri Ayarlar’dan silebilirsiniz. Uygulamayı kaldırdığınızda cihazdaki veriler de silinir. iCloud Drive, Google Drive veya başka bir klasöre aldığınız yedekleri siz silersiniz."], ["Değişiklikler", "Bu politikayı uygulamadaki değişikliklere göre güncelleyebiliriz. Güncel metin her zaman bu sayfada ve sayfanın başındaki tarihle yayımlanır."]], "t": [["Kabul", "Paket’i indirip kullanarak bu koşulları kabul etmiş olursunuz. App Store ve Google Play’in kendi kullanım koşulları da geçerlidir."], ["Lisans", "Size Paket’i kişisel ve işletme amaçlı kullanmanız için devredilemez, münhasır olmayan bir kullanım hakkı verilir. Uygulamayı kopyalamak, değiştirerek dağıtmak veya yeniden satmak yasaktır."], ["Ücretsiz plan", "İlk 20 siparişi Pro olmadan oluşturabilirsiniz (örnek kayıtlar sayılmaz). Ücretsiz planda paylaşılan fiş ve PDF’lerde küçük bir “Paket ile oluşturuldu” satırı yer alır."], ["Paket Pro aboneliği", "<ul><li>Pro, aylık veya yıllık otomatik yenilenen bir aboneliktir; fiyatlar mağazada kendi para biriminizde gösterilir.</li><li>Ödeme, satın almayı onayladığınızda App Store veya Google Play hesabınızdan alınır.</li><li>Abonelik, dönem bitmeden en az 24 saat önce iptal edilmezse aynı süre ve fiyatla otomatik olarak yenilenir; yenileme ücreti dönem bitmeden önceki 24 saat içinde tahsil edilir.</li><li>Aboneliğinizi mağaza hesabınızın ayarlarından yönetebilir veya iptal edebilirsiniz; iptal, mevcut dönemin sonunda geçerli olur.</li><li>Telefon değiştirdiğinizde “Satın alımları geri yükle” ile Pro’yu geri alabilirsiniz.</li></ul>"], ["İadeler", "İade talepleri App Store veya Google Play’in iade politikalarına göre mağaza tarafından değerlendirilir."], ["Verileriniz ve yedekleriniz", "Verileriniz cihazınızda saklandığı için düzenli yedek almak sizin sorumluluğunuzdadır. Cihazın kaybolması, bozulması veya uygulamanın silinmesi sonucu yedeklenmemiş verilerin kaybından sorumlu değiliz."], ["Belgeler fatura değildir", "Paket’in ürettiği sipariş fişi, imalat emri, ödeme makbuzu ve raporlar bilgi amaçlıdır; fatura veya mali belge yerine geçmez. Esnaf muafiyeti göstergesi yalnızca uygulamaya girdiğiniz tahsilatlara dayanır ve vergi danışmanlığı değildir; vergi yükümlülükleriniz size aittir."], ["Sorumluluk", "Paket “olduğu gibi” sunulur. Uygulamanın kullanımından doğabilecek dolaylı zararlar, kâr kaybı veya veri kaybı için, yürürlükteki hukukun izin verdiği ölçüde sorumluluk kabul etmiyoruz."], ["Değişiklikler", "Bu koşulları güncelleyebiliriz. Güncellemeden sonra uygulamayı kullanmaya devam etmeniz yeni koşulları kabul ettiğiniz anlamına gelir."]]}, "en": {"name": "English", "title": "Privacy and Terms of Use", "privacy": "Privacy Policy", "terms": "Terms of Use", "updated": "Last updated: 4 November 2026", "contact": "Contact", "dev": "Developer", "support": "Support", "intro": "Paket is an order book for people who make and sell to order from home or a small workshop. This page explains how Paket handles your data and the terms for using the app.", "p": [["In short", "<ul><li>You don’t need to create an account or sign up.</li><li>Everything you enter is stored only on your device and in the backup location you choose.</li><li>Your data is never sent to us or to third parties; the app contains no advertising or analytics tools.</li></ul>"], ["What data do we process?", "Orders, customer names, phone numbers, addresses, products, prices, payments, costs, notes and photos you enter are kept only on your device. Because you enter your customers’ details, you are the data controller for that information and must use it in line with applicable law."], ["Photos and camera", "When you add a photo to an order, a product or your business logo, the app accesses the camera or photo library only with your permission. Selected photos are stored in the app’s folder on your device and are not sent anywhere."], ["Backups", "You can create a manual backup file and save it wherever you like. With Pro, automatic backups are written to your own iCloud Drive on iPhone, or to the Google Drive or device folder you choose on Android. These files stay in your account; we have no access to them."], ["Sharing", "When you share an order slip, work order, payment receipt, product list or report, your device’s share menu opens and the file goes only to the app or person you choose (for example WhatsApp or email)."], ["Notifications", "Delivery reminders are local notifications created on your device. Their content is never sent to a server, and you can turn them off at any time in your device settings."], ["Purchases", "The Paket Pro subscription is purchased through the App Store or Google Play. Your payment details are handled by the store; we never see them. The app connects to the internet only to verify your subscription with the store."], ["Children", "Paket is a tool for businesses and does not knowingly collect data from children."], ["Deleting data", "You can delete the sample data, individual records or all data in Settings. Uninstalling the app also deletes the data on the device. Backups you saved to iCloud Drive, Google Drive or another folder are deleted by you."], ["Changes", "We may update this policy as the app changes. The current version is always published on this page with the date shown at the top."]], "t": [["Acceptance", "By downloading and using Paket you agree to these terms. The App Store and Google Play terms of use also apply."], ["Licence", "You are granted a non-transferable, non-exclusive right to use Paket for personal and business purposes. Copying, distributing modified versions or reselling the app is not permitted."], ["Free plan", "You can create your first 20 orders without Pro (sample records don’t count). On the free plan, shared slips and PDFs include a small “Made with Paket” line."], ["Paket Pro subscription", "<ul><li>Pro is an auto-renewing monthly or yearly subscription; prices are shown in the store in your local currency.</li><li>Payment is charged to your App Store or Google Play account when you confirm the purchase.</li><li>The subscription renews automatically for the same period and price unless cancelled at least 24 hours before the end of the current period; your account is charged for renewal within the 24 hours before the period ends.</li><li>You can manage or cancel your subscription in your store account settings; cancellation takes effect at the end of the current period.</li><li>On a new phone, use “Restore purchases” to get Pro back.</li></ul>"], ["Refunds", "Refund requests are handled by the store under the App Store or Google Play refund policies."], ["Your data and backups", "Because your data is stored on your device, you are responsible for making regular backups. We are not liable for the loss of data that was not backed up if a device is lost, damaged or the app is deleted."], ["Documents are not invoices", "Order slips, work orders, payment receipts and reports created by Paket are for information only and are not invoices or tax documents. Your tax obligations remain your own."], ["Liability", "Paket is provided “as is”. To the extent permitted by applicable law, we accept no liability for indirect damages, lost profits or data loss arising from use of the app."], ["Changes", "We may update these terms. Continuing to use the app after an update means you accept the new terms."]]}, "de": {"name": "Deutsch", "title": "Datenschutz und Nutzungsbedingungen", "privacy": "Datenschutzerklärung", "terms": "Nutzungsbedingungen", "updated": "Zuletzt aktualisiert: 4. November 2026", "contact": "Kontakt", "dev": "Entwickler", "support": "Support", "intro": "Paket ist das Auftragsbuch für alle, die von zu Hause oder in einer kleinen Werkstatt auf Bestellung herstellen und verkaufen. Diese Seite erklärt, wie Paket mit Ihren Daten umgeht, und enthält die Bedingungen für die Nutzung der App.", "p": [["Kurz gesagt", "<ul><li>Sie benötigen kein Konto und keine Registrierung.</li><li>Alle Eingaben werden nur auf Ihrem Gerät und am von Ihnen gewählten Sicherungsort gespeichert.</li><li>Ihre Daten werden weder an uns noch an Dritte gesendet; die App enthält keine Werbe- oder Analysewerkzeuge.</li></ul>"], ["Welche Daten verarbeiten wir?", "Aufträge, Kundennamen, Telefonnummern, Adressen, Produkte, Preise, Zahlungen, Kosten, Notizen und Fotos, die Sie eingeben, bleiben nur auf Ihrem Gerät. Da Sie die Daten Ihrer Kunden selbst eingeben, sind Sie für diese Daten Verantwortlicher im Sinne der DSGVO und müssen sie entsprechend dem geltenden Recht verwenden."], ["Fotos und Kamera", "Wenn Sie einem Auftrag, einem Produkt oder Ihrem Logo ein Foto hinzufügen, greift die App nur mit Ihrer Erlaubnis auf Kamera oder Fotomediathek zu. Ausgewählte Fotos werden im App-Ordner auf Ihrem Gerät gespeichert und nirgendwohin gesendet."], ["Sicherung", "Sie können eine Sicherungsdatei manuell erstellen und speichern, wo Sie möchten. Mit Pro wird die automatische Sicherung auf dem iPhone in Ihr eigenes iCloud Drive geschrieben, auf Android in den von Ihnen gewählten Google-Drive- oder Geräteordner. Diese Dateien liegen in Ihrem Konto; wir haben keinen Zugriff darauf."], ["Teilen", "Wenn Sie einen Auftragsbeleg, Arbeitsauftrag, eine Zahlungsquittung, Produktliste oder einen Bericht teilen, öffnet sich das Teilen-Menü Ihres Geräts, und die Datei geht nur an die App oder Person, die Sie auswählen (z. B. WhatsApp oder E-Mail)."], ["Mitteilungen", "Liefererinnerungen sind lokale Mitteilungen, die auf Ihrem Gerät erstellt werden. Ihr Inhalt wird an keinen Server gesendet; Sie können sie jederzeit in den Geräteeinstellungen ausschalten."], ["Käufe", "Das Paket-Pro-Abo wird über den App Store oder Google Play gekauft. Ihre Zahlungsdaten verarbeitet der Store; wir sehen sie nicht. Die App verbindet sich nur mit dem Internet, um Ihr Abo beim Store zu prüfen."], ["Kinder", "Paket ist ein Werkzeug für Unternehmen und erhebt wissentlich keine Daten von Kindern."], ["Löschen von Daten", "Beispieldaten, einzelne Einträge oder alle Daten können Sie in den Einstellungen löschen. Beim Deinstallieren der App werden auch die Daten auf dem Gerät gelöscht. Sicherungen in iCloud Drive, Google Drive oder einem anderen Ordner löschen Sie selbst."], ["Änderungen", "Wir können diese Erklärung an Änderungen der App anpassen. Die aktuelle Fassung wird immer auf dieser Seite mit dem Datum oben veröffentlicht."]], "t": [["Zustimmung", "Mit dem Herunterladen und der Nutzung von Paket stimmen Sie diesen Bedingungen zu. Zusätzlich gelten die Nutzungsbedingungen von App Store und Google Play."], ["Lizenz", "Sie erhalten ein nicht übertragbares, nicht ausschließliches Recht, Paket für private und geschäftliche Zwecke zu nutzen. Kopieren, Verbreiten veränderter Fassungen oder Weiterverkauf der App ist nicht gestattet."], ["Kostenloser Tarif", "Die ersten 20 Aufträge können Sie ohne Pro anlegen (Beispieleinträge zählen nicht). Im kostenlosen Tarif enthalten geteilte Belege und PDFs eine kleine Zeile „Mit Paket erstellt“."], ["Paket-Pro-Abo", "<ul><li>Pro ist ein sich automatisch verlängerndes Monats- oder Jahresabo; die Preise werden im Store in Ihrer Landeswährung angezeigt.</li><li>Die Zahlung wird bei Bestätigung des Kaufs Ihrem App-Store- oder Google-Play-Konto belastet.</li><li>Das Abo verlängert sich automatisch um denselben Zeitraum zum selben Preis, wenn es nicht mindestens 24 Stunden vor Ende des laufenden Zeitraums gekündigt wird; die Verlängerung wird innerhalb der letzten 24 Stunden vor Ende des Zeitraums berechnet.</li><li>Sie können das Abo in den Einstellungen Ihres Store-Kontos verwalten oder kündigen; die Kündigung wird zum Ende des laufenden Zeitraums wirksam.</li><li>Auf einem neuen Telefon erhalten Sie Pro mit „Käufe wiederherstellen“ zurück.</li></ul>"], ["Erstattungen", "Erstattungsanträge werden vom Store nach den Erstattungsrichtlinien von App Store bzw. Google Play bearbeitet."], ["Ihre Daten und Sicherungen", "Da Ihre Daten auf Ihrem Gerät gespeichert sind, sind Sie für regelmäßige Sicherungen verantwortlich. Für den Verlust nicht gesicherter Daten durch Verlust oder Beschädigung des Geräts oder Löschen der App haften wir nicht."], ["Belege sind keine Rechnungen", "Auftragsbelege, Arbeitsaufträge, Zahlungsquittungen und Berichte aus Paket dienen nur der Information und ersetzen keine Rechnung oder steuerlichen Beleg. Ihre steuerlichen Pflichten bleiben Ihre eigenen."], ["Haftung", "Paket wird „wie besehen“ bereitgestellt. Soweit gesetzlich zulässig, haften wir nicht für mittelbare Schäden, entgangenen Gewinn oder Datenverlust aus der Nutzung der App."], ["Änderungen", "Wir können diese Bedingungen aktualisieren. Wenn Sie die App nach einer Aktualisierung weiter nutzen, stimmen Sie den neuen Bedingungen zu."]]}, "fr": {"name": "Français", "title": "Confidentialité et conditions d’utilisation", "privacy": "Politique de confidentialité", "terms": "Conditions d’utilisation", "updated": "Dernière mise à jour : 4 novembre 2026", "contact": "Contact", "dev": "Développeur", "support": "Assistance", "intro": "Paket est le carnet de commandes des personnes qui fabriquent et vendent sur commande, à la maison ou dans un petit atelier. Cette page explique comment Paket traite vos données et les conditions d’utilisation de l’application.", "p": [["En bref", "<ul><li>Aucun compte ni inscription n’est nécessaire.</li><li>Tout ce que vous saisissez est enregistré uniquement sur votre appareil et à l’emplacement de sauvegarde que vous choisissez.</li><li>Vos données ne sont jamais envoyées ni à nous ni à des tiers ; l’application ne contient aucun outil de publicité ou d’analyse.</li></ul>"], ["Quelles données traitons-nous ?", "Les commandes, noms de clients, numéros de téléphone, adresses, produits, prix, paiements, coûts, notes et photos que vous saisissez restent uniquement sur votre appareil. Comme vous saisissez vous-même les données de vos clients, vous en êtes le responsable du traitement au sens du RGPD et devez les utiliser conformément à la loi applicable."], ["Photos et appareil photo", "Lorsque vous ajoutez une photo à une commande, un produit ou votre logo, l’application accède à l’appareil photo ou à la photothèque uniquement avec votre autorisation. Les photos choisies sont enregistrées dans le dossier de l’application sur votre appareil et ne sont envoyées nulle part."], ["Sauvegarde", "Vous pouvez créer manuellement un fichier de sauvegarde et l’enregistrer où vous voulez. Avec Pro, la sauvegarde automatique est écrite dans votre propre iCloud Drive sur iPhone, ou dans le dossier Google Drive ou de l’appareil que vous choisissez sur Android. Ces fichiers restent dans votre compte ; nous n’y avons pas accès."], ["Partage", "Lorsque vous partagez un bon de commande, un ordre de fabrication, un reçu, une liste de produits ou un rapport, le menu de partage de votre appareil s’ouvre et le fichier va uniquement à l’application ou à la personne que vous choisissez (par exemple WhatsApp ou e-mail)."], ["Notifications", "Les rappels de livraison sont des notifications locales créées sur votre appareil. Leur contenu n’est envoyé à aucun serveur et vous pouvez les désactiver à tout moment dans les réglages de l’appareil."], ["Achats", "L’abonnement Paket Pro s’achète via l’App Store ou Google Play. Vos données de paiement sont traitées par le store ; nous ne les voyons pas. L’application se connecte à Internet uniquement pour vérifier votre abonnement auprès du store."], ["Enfants", "Paket est un outil destiné aux professionnels et ne collecte pas sciemment de données concernant des enfants."], ["Suppression des données", "Vous pouvez supprimer les données d’exemple, des enregistrements ou toutes les données dans les Réglages. La désinstallation de l’application supprime aussi les données de l’appareil. Les sauvegardes enregistrées dans iCloud Drive, Google Drive ou un autre dossier sont supprimées par vous."], ["Modifications", "Nous pouvons mettre à jour cette politique en fonction des évolutions de l’application. La version en vigueur est toujours publiée sur cette page avec la date indiquée en haut."]], "t": [["Acceptation", "En téléchargeant et en utilisant Paket, vous acceptez ces conditions. Les conditions d’utilisation de l’App Store et de Google Play s’appliquent également."], ["Licence", "Vous bénéficiez d’un droit d’utilisation non transférable et non exclusif de Paket à des fins personnelles et professionnelles. Il est interdit de copier, de distribuer une version modifiée ou de revendre l’application."], ["Formule gratuite", "Vous pouvez créer vos 20 premières commandes sans Pro (les exemples ne comptent pas). Avec la formule gratuite, les bons et PDF partagés comportent une petite ligne « Créé avec Paket »."], ["Abonnement Paket Pro", "<ul><li>Pro est un abonnement mensuel ou annuel à renouvellement automatique ; les prix sont affichés dans le store dans votre devise.</li><li>Le paiement est débité de votre compte App Store ou Google Play lorsque vous confirmez l’achat.</li><li>L’abonnement se renouvelle automatiquement pour la même durée et au même prix s’il n’est pas résilié au moins 24 heures avant la fin de la période en cours ; le renouvellement est facturé dans les 24 heures précédant la fin de la période.</li><li>Vous pouvez gérer ou résilier l’abonnement dans les réglages de votre compte store ; la résiliation prend effet à la fin de la période en cours.</li><li>Sur un nouveau téléphone, utilisez « Restaurer les achats » pour récupérer Pro.</li></ul>"], ["Remboursements", "Les demandes de remboursement sont traitées par le store selon les politiques de remboursement de l’App Store ou de Google Play."], ["Vos données et sauvegardes", "Vos données étant enregistrées sur votre appareil, il vous appartient de faire des sauvegardes régulières. Nous ne sommes pas responsables de la perte de données non sauvegardées en cas de perte ou de panne de l’appareil ou de suppression de l’application."], ["Les documents ne sont pas des factures", "Les bons de commande, ordres de fabrication, reçus et rapports créés par Paket sont fournis à titre d’information et ne remplacent pas une facture ou un document fiscal. Vos obligations fiscales restent les vôtres."], ["Responsabilité", "Paket est fourni « en l’état ». Dans la mesure permise par la loi applicable, nous déclinons toute responsabilité pour les dommages indirects, pertes de bénéfices ou pertes de données liés à l’utilisation de l’application."], ["Modifications", "Nous pouvons mettre à jour ces conditions. Continuer à utiliser l’application après une mise à jour vaut acceptation des nouvelles conditions."]]}, "it": {"name": "Italiano", "title": "Privacy e termini di utilizzo", "privacy": "Informativa sulla privacy", "terms": "Termini di utilizzo", "updated": "Ultimo aggiornamento: 4 novembre 2026", "contact": "Contatti", "dev": "Sviluppatore", "support": "Assistenza", "intro": "Paket è l’agenda degli ordini per chi produce e vende su ordinazione, da casa o in un piccolo laboratorio. Questa pagina spiega come Paket tratta i tuoi dati e le condizioni di utilizzo dell’app.", "p": [["In breve", "<ul><li>Non serve creare un account né registrarsi.</li><li>Tutto ciò che inserisci viene salvato solo sul tuo dispositivo e nella posizione di backup che scegli.</li><li>I tuoi dati non vengono mai inviati a noi né a terzi; l’app non contiene strumenti di pubblicità o analisi.</li></ul>"], ["Quali dati trattiamo?", "Ordini, nomi dei clienti, numeri di telefono, indirizzi, prodotti, prezzi, pagamenti, costi, note e foto che inserisci restano solo sul tuo dispositivo. Poiché sei tu a inserire i dati dei tuoi clienti, ne sei il titolare del trattamento ai sensi del GDPR e devi utilizzarli nel rispetto della normativa applicabile."], ["Foto e fotocamera", "Quando aggiungi una foto a un ordine, a un prodotto o al tuo logo, l’app accede alla fotocamera o alla libreria foto solo con il tuo permesso. Le foto scelte vengono salvate nella cartella dell’app sul dispositivo e non vengono inviate altrove."], ["Backup", "Puoi creare manualmente un file di backup e salvarlo dove preferisci. Con Pro il backup automatico viene scritto nel tuo iCloud Drive su iPhone, oppure nella cartella di Google Drive o del dispositivo che scegli su Android. Questi file restano nel tuo account; noi non vi abbiamo accesso."], ["Condivisione", "Quando condividi una ricevuta d’ordine, un ordine di lavorazione, una ricevuta di pagamento, un elenco prodotti o un report, si apre il menu di condivisione del dispositivo e il file va solo all’app o alla persona che scegli (ad esempio WhatsApp o e-mail)."], ["Notifiche", "I promemoria di consegna sono notifiche locali create sul dispositivo. Il loro contenuto non viene inviato a nessun server e puoi disattivarle in qualsiasi momento dalle impostazioni del dispositivo."], ["Acquisti", "L’abbonamento Paket Pro si acquista tramite App Store o Google Play. I dati di pagamento sono gestiti dallo store; noi non li vediamo. L’app si connette a Internet solo per verificare l’abbonamento presso lo store."], ["Minori", "Paket è uno strumento per attività professionali e non raccoglie consapevolmente dati di minori."], ["Cancellazione dei dati", "Puoi eliminare i dati di esempio, singoli elementi o tutti i dati dalle Impostazioni. Disinstallando l’app vengono eliminati anche i dati sul dispositivo. I backup salvati su iCloud Drive, Google Drive o in un’altra cartella li elimini tu."], ["Modifiche", "Possiamo aggiornare questa informativa in base alle modifiche dell’app. La versione in vigore è sempre pubblicata su questa pagina con la data indicata in alto."]], "t": [["Accettazione", "Scaricando e utilizzando Paket accetti questi termini. Si applicano inoltre i termini di utilizzo di App Store e Google Play."], ["Licenza", "Ti viene concesso un diritto non trasferibile e non esclusivo di utilizzare Paket per scopi personali e professionali. Non è consentito copiare, distribuire versioni modificate o rivendere l’app."], ["Piano gratuito", "Puoi creare i primi 20 ordini senza Pro (gli esempi non contano). Con il piano gratuito, le ricevute e i PDF condivisi riportano una piccola riga “Creato con Paket”."], ["Abbonamento Paket Pro", "<ul><li>Pro è un abbonamento mensile o annuale con rinnovo automatico; i prezzi sono mostrati nello store nella tua valuta.</li><li>Il pagamento viene addebitato sul tuo account App Store o Google Play alla conferma dell’acquisto.</li><li>L’abbonamento si rinnova automaticamente per lo stesso periodo e allo stesso prezzo se non viene annullato almeno 24 ore prima della fine del periodo in corso; il rinnovo viene addebitato nelle 24 ore precedenti la fine del periodo.</li><li>Puoi gestire o annullare l’abbonamento dalle impostazioni del tuo account store; l’annullamento ha effetto alla fine del periodo in corso.</li><li>Su un nuovo telefono usa “Ripristina acquisti” per recuperare Pro.</li></ul>"], ["Rimborsi", "Le richieste di rimborso sono gestite dallo store secondo le politiche di rimborso di App Store o Google Play."], ["I tuoi dati e i backup", "Poiché i dati sono salvati sul tuo dispositivo, sei responsabile di eseguire backup regolari. Non siamo responsabili della perdita di dati non salvati in caso di smarrimento o guasto del dispositivo o di eliminazione dell’app."], ["I documenti non sono fatture", "Ricevute d’ordine, ordini di lavorazione, ricevute di pagamento e report creati da Paket hanno scopo informativo e non sostituiscono fatture o documenti fiscali. Gli obblighi fiscali restano a tuo carico."], ["Responsabilità", "Paket è fornito “così com’è”. Nei limiti consentiti dalla legge, non rispondiamo di danni indiretti, mancati guadagni o perdita di dati derivanti dall’uso dell’app."], ["Modifiche", "Possiamo aggiornare questi termini. Continuare a usare l’app dopo un aggiornamento significa accettare i nuovi termini."]]}};
const L=["tr","en","de","fr","it"], APP="Paket", DEV="Metin Öz", KEY="paket-legal-lang";
function langFromHash(){const m=(location.hash||"").match(/^#(tr|en|de|fr|it)(-(privacy|terms|contact))?$/);return m?m[1]:null;}
function pick(){const h=langFromHash();if(h)return h;try{const s=localStorage.getItem(KEY);if(L.includes(s))return s;}catch(x){}
 for(const l of (navigator.languages||[navigator.language||"en"])){const c=String(l).slice(0,2).toLowerCase();if(L.includes(c))return c;}return "en";}
function render(l){const d=T[l];document.documentElement.lang=l;document.title=APP+" – "+d.title;
 document.getElementById("sub").textContent=d.title;
 document.getElementById("langs").innerHTML=L.map(x=>`<button type="button" data-l="${x}" aria-pressed="${x===l}">${T[x].name}</button>`).join("");
 const sec=(id,h,items)=>`<section class="card" id="${l}-${id}"><h2>${h}</h2><p class="upd">${d.updated}</p>${id==="privacy"?`<p class="intro">${d.intro}</p>`:""}${items.map(([a,b])=>`<h3>${a}</h3>${b.startsWith("<")?b:`<p>${b}</p>`}`).join("")}</section>`;
 document.getElementById("main").innerHTML=`<div class="tabs"><a href="#${l}-privacy">${d.privacy}</a><a href="#${l}-terms">${d.terms}</a><a href="#${l}-contact">${d.contact}</a></div>`+sec("privacy",d.privacy,d.p)+sec("terms",d.terms,d.t)+
  `<section class="card" id="${l}-contact"><h2>${d.contact}</h2><div class="kv"><span>${d.dev}</span><b>${DEV}</b></div><div class="kv"><span>${d.support}</span><a href="mailto:metin.ozzz@icloud.com?subject=${APP}">metin.ozzz@icloud.com</a></div></section>`;
 document.getElementById("foot").textContent="© "+new Date().getFullYear()+" "+DEV+" · "+APP;}
document.addEventListener("click",e=>{const b=e.target.closest("[data-l]");if(b){e.preventDefault();const l=b.dataset.l;render(l);
  try{localStorage.setItem(KEY,l);}catch(x){}try{history.replaceState(null,"","#"+l+"-privacy");}catch(x){}window.scrollTo(0,0);return;}
 const a=e.target.closest('a[href^="#"]');if(a){e.preventDefault();const el=document.getElementById(a.getAttribute("href").slice(1));if(el)el.scrollIntoView({behavior:"smooth"});}});
window.addEventListener("hashchange",()=>{const h=langFromHash();if(h&&document.documentElement.lang!==h)render(h);const el=document.getElementById(location.hash.slice(1));if(el)el.scrollIntoView();});
render(pick());if(location.hash){const el=document.getElementById(location.hash.slice(1));if(el)setTimeout(()=>el.scrollIntoView(),0);}
</script></body></html>
