<style>
:root{--primary:#5b4be0;--accent:#8a78f5;--bg:#f3f3fa;--card:#fff;--bd:#e7e7f3;--ink:#14142b;--mut:#6f6f8a;--chip:#ebe8fc}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f1c;--card:#1a1a2c;--bd:#2b2b44;--ink:#ecebf9;--mut:#a09fbb;--chip:#2a2650}}
*{box-sizing:border-box}html{scroll-padding-top:16px}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;padding:36px 16px 70px}.hin{max-width:760px;margin:auto;display:flex;gap:16px;align-items:center}
.hin img{width:64px;height:64px;border-radius:16px;box-shadow:0 8px 22px rgba(0,0,0,.28)}h1{margin:0;font-size:26px;line-height:1.15}#sub{opacity:.9;margin-top:2px}
.langs{max-width:760px;margin:-40px auto 0;padding:0 16px;display:flex;flex-wrap:wrap;gap:8px;position:relative}
.langs button{border:0;border-radius:999px;padding:9px 16px;font:inherit;font-weight:700;font-size:14px;background:var(--card);color:var(--ink);box-shadow:0 2px 10px rgba(40,30,120,.15);cursor:pointer}.langs button[aria-pressed=true]{background:var(--primary);color:#fff}
main{max-width:760px;margin:16px auto 0;padding:0 16px 40px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs a{background:var(--chip);color:var(--primary);text-decoration:none;font-weight:700;border-radius:999px;padding:8px 14px;font-size:14px}

const T={"tr": {"name": "Türkçe", "title": "Gizlilik Politikası · Kullanım Koşulları", "privacy": "Gizlilik Politikası", "terms": "Kullanım Koşulları", "updated": "Son güncelleme: 3 Kasım 2026", "contact": "İletişim", "dev": "Geliştirici", "support": "Destek", "intro": "Saha, tamamen telefonunuzda çalışan bir keşif ve teklif defteridir. Bu sayfa, uygulamanın verilerinizi nasıl ele aldığını ve kullanım koşullarını açıklar.", "p": [["Kısaca", "<ul><li>Hesap yok: uygulamayı kullanmak için kayıt olmanız gerekmez.</li><li>Veriler yalnızca telefonunuzda ve sizin seçtiğiniz yedek hesabında tutulur.</li><li>Bize veya üçüncü kişilere hiçbir veri gönderilmez; reklam ve analiz aracı yoktur.</li></ul>"], ["Genel", "<p>Saha - Keşif ve Teklif Takibi tamamen cihazınızda çalışır. Uygulamayı kullanmak için hesap oluşturmanız gerekmez ve verileriniz bir sunucuya gönderilmez.</p>"], ["Topladığımız veriler", "<p>Geliştirici olarak sizinle ilgili hiçbir kişisel veriyi toplamıyor, saklamıyor veya üçüncü kişilerle paylaşmıyoruz. Uygulamaya girdiğiniz müşteri, keşif, parametre, tutar, telefon, adres ve vergi bilgileri; fotoğraflar, imza, logo ve konum yalnızca telefonunuzda saklanır. Uygulamada reklam, analiz veya izleme aracı bulunmaz. Örnek kayıtlar yalnızca sizin deneyiminiz için eklenir; Ayarlar’dan silebilirsiniz.</p>"], ["İzinler", "<p>Uygulama yalnızca şu izinleri ister:</p><ul><li>Kamera: keşif fotoğrafı çekmek için.</li><li>Fotoğraflar: galeriden keşife fotoğraf eklemek için.</li><li>Konum (GPS): yalnızca &quot;Konumu al&quot; düğmesine bastığınızda, keşif yapılan yerin konumunu kaydetmek için. Konum yalnızca o keşif kaydında, cihazınızda saklanır.</li></ul><p>&quot;Haritada aç&quot; veya &quot;Adres Ara&quot; düğmesine bastığınızda ilgili adres ya da konum harita uygulamasında veya tarayıcıda açılır; bu hizmetler kendi gizlilik koşullarına tabidir.</p><p>İnternet bağlantısı yalnızca mağaza üzerinden satın alma doğrulaması ve “Haritada aç” gibi dış bağlantılar için kullanılır.</p>"], ["Yedekleme ve paylaşım", "<p>Yedek aldığınızda uygulama bir dosya hazırlar. Dosyayı nereye kaydedeceğinize (iCloud Drive, Google Drive, cihaz belleği vb.) siz karar verirsiniz. Pro ile açılan otomatik yedekte dosya, seçtiğiniz Google Drive veya iCloud hesabına yazılır; bu hesaba yalnızca siz erişirsiniz, biz erişemeyiz. Keşif raporunu veya teklifi PDF olarak, konumu ya da metni paylaşırken alıcıyı siz seçersiniz. Bu dosyalar, kaydettiğiniz veya gönderdiğiniz hizmetin gizlilik koşullarına tabidir. Yedek dosyası fotoğrafları içerir ve şifrelenmez; güvenli bir yerde saklayın.</p>"], ["Cihaz yedeği", "<p>Telefonunuzda iCloud (iPhone) veya Google (Android) cihaz yedeklemesi açıksa uygulama verileri Apple veya Google tarafından bu yedeğe dahil edilebilir. Bu, kendi hesap ayarlarınıza bağlı bir işlemdir.</p>"], ["Abonelik ödemeleri", "<p>Satın alma işlemi tamamen Apple App Store veya Google Play tarafından yürütülür. Ödeme bilgilerinize erişimimiz yoktur.</p>"], ["Çocuklar", "<p>Saha çocuklara yönelik değildir ve çocuklardan bilerek veri toplamaz.</p>"], ["Verilerin silinmesi", "<p>Uygulamayı telefondan sildiğinizde uygulamadaki tüm veriler silinir. Daha önce aldığınız yedek, PDF ve paylaştığınız dosyalar sizin kontrolünüzdedir, ayrıca silmeniz gerekir.</p>"], ["Üçüncü kişilerin bilgileri", "<p>Müşteri kayıtlarına girdiğiniz bilgilerin, çektiğiniz fotoğrafların ve paylaştığınız konumların hukuka uygun şekilde kullanılmasından (6698 sayılı KVKK dahil) kullanıcı olarak siz sorumlusunuz.</p>"]], "t": [["Kabul", "<p>Saha’yı kullanarak bu koşulları kabul etmiş olursunuz. Apple App Store veya Google Play’in kendi kullanım koşulları da geçerlidir.</p>"], ["Lisans", "<p>Size uygulamayı kişisel veya işletmenizin kullanımı için devredilemez, münhasır olmayan bir kullanım hakkı veriyoruz. Uygulamayı kopyalayamaz, değiştiremez, tersine mühendislik yapamaz veya yeniden satamazsınız.</p>"], ["Ücretsiz kullanım", "<p>İlk 20 işlem ücretsizdir. Müşteri, keşif veya keşif türü eklemek bir işlem sayılır. Silinen kayıtlar bu hakkı geri kazandırmaz. Ücretsiz hak dolduktan sonra yeni işlem eklemek için abonelik gerekir.</p>"], ["Abonelik", "<ul><li>Saha Pro, Aylık ve Yıllık planlarla sunulur. Fiyatlar satın alma ekranında yerel para biriminizle gösterilir.</li><li>Pro ile sınırsız işlem, PDF’de logo ve imza, otomatik yedek (Google Drive / iCloud) ve PDF altındaki “Saha ile oluşturuldu” yazısının kaldırılması açılır.</li><li>Ödeme, satın alma onayında Apple Kimliği veya Google Play hesabınızdan tahsil edilir.</li><li>Abonelik, mevcut dönemin bitiminden en az 24 saat önce iptal edilmedikçe otomatik olarak yenilenir.</li><li>Yenileme ücreti, dönem bitiminden önceki 24 saat içinde hesabınızdan tahsil edilir.</li><li>Aboneliğinizi iPhone&#x27;da Ayarlar › Apple Kimliğiniz › Abonelikler, Android&#x27;de Google Play uygulamasında Profil › Ödemeler ve abonelikler › Abonelikler bölümünden yönetebilir veya iptal edebilirsiniz. İptal ederseniz içinde bulunduğunuz dönemin sonuna kadar kullanmaya devam edersiniz.</li><li>İadeler Apple&#x27;ın veya Google Play&#x27;in iade politikasına tabidir.</li></ul>"], ["Abonelik sona ererse", "<p>Mevcut kayıtlarınızı görüntülemeye, rapor ve teklif almaya ve yedek almaya devam edersiniz. Ücretsiz işlem hakkınız dolmuşsa yeni işlem eklemek için yeniden abone olmanız gerekir.</p>"], ["Verileriniz ve yedekleriniz", "<p>Veriler yalnızca cihazınızda saklandığı için telefonun kaybı veya arızasında verilerin korunması amacıyla düzenli yedek almak sizin sorumluluğunuzdadır.</p>"], ["Belgeler fatura değildir", "<p>Saha ile hazırladığınız keşif raporu ve teklif bilgilendirme amaçlıdır; fatura, irsaliye veya resmî mali belge yerine geçmez. Vergi ve diğer yasal yükümlülükler size aittir.</p>"], ["Sorumluluk", "<p>Uygulama mühendislik, hukuk veya mali müşavirlik hizmeti değildir. Keşif raporları, ölçüler ve tekliflerdeki tutarlar (KDV ve toplamlar dahil) bilgilendirme amaçlıdır; girdiğiniz bilgilerin doğruluğundan ve müşterinize gönderdiğiniz belgelerden siz sorumlusunuz. Veriler yalnızca cihazınızda saklandığından, telefonun kaybı veya arızasında verilerin korunması için düzenli yedek almak sizin sorumluluğunuzdadır. Uygulama &quot;olduğu gibi&quot; sunulur.</p>"], ["Değişiklikler", "<p>Bu koşullar güncellenebilir. Güncel hali uygulamanın içinde yer alır.</p>"]]}, "en": {"name": "English", "title": "Privacy Policy · Terms of Use", "privacy": "Privacy Policy", "terms": "Terms of Use", "updated": "Last updated: 3 November 2026", "contact": "Contact", "dev": "Developer", "support": "Support", "intro": "Saha is a site-survey and quote notebook that works entirely on your phone. This page explains how the app handles your data and the terms of use.", "p": [["In short", "<ul><li>No account: you do not need to sign up to use the app.</li><li>Data stays on your phone and in the backup account you choose.</li><li>No data is sent to us or to third parties; there is no advertising or analytics.</li></ul>"], ["General", "<p>Saha - Site Survey &amp; Quotes works entirely on your device. You do not need to create an account, and your data is not sent to any server.</p>"], ["Data we collect", "<p>As the developer, we do not collect, store or share any personal data about you with third parties. The customer, survey, parameter, amount, phone, address and tax details you enter, as well as photos, signature, logo and location, are stored only on your phone. The app contains no ads, analytics or tracking tools. Sample records are added only for your convenience; you can delete them in Settings.</p>"], ["Permissions", "<p>The app only asks for these permissions:</p><ul><li>Camera: to take survey photos.</li><li>Photos: to add photos from your gallery to a survey.</li><li>Location (GPS): only when you tap &quot;Get location&quot;, to save where the survey was done. The location is stored only in that survey record, on your device.</li></ul><p>When you tap &quot;Open in maps&quot; or &quot;Search Address&quot;, the address or location opens in a maps app or browser; those services are subject to their own privacy terms.</p><p>The internet connection is used only to verify purchases through the store and for external links such as “Open in maps”.</p>"], ["Backup and sharing", "<p>When you create a backup, the app prepares a file. You decide where to save it (iCloud Drive, Google Drive, device storage, etc.). With automatic backup, unlocked by Pro, the file is written to the Google Drive or iCloud account you choose; only you can access that account, we cannot. When you share a survey report or quote as PDF, or share a location or text, you choose the recipient. These files are subject to the privacy terms of the service you save or send them to. The backup file contains photos and is not encrypted; keep it in a safe place.</p>"], ["Device backup", "<p>If iCloud (iPhone) or Google (Android) device backup is turned on, app data may be included in that backup by Apple or Google. This depends on your own account settings.</p>"], ["Subscription payments", "<p>Purchases are handled entirely by the Apple App Store or Google Play. We have no access to your payment details.</p>"], ["Children", "<p>Saha is not directed at children and does not knowingly collect data from children.</p>"], ["Deleting data", "<p>When you delete the app from your phone, all data in the app is deleted. Backups, PDFs and files you shared earlier remain under your control, and you need to delete them separately.</p>"], ["Third-party information", "<p>You, as the user, are responsible for the lawful use (including under GDPR and local data protection laws) of the information you enter into customer records, the photos you take and the locations you share.</p>"]], "t": [["Acceptance", "<p>By using Saha you accept these terms. The terms of the Apple App Store or Google Play also apply.</p>"], ["License", "<p>We grant you a non-transferable, non-exclusive right to use the app for yourself or your business. You may not copy, modify, reverse engineer or resell the app.</p>"], ["Free use", "<p>The first 20 actions are free. Adding a customer, a survey or a survey type counts as one action. Deleted records do not give the allowance back. Once the free allowance is used up, a subscription is required to add new items.</p>"], ["Subscription", "<ul><li>Saha Pro is offered as Monthly and Yearly plans. Prices are shown on the purchase screen in your local currency.</li><li>Pro unlocks unlimited actions, logo and signature in PDFs, automatic backup (Google Drive / iCloud) and removal of the “Created by Saha” line at the bottom of PDFs.</li><li>Payment is charged to your Apple ID or Google Play account when you confirm the purchase.</li><li>The subscription renews automatically unless it is canceled at least 24 hours before the end of the current period.</li><li>The renewal fee is charged to your account within 24 hours before the end of the period.</li><li>You can manage or cancel your subscription on iPhone under Settings › your Apple ID › Subscriptions, and on Android in the Google Play app under Profile › Payments &amp; subscriptions › Subscriptions. If you cancel, you can keep using it until the end of the current period.</li><li>Refunds are subject to Apple&#x27;s or Google Play&#x27;s refund policy.</li></ul>"], ["If the subscription ends", "<p>You can still view your existing records, create reports and quotes, and make backups. If your free allowance is used up, you need to subscribe again to add new items.</p>"], ["Your data and backups", "<p>Because data is stored only on your device, it is your responsibility to make regular backups to protect it if your phone is lost or damaged.</p>"], ["Documents are not invoices", "<p>Survey reports and quotes you prepare with Saha are for information only; they do not replace an invoice, delivery note or official financial document. Tax and other legal obligations are yours.</p>"], ["Liability", "<p>The app is not an engineering, legal or accounting service. Survey reports, measurements and the amounts in quotes (including VAT and totals) are for information only; you are responsible for the accuracy of the information you enter and for the documents you send to your customers. Because data is stored only on your device, it is your responsibility to make regular backups in case the phone is lost or fails. The app is provided &quot;as is&quot;.</p>"], ["Changes", "<p>These terms may be updated. The current version is available inside the app.</p>"]]}, "de": {"name": "Deutsch", "title": "Datenschutzerklärung · Nutzungsbedingungen", "privacy": "Datenschutzerklärung", "terms": "Nutzungsbedingungen", "updated": "Zuletzt aktualisiert: 3. November 2026", "contact": "Kontakt", "dev": "Entwickler", "support": "Support", "intro": "Saha ist ein Aufmaß- und Angebotsbuch, das vollständig auf Ihrem Telefon läuft. Diese Seite erklärt, wie die App mit Ihren Daten umgeht, und enthält die Nutzungsbedingungen.", "p": [["Kurz gesagt", "<ul><li>Kein Konto: Zur Nutzung der App ist keine Registrierung nötig.</li><li>Daten bleiben auf Ihrem Telefon und im Sicherungskonto Ihrer Wahl.</li><li>Es werden keine Daten an uns oder Dritte gesendet; es gibt keine Werbung und keine Analyse.</li></ul>"], ["Allgemeines", "<p>Saha - Aufmaß &amp; Angebote läuft vollständig auf Ihrem Gerät. Sie müssen kein Konto erstellen, und Ihre Daten werden nicht an einen Server gesendet.</p>"], ["Daten, die wir erheben", "<p>Als Entwickler erheben, speichern oder teilen wir keinerlei personenbezogene Daten über Sie mit Dritten. Die von Ihnen eingegebenen Kunden-, Aufmaß-, Parameter-, Betrags-, Telefon-, Adress- und Steuerangaben sowie Fotos, Unterschrift, Logo und Standort werden ausschließlich auf Ihrem Telefon gespeichert. Die App enthält keine Werbung, Analyse- oder Tracking-Tools. Beispieleinträge werden nur zu Ihrer Orientierung angelegt; Sie können sie in den Einstellungen löschen.</p>"], ["Berechtigungen", "<p>Die App fragt nur diese Berechtigungen ab:</p><ul><li>Kamera: um Aufmaßfotos aufzunehmen.</li><li>Fotos: um Fotos aus der Mediathek zu einem Aufmaß hinzuzufügen.</li><li>Standort (GPS): nur wenn Sie auf &quot;Standort erfassen&quot; tippen, um zu speichern, wo das Aufmaß erfolgte. Der Standort wird nur in diesem Aufmaß auf Ihrem Gerät gespeichert.</li></ul><p>Wenn Sie auf &quot;In Karten öffnen&quot; oder &quot;Adresse suchen&quot; tippen, wird die Adresse bzw. der Standort in einer Karten-App oder im Browser geöffnet; für diese Dienste gelten deren eigene Datenschutzbestimmungen.</p><p>Die Internetverbindung wird nur zur Überprüfung von Käufen über den Store und für externe Links wie „In Karten öffnen“ genutzt.</p>"], ["Sicherung und Teilen", "<p>Wenn Sie eine Sicherung erstellen, bereitet die App eine Datei vor. Wo Sie sie speichern (iCloud Drive, Google Drive, Gerätespeicher usw.), entscheiden Sie. Bei der automatischen Sicherung, die mit Pro freigeschaltet wird, wird die Datei in das von Ihnen gewählte Google-Drive- oder iCloud-Konto geschrieben; nur Sie haben Zugriff auf dieses Konto, wir nicht. Auch beim Teilen eines Aufmaßberichts oder Angebots als PDF, eines Standorts oder eines Textes wählen Sie den Empfänger selbst. Für diese Dateien gelten die Datenschutzbestimmungen des Dienstes, in dem Sie sie speichern oder an den Sie sie senden. Die Sicherungsdatei enthält Fotos und ist nicht verschlüsselt; bewahren Sie sie an einem sicheren Ort auf.</p>"], ["Gerätesicherung", "<p>Ist die Gerätesicherung von iCloud (iPhone) oder Google (Android) aktiviert, können App-Daten von Apple oder Google in diese Sicherung aufgenommen werden. Das hängt von Ihren eigenen Kontoeinstellungen ab.</p>"], ["Abonnementzahlungen", "<p>Käufe werden vollständig über den Apple App Store oder Google Play abgewickelt. Wir haben keinen Zugriff auf Ihre Zahlungsdaten.</p>"], ["Kinder", "<p>Saha richtet sich nicht an Kinder und erhebt wissentlich keine Daten von Kindern.</p>"], ["Löschen von Daten", "<p>Wenn Sie die App vom Telefon löschen, werden alle Daten in der App gelöscht. Zuvor erstellte Sicherungen, PDFs und geteilte Dateien bleiben unter Ihrer Kontrolle und müssen von Ihnen separat gelöscht werden.</p>"], ["Angaben Dritter", "<p>Sie als Nutzer sind für die rechtmäßige Verwendung (auch nach DSGVO und lokalen Datenschutzgesetzen) der Angaben in den Kundendatensätzen, der aufgenommenen Fotos und der geteilten Standorte verantwortlich.</p>"]], "t": [["Zustimmung", "<p>Mit der Nutzung von Saha akzeptieren Sie diese Bedingungen. Zusätzlich gelten die Bedingungen des Apple App Store bzw. von Google Play.</p>"], ["Lizenz", "<p>Wir räumen Ihnen ein nicht übertragbares, nicht ausschließliches Recht ein, die App für sich oder Ihren Betrieb zu nutzen. Sie dürfen die App nicht kopieren, verändern, zurückentwickeln oder weiterverkaufen.</p>"], ["Kostenlose Nutzung", "<p>Die ersten 20 Vorgänge sind kostenlos. Das Hinzufügen eines Kunden, eines Aufmaßes oder einer Aufmaßart zählt als ein Vorgang. Gelöschte Einträge geben dieses Kontingent nicht zurück. Ist das kostenlose Kontingent aufgebraucht, ist für neue Einträge ein Abonnement erforderlich.</p>"], ["Abonnement", "<ul><li>Saha Pro wird als Monats- und Jahresabo angeboten. Die Preise werden im Kaufdialog in Ihrer Landeswährung angezeigt.</li><li>Pro schaltet unbegrenzte Vorgänge, Logo und Unterschrift in PDFs, die automatische Sicherung (Google Drive / iCloud) und das Entfernen des Hinweises „Erstellt mit Saha“ am Ende der PDFs frei.</li><li>Die Zahlung wird bei Bestätigung des Kaufs Ihrer Apple-ID oder Ihrem Google-Play-Konto belastet.</li><li>Das Abonnement verlängert sich automatisch, sofern es nicht mindestens 24 Stunden vor Ende des laufenden Zeitraums gekündigt wird.</li><li>Die Verlängerungsgebühr wird innerhalb von 24 Stunden vor Ende des Zeitraums Ihrem Konto belastet.</li><li>Sie können Ihr Abonnement auf dem iPhone unter Einstellungen › Ihre Apple-ID › Abonnements und auf Android in der Google-Play-App unter Profil › Zahlungen und Abos › Abos verwalten oder kündigen. Bei Kündigung können Sie die App bis zum Ende des laufenden Zeitraums weiter nutzen.</li><li>Erstattungen unterliegen den Rückerstattungsrichtlinien von Apple bzw. Google Play.</li></ul>"], ["Wenn das Abonnement endet", "<p>Sie können vorhandene Einträge weiterhin ansehen, Berichte und Angebote erstellen und Sicherungen anlegen. Ist Ihr kostenloses Kontingent aufgebraucht, müssen Sie erneut abonnieren, um neue Einträge hinzuzufügen.</p>"], ["Ihre Daten und Sicherungen", "<p>Da die Daten nur auf Ihrem Gerät gespeichert werden, liegt es in Ihrer Verantwortung, regelmäßig Sicherungen zu erstellen, damit sie bei Verlust oder Defekt des Telefons erhalten bleiben.</p>"], ["Belege sind keine Rechnungen", "<p>Mit Saha erstellte Aufmaßberichte und Angebote dienen der Information; sie ersetzen keine Rechnung, keinen Lieferschein und kein amtliches Finanzdokument. Steuerliche und sonstige gesetzliche Pflichten liegen bei Ihnen.</p>"], ["Haftung", "<p>Die App ist keine Ingenieur-, Rechts- oder Buchhaltungsleistung. Aufmaßberichte, Maße und die Beträge in Angeboten (einschließlich MwSt. und Summen) dienen nur zur Information; für die Richtigkeit Ihrer Eingaben und für die an Ihre Kunden gesendeten Dokumente sind Sie verantwortlich. Da die Daten nur auf Ihrem Gerät gespeichert werden, sind Sie dafür verantwortlich, regelmäßig Sicherungen zu erstellen, falls das Telefon verloren geht oder ausfällt. Die App wird &quot;wie besehen&quot; bereitgestellt.</p>"], ["Änderungen", "<p>Diese Bedingungen können aktualisiert werden. Die aktuelle Fassung finden Sie in der App.</p>"]]}, "fr": {"name": "Français", "title": "Politique de confidentialité · Conditions d'utilisation", "privacy": "Politique de confidentialité", "terms": "Conditions d'utilisation", "updated": "Dernière mise à jour : 3 novembre 2026", "contact": "Contact", "dev": "Développeur", "support": "Assistance", "intro": "Saha est un carnet de relevés et de devis qui fonctionne entièrement sur votre téléphone. Cette page explique comment l’application traite vos données et présente les conditions d’utilisation.", "p": [["En bref", "<ul><li>Pas de compte : aucune inscription n’est nécessaire pour utiliser l’application.</li><li>Les données restent sur votre téléphone et dans le compte de sauvegarde que vous choisissez.</li><li>Aucune donnée n’est envoyée à nous ni à des tiers ; il n’y a ni publicité ni outil d’analyse.</li></ul>"], ["Généralités", "<p>Saha - Relevés &amp; Devis fonctionne entièrement sur votre appareil. Vous n&#x27;avez pas besoin de créer de compte et vos données ne sont envoyées à aucun serveur.</p>"], ["Données collectées", "<p>En tant que développeur, nous ne collectons, ne conservons et ne partageons avec des tiers aucune donnée personnelle vous concernant. Les informations de clients, de relevés, de paramètres, de montants, de téléphone, d&#x27;adresse et fiscales que vous saisissez, ainsi que les photos, la signature, le logo et la position, sont stockés uniquement sur votre téléphone. L&#x27;application ne contient ni publicité, ni outil d&#x27;analyse ou de suivi. Les exemples sont ajoutés uniquement pour votre confort ; vous pouvez les supprimer dans les Réglages.</p>"], ["Autorisations", "<p>L&#x27;application ne demande que ces autorisations :</p><ul><li>Appareil photo : pour prendre des photos de relevé.</li><li>Photos : pour ajouter à un relevé des photos de votre photothèque.</li><li>Localisation (GPS) : uniquement lorsque vous appuyez sur « Obtenir la position », pour enregistrer le lieu du relevé. La position est stockée uniquement dans ce relevé, sur votre appareil.</li></ul><p>Lorsque vous appuyez sur « Ouvrir dans les cartes » ou « Rechercher l&#x27;adresse », l&#x27;adresse ou la position s&#x27;ouvre dans une application de cartes ou un navigateur ; ces services sont soumis à leurs propres conditions de confidentialité.</p><p>La connexion Internet sert uniquement à vérifier les achats via le store et pour les liens externes comme « Ouvrir dans les cartes ».</p>"], ["Sauvegarde et partage", "<p>Lorsque vous créez une sauvegarde, l’application prépare un fichier. Vous décidez où l’enregistrer (iCloud Drive, Google Drive, mémoire de l’appareil, etc.). Avec la sauvegarde automatique, débloquée par Pro, le fichier est écrit dans le compte Google Drive ou iCloud que vous choisissez ; vous seul avez accès à ce compte, pas nous. Lorsque vous partagez un rapport de relevé ou un devis en PDF, une position ou un texte, vous choisissez le destinataire. Ces fichiers sont soumis aux conditions de confidentialité du service où vous les enregistrez ou auquel vous les envoyez. Le fichier de sauvegarde contient les photos et n’est pas chiffré ; conservez-le en lieu sûr.</p>"], ["Sauvegarde de l'appareil", "<p>Si la sauvegarde de l&#x27;appareil iCloud (iPhone) ou Google (Android) est activée, les données de l&#x27;application peuvent être incluses dans cette sauvegarde par Apple ou Google. Cela dépend des réglages de votre propre compte.</p>"], ["Paiements d'abonnement", "<p>Les achats sont entièrement gérés par l&#x27;App Store d&#x27;Apple ou Google Play. Nous n&#x27;avons pas accès à vos informations de paiement.</p>"], ["Enfants", "<p>Saha ne s’adresse pas aux enfants et ne collecte pas sciemment de données d’enfants.</p>"], ["Suppression des données", "<p>Lorsque vous supprimez l&#x27;application du téléphone, toutes les données de l&#x27;application sont supprimées. Les sauvegardes, PDF et fichiers partagés auparavant restent sous votre contrôle et doivent être supprimés séparément.</p>"], ["Informations de tiers", "<p>En tant qu&#x27;utilisateur, vous êtes responsable de l&#x27;utilisation licite (y compris au regard du RGPD et des lois locales sur la protection des données) des informations saisies dans les fiches clients, des photos prises et des positions partagées.</p>"]], "t": [["Acceptation", "<p>En utilisant Saha, vous acceptez ces conditions. Les conditions de l’App Store d’Apple ou de Google Play s’appliquent également.</p>"], ["Licence", "<p>Nous vous accordons un droit d’utilisation non transférable et non exclusif de l’application pour vous-même ou votre entreprise. Vous ne pouvez ni copier, ni modifier, ni décompiler, ni revendre l’application.</p>"], ["Utilisation gratuite", "<p>Les 20 premières opérations sont gratuites. Ajouter un client, un relevé ou un type de relevé compte pour une opération. Les éléments supprimés ne rendent pas ce quota. Une fois le quota gratuit épuisé, un abonnement est nécessaire pour ajouter de nouveaux éléments.</p>"], ["Abonnement", "<ul><li>Saha Pro est proposé en formules Mensuelle et Annuelle. Les prix s’affichent sur l’écran d’achat dans votre devise locale.</li><li>Pro débloque les opérations illimitées, le logo et la signature dans les PDF, la sauvegarde automatique (Google Drive / iCloud) et la suppression de la mention « Créé avec Saha » en bas des PDF.</li><li>Le paiement est débité de votre identifiant Apple ou de votre compte Google Play à la confirmation de l&#x27;achat.</li><li>L&#x27;abonnement est renouvelé automatiquement, sauf s&#x27;il est annulé au moins 24 heures avant la fin de la période en cours.</li><li>Les frais de renouvellement sont débités de votre compte dans les 24 heures précédant la fin de la période.</li><li>Vous pouvez gérer ou annuler votre abonnement sur iPhone dans Réglages › votre identifiant Apple › Abonnements, et sur Android dans l&#x27;application Google Play, sous Profil › Paiements et abonnements › Abonnements. Si vous annulez, vous pouvez continuer à l&#x27;utiliser jusqu&#x27;à la fin de la période en cours.</li><li>Les remboursements sont soumis à la politique de remboursement d&#x27;Apple ou de Google Play.</li></ul>"], ["Si l'abonnement prend fin", "<p>Vous pouvez toujours consulter vos enregistrements existants, créer des rapports et des devis et faire des sauvegardes. Si votre quota gratuit est épuisé, vous devez vous réabonner pour ajouter de nouveaux éléments.</p>"], ["Vos données et sauvegardes", "<p>Les données n’étant stockées que sur votre appareil, il vous appartient de faire des sauvegardes régulières pour les protéger en cas de perte ou de panne du téléphone.</p>"], ["Les documents ne sont pas des factures", "<p>Les rapports de relevé et devis préparés avec Saha sont fournis à titre d’information ; ils ne remplacent ni une facture, ni un bon de livraison, ni un document financier officiel. Les obligations fiscales et légales vous incombent.</p>"], ["Responsabilité", "<p>L&#x27;application n&#x27;est pas un service d&#x27;ingénierie, juridique ou comptable. Les rapports de relevé, les mesures et les montants des devis (y compris la TVA et les totaux) sont fournis à titre indicatif ; vous êtes responsable de l&#x27;exactitude des informations saisies et des documents envoyés à vos clients. Les données n&#x27;étant stockées que sur votre appareil, il vous appartient de faire des sauvegardes régulières en cas de perte ou de panne du téléphone. L&#x27;application est fournie « en l&#x27;état ».</p>"], ["Modifications", "<p>Ces conditions peuvent être mises à jour. La version actuelle se trouve dans l&#x27;application.</p>"]]}, "it": {"name": "Italiano", "title": "Informativa sulla privacy · Condizioni d'uso", "privacy": "Informativa sulla privacy", "terms": "Condizioni d'uso", "updated": "Ultimo aggiornamento: 3 novembre 2026", "contact": "Contatti", "dev": "Sviluppatore", "support": "Assistenza", "intro": "Saha è un quaderno di sopralluoghi e preventivi che funziona interamente sul tuo telefono. Questa pagina spiega come l’app tratta i tuoi dati e riporta le condizioni d’uso.", "p": [["In breve", "<ul><li>Nessun account: non serve registrarsi per usare l’app.</li><li>I dati restano sul tuo telefono e nell’account di backup che scegli.</li><li>Nessun dato viene inviato a noi o a terzi; non ci sono pubblicità né strumenti di analisi.</li></ul>"], ["Generale", "<p>Saha - Sopralluoghi &amp; Preventivi funziona interamente sul tuo dispositivo. Non devi creare un account e i tuoi dati non vengono inviati a nessun server.</p>"], ["Dati raccolti", "<p>Come sviluppatore, non raccogliamo, non conserviamo e non condividiamo con terzi alcun dato personale che ti riguarda. I dati di clienti, sopralluoghi, parametri, importi, telefono, indirizzo e dati fiscali che inserisci, insieme a foto, firma, logo e posizione, restano memorizzati solo sul tuo telefono. L&#x27;app non contiene pubblicità, strumenti di analisi o di tracciamento. I record di esempio vengono aggiunti solo per comodità; puoi eliminarli dalle Impostazioni.</p>"], ["Autorizzazioni", "<p>L&#x27;app richiede solo queste autorizzazioni:</p><ul><li>Fotocamera: per scattare le foto del sopralluogo.</li><li>Foto: per aggiungere a un sopralluogo foto dalla libreria.</li><li>Posizione (GPS): solo quando tocchi &quot;Rileva posizione&quot;, per salvare dove è stato fatto il sopralluogo. La posizione è memorizzata solo in quel sopralluogo, sul tuo dispositivo.</li></ul><p>Quando tocchi &quot;Apri nelle mappe&quot; o &quot;Cerca indirizzo&quot;, l&#x27;indirizzo o la posizione si apre in un&#x27;app di mappe o nel browser; questi servizi sono soggetti alle proprie condizioni sulla privacy.</p><p>La connessione a Internet serve solo per verificare gli acquisti tramite lo store e per i link esterni come «Apri nelle mappe».</p>"], ["Backup e condivisione", "<p>Quando crei un backup, l’app prepara un file. Sei tu a decidere dove salvarlo (iCloud Drive, Google Drive, memoria del dispositivo, ecc.). Con il backup automatico, sbloccato da Pro, il file viene scritto nell’account Google Drive o iCloud che scegli; solo tu hai accesso a quell’account, noi no. Anche quando condividi un rapporto di sopralluogo o un preventivo in PDF, una posizione o un testo, scegli tu il destinatario. Questi file sono soggetti alle condizioni sulla privacy del servizio in cui li salvi o a cui li invii. Il file di backup contiene le foto e non è crittografato; conservalo in un luogo sicuro.</p>"], ["Backup del dispositivo", "<p>Se il backup del dispositivo iCloud (iPhone) o Google (Android) è attivo, i dati dell&#x27;app possono essere inclusi in quel backup da Apple o Google. Dipende dalle impostazioni del tuo account.</p>"], ["Pagamenti dell'abbonamento", "<p>Gli acquisti sono gestiti interamente da Apple App Store o Google Play. Non abbiamo accesso ai tuoi dati di pagamento.</p>"], ["Minori", "<p>Saha non è rivolta ai minori e non raccoglie consapevolmente dati di minori.</p>"], ["Eliminazione dei dati", "<p>Quando elimini l&#x27;app dal telefono, tutti i dati dell&#x27;app vengono eliminati. Backup, PDF e file condivisi in precedenza restano sotto il tuo controllo e devi eliminarli separatamente.</p>"], ["Informazioni di terzi", "<p>Come utente, sei responsabile dell&#x27;uso lecito (anche ai sensi del GDPR e delle leggi locali sulla protezione dei dati) delle informazioni inserite nelle schede cliente, delle foto scattate e delle posizioni condivise.</p>"]], "t": [["Accettazione", "<p>Usando Saha accetti queste condizioni. Si applicano anche i termini dell’App Store di Apple o di Google Play.</p>"], ["Licenza", "<p>Ti concediamo un diritto di utilizzo non trasferibile e non esclusivo dell’app per te o per la tua attività. Non puoi copiare, modificare, decompilare o rivendere l’app.</p>"], ["Uso gratuito", "<p>Le prime 20 operazioni sono gratuite. Aggiungere un cliente, un sopralluogo o un tipo di sopralluogo conta come un&#x27;operazione. Gli elementi eliminati non restituiscono questo limite. Esaurito il limite gratuito, per aggiungere nuovi elementi serve un abbonamento.</p>"], ["Abbonamento", "<ul><li>Saha Pro è offerto con piani Mensile e Annuale. I prezzi sono mostrati nella schermata di acquisto nella tua valuta locale.</li><li>Pro sblocca operazioni illimitate, logo e firma nei PDF, backup automatico (Google Drive / iCloud) e la rimozione della dicitura «Creato con Saha» in fondo ai PDF.</li><li>Il pagamento viene addebitato sul tuo ID Apple o account Google Play alla conferma dell&#x27;acquisto.</li><li>L&#x27;abbonamento si rinnova automaticamente, a meno che non venga annullato almeno 24 ore prima della fine del periodo in corso.</li><li>Il costo del rinnovo viene addebitato sul tuo account nelle 24 ore precedenti la fine del periodo.</li><li>Puoi gestire o annullare l&#x27;abbonamento su iPhone in Impostazioni › il tuo ID Apple › Abbonamenti, e su Android nell&#x27;app Google Play in Profilo › Pagamenti e abbonamenti › Abbonamenti. Se annulli, puoi continuare a usarlo fino alla fine del periodo in corso.</li><li>I rimborsi sono soggetti alla politica di rimborso di Apple o Google Play.</li></ul>"], ["Se l'abbonamento termina", "<p>Puoi continuare a consultare i record esistenti, creare rapporti e preventivi ed effettuare backup. Se il limite gratuito è esaurito, devi abbonarti di nuovo per aggiungere nuovi elementi.</p>"], ["I tuoi dati e backup", "<p>Poiché i dati sono salvati solo sul tuo dispositivo, è tua responsabilità fare backup regolari per proteggerli in caso di smarrimento o guasto del telefono.</p>"], ["I documenti non sono fatture", "<p>I rapporti di sopralluogo e i preventivi preparati con Saha hanno scopo informativo; non sostituiscono una fattura, un documento di trasporto né un documento fiscale ufficiale. Gli obblighi fiscali e di legge restano a tuo carico.</p>"], ["Responsabilità", "<p>L&#x27;app non è un servizio di ingegneria, legale o contabile. I rapporti di sopralluogo, le misure e gli importi dei preventivi (inclusi IVA e totali) hanno solo scopo informativo; sei responsabile dell&#x27;esattezza delle informazioni inserite e dei documenti inviati ai tuoi clienti. Poiché i dati sono memorizzati solo sul tuo dispositivo, è tua responsabilità eseguire backup regolari in caso di smarrimento o guasto del telefono. L&#x27;app è fornita &quot;così com&#x27;è&quot;.</p>"], ["Modifiche", "<p>Queste condizioni possono essere aggiornate. La versione attuale è disponibile nell&#x27;app.</p>"]]}};
const L=["tr","en","de","fr","it"], APP="Saha", KEY="saha-legal-lang";
function langFromHash(){const m=(location.hash||"").match(/^#(tr|en|de|fr|it)(-(privacy|terms|contact))?$/);return m?m[1]:null;}
function pick(){const h=langFromHash();if(h)return h;try{const s=localStorage.getItem(KEY);if(L.includes(s))return s;}catch(x){}
 for(const l of (navigator.languages||[navigator.language||"en"])){const c=String(l).slice(0,2).toLowerCase();if(L.includes(c))return c;}return "en";}
function render(l){const d=T[l];document.documentElement.lang=l;document.title=APP+" – "+d.title;
 document.getElementById("sub").textContent=d.title;
 document.getElementById("langs").innerHTML=L.map(x=>`<button type="button" data-l="${x}" aria-pressed="${x===l}">${T[x].name}</button>`).join("");
 const sec=(id,h,items)=>`<section class="card" id="${l}-${id}"><h2>${h}</h2><p class="upd">${d.updated}</p>${id==="privacy"?`<p class="intro">${d.intro}</p>`:""}${items.map(([a,b])=>`<h3>${a}</h3>${b.startsWith("<")?b:`<p>${b}</p>`}`).join("")}</section>`;
 document.getElementById("main").innerHTML=`<div class="tabs"><a href="#${l}-privacy">${d.privacy}</a><a href="#${l}-terms">${d.terms}</a></div>`+sec("privacy",d.privacy,d.p)+sec("terms",d.terms,d.t)+
  `<section class="card" id="${l}-contact"><h2>${d.contact}</h2><div class="kv"><span>${d.dev}</span><b>Metin Öz</b></div><div class="kv"><span>${d.support}</span><a href="mailto:metin.ozzz@icloud.com?subject=${APP}">metin.ozzz@icloud.com</a></div></section>`;
 document.getElementById("foot").textContent="© "+new Date().getFullYear()+" Metin Öz · "+APP;}
document.addEventListener("click",e=>{const b=e.target.closest("[data-l]");if(b){e.preventDefault();const l=b.dataset.l;render(l);
  try{localStorage.setItem(KEY,l);}catch(x){}try{history.replaceState(null,"","#"+l+"-privacy");}catch(x){}window.scrollTo(0,0);return;}
 const a=e.target.closest('a[href^="#"]');if(a){e.preventDefault();const el=document.getElementById(a.getAttribute("href").slice(1));if(el)el.scrollIntoView({behavior:"smooth"});}});
window.addEventListener("hashchange",()=>{const h=langFromHash();if(h&&document.documentElement.lang!==h)render(h);const el=document.getElementById(location.hash.slice(1));if(el)el.scrollIntoView();});
render(pick());if(location.hash){const el=document.getElementById(location.hash.slice(1));if(el)setTimeout(()=>el.scrollIntoView(),0);}
</script></body></html>
